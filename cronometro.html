<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="app-crono.webmanifest">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon/crono-192.png">
<title>Verificación de cronómetros contra UTC</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;
  --acc:#4493f8;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--org:#ff7b40}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);padding:0 0 40px;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:12px}
h1{margin:0;font-size:16px;font-weight:600}
h2{margin:22px 0 6px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}

#reloj{background:#000;border:1px solid var(--line);border-radius:10px;padding:16px 10px;text-align:center;margin:10px 0}
#utc{font:700 clamp(30px,10.5vw,54px)/1 ui-monospace,monospace;letter-spacing:.01em}
#fecha{font:600 14px ui-monospace,monospace;color:var(--dim);margin-top:6px}
#estado{font-size:12px;margin-top:9px;color:var(--dim)}
#crono{background:#07100a;border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;margin:10px 0}
#crNum{font:700 clamp(26px,8.5vw,44px)/1 ui-monospace,monospace;color:var(--ok)}
#crEt{font-size:11.5px;color:var(--dim);margin-top:5px}

.row{display:flex;gap:8px;align-items:center;margin:7px 0}
.row>label{flex:0 0 150px;color:var(--dim);font-size:12.5px}
input,select,textarea{flex:1 1 auto;min-width:0;background:#0d1117;color:var(--txt);
  border:1px solid var(--line);border-radius:6px;padding:8px 9px;font:14px ui-monospace,monospace}
textarea{font-size:12.5px;line-height:1.45;width:100%;min-height:230px}
.u{flex:0 0 auto;color:var(--dim);font-size:12px;width:52px}
button{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;font-size:13.5px;font-weight:500}
button:active{background:#30363d}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.g{background:var(--ok);border-color:var(--ok);color:#06240f}
button.o{background:var(--org);border-color:var(--org);color:#1a1000}
.btns{display:flex;gap:8px;margin:9px 0;flex-wrap:wrap}
.btns>button{flex:1 1 130px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin:9px 0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;color:var(--dim)}
.kv b{color:var(--txt);font-family:ui-monospace,monospace;font-weight:600;text-align:right}
.big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0}
.big b{font:700 26px/1.1 ui-monospace,monospace}
.big s{text-decoration:none;color:var(--dim);font-size:12px}
.verdict{margin-top:10px;padding:9px 11px;border-radius:6px;font-weight:600;font-size:13px;text-align:center}
.v-ok{background:rgba(63,185,80,.16);color:var(--ok);border:1px solid rgba(63,185,80,.4)}
.v-no{background:rgba(248,81,73,.16);color:var(--bad);border:1px solid rgba(248,81,73,.4)}
.v-na{background:rgba(210,153,34,.14);color:var(--warn);border:1px solid rgba(210,153,34,.38)}
.note{color:var(--dim);font-size:11.5px;line-height:1.55;margin:8px 0}
.err{color:var(--bad);font-size:12px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:11px}
td:first-child,th:first-child{text-align:left}
a{color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:none;border-radius:0;font-size:12.5px;padding:9px 4px;background:#0d1117;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.hide{display:none}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 0 4px}
.tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
  color:var(--dim);padding:11px 6px;font-size:13px;font-weight:500}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.mini{padding:5px 8px;font-size:11.5px;border-radius:5px}
img.th{width:100%;max-width:112px;border-radius:5px;margin-top:4px;display:block;border:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:12px}
.hdr a{text-decoration:none;font-size:19px;color:var(--dim)}
</style>
</head>
<body>
<header><div class="wrap hdr">
  <a href="index.html">&#8962;</a>
  <h1>Verificación de cronómetros</h1>
</div></header>
<div class="wrap">

<div class="tabs">
  <button id="tDisp">Cronómetro del dispositivo</button>
  <button id="tExt">Cronómetro externo</button>
</div>

<div id="reloj">
  <div id="utc">--:--:--.---</div>
  <div id="fecha">—</div>
  <div id="estado">Sin sincronizar</div>
</div>
<div class="btns">
  <button class="p" id="bSync">Sincronizar con UTC</button>
  <button id="bTec">Detalle técnico</button>
</div>
<div id="syncDet" class="hide"></div>
<div id="servidores"></div>

<div id="zonaDisp">
  <div id="crono">
    <div id="crNum">00:00:00,000</div>
    <div id="crEt">Cronómetro integrado · base de tiempos del dispositivo</div>
  </div>
  <div class="btns">
    <button class="p" id="crGo">Iniciar</button>
    <button class="o" id="crLap" disabled>Vuelta</button>
    <button id="crStop" disabled>Parar</button>
    <button id="crCero">Poner a cero</button>
  </div>
</div>

<div id="zonaExt">
  <div class="btns"><button class="p" id="camGo">Abrir cámara</button>
    <button id="camOff">Cerrar cámara</button></div>
  <div id="camBox" class="hide">
    <div style="background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:9px 0">
      <video id="camVid" playsinline muted style="width:100%;display:block;max-height:46vh;object-fit:contain"></video>
    </div>
    <div class="btns"><button class="o" id="camCap">Capturar punto</button></div>
  </div>
  <div id="camInfo"></div>
</div>

<div id="app"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const fmt=(v,n=2)=>(v===null||v===undefined||!isFinite(v))?"—":v.toFixed(n).replace(".",",");
const T0 = Date.now() - performance.now();

/* ------------------------------------------------------------------ estado */
const NOM_DEF=[0,10,180,300];
const nuevoProc=(resol)=>({equipo:"",modelo:"",serie:"",resol:resol,
  puntos:NOM_DEF.map(n=>({nom:n,utc:null,cron:null})),
  func:{bateria:false,display:false,pulsadores:false,cero:false}, obs:""});

let guardado={};
try{ guardado=JSON.parse(localStorage.getItem("cron.d")||"{}"); }catch(e){}
const D = Object.assign({
  tab:"disp",
  mpeA:0.10, mpeB:1.0, tur:5,
  metodoExt:"camara", uUtcFoto:0.005, uDesfase:0.040,
  operador:"",
  proc:{disp:nuevoProc(0.001), ext:nuevoProc(0.01)}
}, guardado);
if(!D.proc||!D.proc.disp||!D.proc.ext) D.proc={disp:nuevoProc(0.001), ext:nuevoProc(0.01)};
for(const k of ["disp","ext"]) if(!Array.isArray(D.proc[k].puntos)||!D.proc[k].puntos.length)
  D.proc[k].puntos=NOM_DEF.map(n=>({nom:n,utc:null,cron:null}));
const P = () => D.proc[D.tab];
const guarda=()=>{ try{ localStorage.setItem("cron.d",JSON.stringify(D)); }catch(e){} };

/* Imágenes de cada punto. Se intenta conservarlas entre sesiones, porque son
   la muestra que respalda cada lectura; si no caben en el almacenamiento del
   navegador se mantienen solo en memoria y se avisa. */
let IMGS={}; let imgAviso="";
try{ IMGS=JSON.parse(localStorage.getItem("cron.imgs")||"{}"); }catch(e){ IMGS={}; }
function guardaImgs(){
  try{ localStorage.setItem("cron.imgs",JSON.stringify(IMGS)); imgAviso=""; }
  catch(e){ imgAviso="Las fotos no caben en el almacenamiento del navegador: se conservan solo mientras no recargues. Descárgalas."; }
}
const claveImg = i => D.tab+":"+i;

const SYNC={off:null,u:null,fuente:null,rtt:null,n:0,log:[],err:"",fuentes:[]};
const CR={t0:null, tStop:null, corriendo:false, pend:0};
const CAM={stream:null, on:false, via:null, err:""};
const U_FRAME={captureTime:0.005, presentationTime:0.030, now:0.060};
let tecnico=false;

/* -------------------------------------------------------------- fuentes UTC */
const FUENTES=[
  {n:"timeapi.io",      url:"https://timeapi.io/api/Time/current/zone?timeZone=UTC",
   lee:j=>Date.parse((j.dateTime||"").replace(/Z?$/,"")+"Z")},
  {n:"worldtimeapi.org",url:"https://worldtimeapi.org/api/timezone/Etc/UTC",
   lee:j=>Date.parse(j.utc_datetime)},
  {n:"hourora.app",     url:"https://hourora.app/api/v1/time?timezone=UTC",
   lee:j=>Date.parse(j.utc)}
];
async function sondea(f){
  const t1=performance.now();
  const r=await fetch(f.url,{cache:"no-store",mode:"cors"});
  const t4=performance.now();
  if(!r.ok) throw new Error(f.n+": HTTP "+r.status);
  const Ts=f.lee(await r.json());
  if(!isFinite(Ts)) throw new Error(f.n+": respuesta sin fecha legible");
  return {off: Ts-(T0+(t1+t4)/2), rtt: t4-t1, fuente:f.n};
}
async function sondeaCabecera(url, intentos=60){
  let prev=null, prevT=null;
  for(let i=0;i<intentos;i++){
    const t1=performance.now();
    const r=await fetch(url,{method:"HEAD",cache:"no-store"});
    const t4=performance.now();
    const d=r.headers.get("date");
    if(!d) throw new Error("el servidor no expone la cabecera Date");
    const v=Date.parse(d);
    if(prev!==null && v>prev)
      return {off: v-(T0+(prevT+t4)/2), rtt: t4-prevT, fuente:"cabecera Date de "+new URL(url).host};
    prev=v; prevT=t1;
    await new Promise(s=>setTimeout(s,40));
  }
  throw new Error("no se observó el cambio de segundo");
}
async function sondeoMulti(reps=3, soloMejor=false){
  const det=[], buenos=[];
  const lista = soloMejor && SYNC.fuente ? FUENTES.filter(f=>f.n===SYNC.fuente) : FUENTES;
  for(const f of (lista.length?lista:FUENTES)){
    const r={n:f.n, url:f.url, ok:false, rtt:null, off:null, err:null, n_ok:0};
    for(let k=0;k<reps;k++){
      try{ const x=await sondea(f); buenos.push(x); r.ok=true; r.n_ok++;
           if(r.rtt===null||x.rtt<r.rtt){ r.rtt=x.rtt; r.off=x.off; } }
      catch(e){ r.err=String(e.message||e).replace(f.n+": ",""); break; }
    }
    det.push(r);
  }
  if(!buenos.length){
    try{ const x=await sondeaCabecera(location.href); buenos.push(x);
         det.push({n:x.fuente, url:location.origin, ok:true, rtt:x.rtt, off:x.off, err:null, n_ok:1}); }
    catch(e){ return {det, err:String(e.message||e)}; }
  }
  buenos.sort((a,b)=>a.rtt-b.rtt);
  const m=buenos[0];
  return {det, off:m.off, u:m.rtt/2, rtt:m.rtt, fuente:m.fuente, n:buenos.length};
}
async function sincroniza(){
  SYNC.err=""; pinta();
  const r=await sondeoMulti(3);
  SYNC.fuentes=r.det;
  SYNC.log=r.det.map(d=>d.ok? ("✓ "+d.n+": "+d.n_ok+" sondeos, mejor ida y vuelta "+fmt(d.rtt,0)+" ms")
                            : ("✗ "+d.n+": "+(d.err||"sin respuesta")));
  if(r.err||r.off===undefined){ SYNC.err="No se pudo obtener UTC: "+(r.err||"ninguna fuente respondió"); pinta(); return; }
  SYNC.off=r.off; SYNC.u=r.u; SYNC.fuente=r.fuente; SYNC.rtt=r.rtt; SYNC.n=r.n;
  pinta();
}
const utcAhora = () => SYNC.off===null ? null : T0+performance.now()+SYNC.off;
function hms(ms){
  if(ms===null||ms===undefined) return {h:"--:--:--.---",f:"—"};
  const d=new Date(ms), p=(x,n=2)=>String(x).padStart(n,"0");
  return {h:p(d.getUTCHours())+":"+p(d.getUTCMinutes())+":"+p(d.getUTCSeconds())+"."+p(d.getUTCMilliseconds(),3),
          f:d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" UTC"};
}
function tic(){
  const t=utcAhora(), o=hms(t);
  $("#utc").textContent=o.h; $("#fecha").textContent=o.f;
  $("#utc").style.color = t===null?"var(--dim)":"var(--txt)";
  requestAnimationFrame(tic);
}

/* ----------------------------------------------------- cronómetro integrado */
function crElapsed(){
  if(CR.t0===null) return 0;
  return ((CR.tStop!==null?CR.tStop:performance.now())-CR.t0)/1000;
}
function crFmt(sec){
  const neg=sec<0; let r=Math.round(Math.abs(sec)*1000);
  const h=Math.floor(r/3600000); r-=h*3600000;
  const m=Math.floor(r/60000);   r-=m*60000;
  const g=Math.floor(r/1000);    r-=g*1000;
  const p=(x,n=2)=>String(x).padStart(n,"0");
  return (neg?"−":"")+p(h)+":"+p(m)+":"+p(g)+","+p(r,3);
}
function crTic(){
  const n=$("#crNum");
  if(n){ n.textContent=crFmt(crElapsed());
         n.style.color = CR.tStop!==null?"var(--warn)":"var(--ok)"; }
  requestAnimationFrame(crTic);
}
let crUltima=0;
/* Cada vuelta dispara su propia sincronización: sin una consulta nueva a la
   red la desviación saldría cero por construcción, porque el reloj UTC en
   pantalla cuelga del mismo oscilador que el cronómetro. */
async function crMarca(){
  const ahora=performance.now();
  if(ahora-crUltima<250) return;
  crUltima=ahora;
  const t=(ahora-CR.t0)/1000;
  let i=P().puntos.findIndex(p=>p.utc===null);
  if(i<0){ P().puntos.push({nom:Math.round(t),utc:null,cron:null}); i=P().puntos.length-1; }
  const pt=P().puntos[i];
  pt.cron=+t.toFixed(3); pt.utc=null;
  CR.pend++; pinta();
  let r=await sondeoMulti(3,true);
  if(r.off===undefined) r=await sondeoMulti(2);
  CR.pend--;
  if(r.off!==undefined){
    pt.utc=T0+ahora+r.off; pt.uRef=r.u/1000;
    SYNC.off=r.off; SYNC.u=r.u; SYNC.rtt=r.rtt;
    if(r.det.length>=FUENTES.length){ SYNC.fuente=r.fuente; SYNC.fuentes=r.det; }
  }
  guarda(); pinta();
}

/* ------------------------------------------------------------------ cámara */
async function camAbrir(){
  CAM.err="";
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1920}},audio:false});
    const v=$("#camVid"); v.srcObject=CAM.stream; await v.play(); CAM.on=true;
  }catch(e){ CAM.err=e.message||String(e); }
  pinta();
}
function camCerrar(){
  (CAM.stream?.getTracks()||[]).forEach(t=>t.stop());
  CAM.stream=null; CAM.on=false; const v=$("#camVid"); if(v) v.srcObject=null; pinta();
}
/* Marca temporal del fotograma. captureTime es el instante real de captura en
   la cámara y resuelve el retardo de la tubería de vídeo, de 50 a 120 ms en un
   móvil, que de otro modo sería un sesgo invisible comparable a la tolerancia. */
function marcaFotograma(v){
  return new Promise(res=>{
    if(!v.requestVideoFrameCallback){ res({t:performance.now(), via:"now"}); return; }
    let hecho=false;
    const id=setTimeout(()=>{ if(!hecho){hecho=true; res({t:performance.now(), via:"now"});} },500);
    v.requestVideoFrameCallback((now,md)=>{
      if(hecho) return; hecho=true; clearTimeout(id);
      if(md && typeof md.captureTime==="number") res({t:md.captureTime, via:"captureTime"});
      else if(md && typeof md.presentationTime==="number") res({t:md.presentationTime, via:"presentationTime"});
      else res({t:now, via:"now"});
    });
  });
}
async function camCapturar(){
  if(SYNC.off===null){ alert("Sincroniza primero con UTC."); return; }
  const v=$("#camVid");
  const m=await marcaFotograma(v);
  CAM.via=m.via;
  const anchoMax=1280, esc=Math.min(1,anchoMax/(v.videoWidth||anchoMax));
  const c=document.createElement("canvas");
  c.width=Math.round((v.videoWidth||1280)*esc); c.height=Math.round((v.videoHeight||720)*esc);
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  let i=P().puntos.findIndex(p=>p.utc===null);
  if(i<0){ P().puntos.push({nom:0,utc:null,cron:null}); i=P().puntos.length-1; }
  const pt=P().puntos[i];
  pt.utc=T0+m.t+SYNC.off; pt.uFrame=U_FRAME[m.via]; pt.uRef=(SYNC.u??20)/1000;
  IMGS[claveImg(i)]=c.toDataURL("image/jpeg",0.72);
  guarda(); guardaImgs(); pinta();
}

/* ------------------------------------------------------------ incertidumbre */
function uPunto(p){
  const uRef = (p && p.uRef!==undefined) ? p.uRef : (SYNC.u??20)/1000;
  if(D.tab==="disp") return uRef;        // la lectura del cronómetro integrado es exacta
  const uCron=(+P().resol||0.01)/Math.sqrt(12);
  if(p && p.uFrame!==undefined) return Math.hypot(uCron,p.uFrame,uRef);
  if(D.metodoExt==="camara") return Math.hypot(uCron,U_FRAME[CAM.via||"now"],uRef);
  if(D.metodoExt==="foto")   return Math.hypot(uCron,+D.uUtcFoto||0.005);
  return Math.hypot(uCron,uRef,+D.uDesfase||0.040);
}
const uIntervalo=(a,b)=>Math.hypot(uPunto(a),uPunto(b));
const mpeDe = dT => (+D.mpeA||0) + (+D.mpeB||0)*dT/86400;
function resultados(){
  const pts=P().puntos, o=pts[0];
  if(!o || o.utc===null || o.cron===null) return null;
  return pts.map((p,i)=>{
    if(i===0) return {i,nom:p.nom,origen:true};
    if(p.utc===null||p.cron===null) return {i,nom:p.nom,vacio:true};
    const u=uIntervalo(o,p), U=2*u;
    const dT=(p.utc-o.utc)/1000, dS=(+p.cron)-(+o.cron), e=dS-dT;
    const mpe=mpeDe(dT);
    return {i,nom:p.nom,dT,dS,e,U,u,mpe,tur:U>0?mpe/U:null,
            ppm:dT>0?e/dT*1e6:null, sdia:dT>0?e/dT*86400:null,
            apto:Math.abs(e)+U<=mpe, dudoso:Math.abs(e)-U<mpe && Math.abs(e)+U>mpe};
  });
}
const nomTxt=s=>s<60?(s+" s"):(s%60?(Math.floor(s/60)+" min "+(s%60)+" s"):(s/60+" min"));

/* -------------------------------------------------------------------- vista */
function pinta(){
  $("#tDisp").className = D.tab==="disp"?"on":"";
  $("#tExt").className  = D.tab==="ext"?"on":"";
  $("#zonaDisp").className = D.tab==="disp"?"":"hide";
  $("#zonaExt").className  = D.tab==="ext"?"":"hide";

  const e=$("#estado");
  if(SYNC.err) e.innerHTML='<span style="color:var(--bad)">'+SYNC.err+'</span>';
  else if(SYNC.off===null) e.textContent="Sin sincronizar — pulsa «Sincronizar con UTC»";
  else e.innerHTML='Fuente: <b>'+SYNC.fuente+'</b> · incertidumbre ±'+fmt(SYNC.u,0)+' ms · ida y vuelta '+fmt(SYNC.rtt,0)+' ms';

  const F=SYNC.fuentes||[];
  $("#servidores").innerHTML = !F.length ? "" : `<div class="card">
    <div class="kv" style="color:var(--txt)"><b style="text-align:left">Servidores de tiempo consultados</b><b></b></div>
    <table><tr><th>Servidor</th><th>Estado</th><th>Ida y vuelta</th><th></th></tr>
    ${F.map(d=>`<tr>
      <td style="font-size:11.5px">${d.n}<br><span style="color:var(--dim);font-size:10.5px">${d.url||""}</span></td>
      <td style="color:${d.ok?"var(--ok)":"var(--bad)"}">${d.ok?d.n_ok+" sondeos":"sin respuesta"}</td>
      <td>${d.rtt===null?"—":fmt(d.rtt,0)+" ms"}</td>
      <td>${d.n===SYNC.fuente?'<b style="color:var(--acc)">usado</b>':""}</td>
    </tr>`).join("")}</table>
    <div class="note" style="margin:6px 0 0">Se consultan todas y se adopta la de menor ida y vuelta.
    ${F.filter(d=>d.ok&&d.off!==null).length>1?"Dispersión entre servidores: ±"+
      fmt((Math.max(...F.filter(d=>d.ok).map(d=>d.off))-Math.min(...F.filter(d=>d.ok).map(d=>d.off)))/2,0)+
      " ms, que acota el acuerdo entre fuentes independientes.":""}</div></div>`;

  $("#syncDet").className = tecnico?"":"hide";
  $("#syncDet").innerHTML = tecnico? `<div class="card"><div class="note" style="margin:0">
    <b>Cómo se obtiene el UTC.</b> Se marca el envío y la recepción con el reloj monótono del navegador y se toma
    la marca del servidor: el desfase es esa marca menos el punto medio del intercambio, con error acotado por la
    mitad del tiempo de ida y vuelta, que es lo que se declara.
    <br><br><b>Esto no es trazabilidad.</b> Un certificado trazable a un patrón nacional solo lo emite un
    laboratorio acreditado.<br><br>Último sondeo:<br>${SYNC.log.map(x=>"· "+x).join("<br>")||"—"}</div></div>`:"";

  $("#crGo").disabled=CR.corriendo; $("#crLap").disabled=!CR.corriendo; $("#crStop").disabled=!CR.corriendo;
  $("#camBox").className=CAM.on?"":"hide";
  $("#camGo").disabled=CAM.on; $("#camOff").disabled=!CAM.on;
  $("#camInfo").innerHTML = CAM.err ? `<div class="err">Cámara: ${CAM.err}</div>`
    : (CAM.on?`<div class="note" style="margin:4px 0 0">Apunta al display del cronómetro y captura. La foto queda
       junto al punto como muestra. ${CAM.via?`Marca temporal del fotograma: <b>${CAM.via}</b> · incertidumbre
       ${fmt(U_FRAME[CAM.via],3)} s.`:""}</div>`:"");

  const R=resultados(), pr=P();
  let h="";

  if(D.tab==="disp") h+=`<div class="note">Verifica la <b>base de tiempos de este aparato</b>, la misma de la que
    cuelga su app de reloj. Cada vuelta registra un punto con su propia consulta a la red. No mide la latencia de
    los pulsadores de la app de reloj ni el tiempo de reacción del operador: esas contribuciones pertenecen al
    presupuesto de la medida, no al del instrumento.</div>`;
  else h+=`<div class="note">Para cronómetros digitales independientes. Se captura el display con la cámara y la
    página anota el UTC del <b>fotograma</b>, no el del momento de pulsar. La foto se conserva junto al punto.</div>`;

  h+=`<h2>Equipo verificado</h2>
  <div class="row"><label>Identificación</label><input id="fEq" value="${(pr.equipo||"").replace(/"/g,"&quot;")}" placeholder="${D.tab==="disp"?"p. ej. MOVIL-01":"p. ej. CRON-03"}"></div>
  <div class="row"><label>Marca y modelo</label><input id="fMod" value="${(pr.modelo||"").replace(/"/g,"&quot;")}"></div>
  <div class="row"><label>Número de serie</label><input id="fSer" value="${(pr.serie||"").replace(/"/g,"&quot;")}"></div>
  <div class="row"><label>Resolución del display</label><input type="number" step="0.001" id="fRes" value="${pr.resol}"><span class="u">s</span></div>`;

  if(D.tab==="ext"){
    h+=`<h2>Método de captura</h2>
    <div class="seg">
      <button class="${D.metodoExt==="camara"?"on":""}" id="mCam">Cámara</button>
      <button class="${D.metodoExt==="foto"?"on":""}" id="mFoto">Foto externa</button>
      <button class="${D.metodoExt==="lap"?"on":""}" id="mLap">Doble lap</button>
    </div>`;
    if(D.metodoExt==="foto")
      h+=`<div class="note">Fotografía con otra cámara el display del cronómetro <b>en marcha</b> junto al reloj UTC
      de esta pantalla, y teclea abajo las dos lecturas de cada imagen.</div>
      <div class="row"><label>Lectura del UTC en foto</label><input type="number" step="0.001" id="fUF" value="${D.uUtcFoto}"><span class="u">s</span></div>`;
    if(D.metodoExt==="lap")
      h+=`<div class="note">Doble pulsación simultánea. <b>El desfase entre ambas no se cancela</b> y domina el
      presupuesto, porque afecta solo a uno de los dos relojes.</div>
      <div class="row"><label>Desfase entre pulsaciones</label><input type="number" step="0.005" id="fUD" value="${D.uDesfase}"><span class="u">s</span></div>`;
  }

  const uI0=uIntervalo(null,null);
  h+=`<div class="card">
    <div class="kv"><span>incertidumbre por punto</span><b>${fmt(uPunto(),4)} s</b></div>
    <div class="kv"><span>U del intervalo (k = 2)</span><b>± ${fmt(2*uI0,4)} s</b></div>
    <div class="kv"><span>TUR frente al término fijo</span><b>${fmt(D.mpeA/(2*uI0),1)} : 1 ${D.mpeA/(2*uI0)>=D.tur?"✓":"✗"}</b></div>
  </div>`;
  if(D.mpeA/(2*uI0)<D.tur)
    h+=`<div class="verdict v-na">Con esta configuración el método no alcanza el TUR exigido: la incertidumbre es
      grande frente a la tolerancia. El veredicto sigue siendo honesto porque la incluye, pero discrimina menos.</div>`;

  h+=`<h2>Criterio de aceptación</h2>
  <div class="row"><label>Error máximo, fijo</label><input type="number" step="0.01" id="fA" value="${D.mpeA}"><span class="u">s</span></div>
  <div class="row"><label>Error máximo, proporcional</label><input type="number" step="0.1" id="fB" value="${D.mpeB}"><span class="u">s/día</span></div>
  <div class="row"><label>Relación TUR exigida</label><input type="number" step="1" id="fTur" value="${D.tur}"><span class="u">: 1</span></div>
  <div class="note">El criterio es común a las dos pestañas. En el rango corto manda el término fijo, porque la
  deriva del oscilador no se manifiesta: en 10 s, 1 s/día son 0,12 ms. Valores por defecto como recomendación
  propia, no como requisito normativo.</div>

  <h2>Puntos de comprobación</h2>
  <div class="note">El primer punto es el origen y puede tomarse en cualquier instante con el cronómetro ya en
  marcha, sin que marque cero: los demás se comparan contra él.</div>
  ${imgAviso?`<div class="err">${imgAviso}</div>`:""}
  <table>
    <tr><th>Punto</th><th>UTC</th><th>Lectura</th><th></th></tr>
    ${pr.puntos.map((p,i)=>{
      const im=IMGS[claveImg(i)];
      return `<tr>
      <td><b>${i===0?"Origen":nomTxt(p.nom)}</b></td>
      <td style="font-family:ui-monospace,monospace;font-size:11px">${p.utc===null?(CR.pend?"…":"—"):hms(p.utc).h}</td>
      <td><input type="number" step="0.001" class="pc" data-i="${i}" value="${p.cron??""}" placeholder="s"
            ${D.tab==="disp"?"readonly style='opacity:.75'":""}>
          ${im?`<a href="${im}" download="punto-${i}.jpg"><img class="th" src="${im}"></a>`:""}</td>
      <td>${D.tab==="ext"?`<button class="mini pcap" data-i="${i}">ahora</button>`:""}
          ${i>1?`<button class="mini pdel" data-i="${i}">×</button>`:""}</td></tr>
      ${D.tab==="ext"?`<tr><td colspan="4" style="padding:0 0 7px 0;border:none">
        <input type="text" class="pu" data-i="${i}" placeholder="o teclea el UTC leído en la foto"
          style="width:100%;font-size:11px;padding:5px 7px"></td></tr>`:""}`;
    }).join("")}
  </table>
  <div class="btns"><button id="pAdd">+ punto</button>
    <button id="pReset">Restaurar 10 s / 3 min / 5 min</button></div>

  <h2>Resultado</h2>`;
  if(!R) h+=`<div class="card"><div class="note" style="margin:0">Registra el punto de origen para empezar.</div></div>`;
  else{
    const hechos=R.filter(x=>!x.origen&&!x.vacio);
    if(!hechos.length) h+=`<div class="card"><div class="note" style="margin:0">Origen registrado. Añade al menos un punto más.</div></div>`;
    else{
      h+=`<table>
        <tr><th>Intervalo</th><th>Referencia</th><th>Cronómetro</th><th>Error</th><th>Límite</th><th></th></tr>
        ${hechos.map(x=>`<tr>
          <td>${nomTxt(x.nom)}</td><td>${fmt(x.dT,3)} s</td><td>${fmt(x.dS,3)} s</td>
          <td style="color:${x.dudoso?"var(--warn)":(x.apto?"var(--ok)":"var(--bad)")}"><b>${x.e>=0?"+":""}${fmt(x.e,3)}</b></td>
          <td>± ${fmt(x.mpe,3)}</td><td>${x.dudoso?"?":(x.apto?"✓":"✗")}</td></tr>`).join("")}
      </table>
      <div class="note">Error = intervalo del cronómetro − intervalo de referencia. «?» significa no concluyente:
      la incertidumbre se solapa con el límite.</div>`;
      const nAp=hechos.filter(x=>x.apto).length, nDu=hechos.filter(x=>x.dudoso).length;
      const cls=nDu?"v-na":(nAp===hechos.length?"v-ok":"v-no");
      h+=`<div class="verdict ${cls}">${nDu?"NO CONCLUYENTE en "+nDu+" de "+hechos.length+" puntos"
        :(nAp===hechos.length?"APTO en los "+hechos.length+" puntos comprobados"
                             :"NO APTO en "+(hechos.length-nAp)+" de "+hechos.length+" puntos")}</div>`;
      const lar=hechos[hechos.length-1];
      if(lar.dT>=60) h+=`<div class="note">Deriva equivalente en el intervalo más largo:
        <b>${lar.sdia>=0?"+":""}${fmt(lar.sdia,1)} s/día</b>. Dato informativo: en intervalos de minutos está
        dominada por la lectura, no por el oscilador.</div>`;
      if(tecnico) h+=`<h2>Presupuesto de incertidumbre</h2>
        <table><tr><th>Contribución, por punto</th><th>u (s)</th></tr>
        ${D.tab==="disp"
          ?`<tr><td>Referencia UTC de red</td><td>${fmt(uPunto(),4)}</td></tr>
            <tr><td>Lectura del cronómetro</td><td>0,0000 (la registra la propia página)</td></tr>`
          :`<tr><td>Cuantificación del display (resolución/√12)</td><td>${fmt((+pr.resol||0.01)/Math.sqrt(12),4)}</td></tr>
            <tr><td>Marca temporal del fotograma o lectura</td><td>${fmt(D.metodoExt==="camara"?U_FRAME[CAM.via||"now"]:(D.metodoExt==="foto"?+D.uUtcFoto:+D.uDesfase),4)}</td></tr>
            <tr><td>Referencia UTC de red</td><td>${fmt((SYNC.u??20)/1000,4)}</td></tr>`}
        <tr><td><b>u por punto</b></td><td><b>${fmt(uPunto(),4)}</b></td></tr>
        <tr><td><b>U (k = 2) del intervalo</b></td><td><b>${fmt(2*uI0,4)}</b></td></tr></table>`;
    }
  }

  h+=`<h2>Comprobación funcional</h2>
  ${[["bateria","Batería con carga suficiente"],["display","Segmentos del display legibles"],
     ["pulsadores","Arranque, parada, vuelta y puesta a cero responden"],
     ["cero","Puesta a cero correcta y el conteo no se detiene solo"]]
   .map(([k,t])=>`<div class="row" style="align-items:flex-start">
     <input type="checkbox" class="fk" data-k="${k}" ${pr.func[k]?"checked":""}
       style="flex:0 0 auto;width:19px;height:19px;margin-top:2px">
     <label style="flex:1 1 auto;color:var(--txt);font-size:13px">${t}</label></div>`).join("")}

  <h2>Registro de verificación</h2>
  <div class="row"><label>Operador</label><input id="fOp" value="${(D.operador||"").replace(/"/g,"&quot;")}"></div>
  <div class="row"><label>Observaciones</label><input id="fObs" value="${(pr.obs||"").replace(/"/g,"&quot;")}"></div>
  <div class="btns">
    <button class="g" id="bReg">Generar registro</button>
    <button id="bCopia">Copiar</button>
    <button id="bDesc">Descargar</button>
    <button id="bNuevo">Nueva verificación</button>
  </div>
  <textarea id="salida" readonly placeholder="Pulsa «Generar registro»"></textarea>
  <div class="note">Herramienta de verificación interna. No sustituye a un certificado de calibración trazable,
  que solo emite un laboratorio acreditado. <a href="visor.html">Verificación de alturas</a> ·
  <a href="index.html">Inicio</a></div>`;

  $("#app").innerHTML=h;
  enlaza();
}

/* ------------------------------------------------------------ vinculaciones */
function enlaza(){
  const on=(id,ev,fn)=>{const x=$("#"+id); if(x) x.addEventListener(ev,fn);};
  const txt=(id,k,o)=>on(id,"input",e=>{o[k]=e.target.value; guarda();});
  const num=(id,k,o)=>on(id,"change",e=>{o[k]=e.target.value===""?null:+e.target.value; guarda(); pinta();});
  const pr=P();
  txt("fEq","equipo",pr); txt("fMod","modelo",pr); txt("fSer","serie",pr);
  txt("fObs","obs",pr); txt("fOp","operador",D);
  num("fRes","resol",pr); num("fA","mpeA",D); num("fB","mpeB",D); num("fTur","tur",D);
  num("fUF","uUtcFoto",D); num("fUD","uDesfase",D);
  on("mCam","click",()=>{D.metodoExt="camara"; guarda(); pinta();});
  on("mFoto","click",()=>{D.metodoExt="foto"; guarda(); pinta();});
  on("mLap","click",()=>{D.metodoExt="lap"; guarda(); pinta();});

  document.querySelectorAll(".fk").forEach(x=>x.addEventListener("change",e=>{
    pr.func[e.target.dataset.k]=e.target.checked; guarda();}));
  document.querySelectorAll(".pc").forEach(x=>x.addEventListener("change",e=>{
    pr.puntos[+e.target.dataset.i].cron=e.target.value===""?null:+e.target.value; guarda(); pinta();}));
  document.querySelectorAll(".pcap").forEach(b=>b.addEventListener("click",e=>{
    const t=utcAhora(); if(t===null){alert("Sincroniza primero con UTC.");return;}
    const i=+e.currentTarget.dataset.i;
    pr.puntos[i].utc=t; pr.puntos[i].uRef=(SYNC.u??20)/1000; guarda(); pinta();}));
  document.querySelectorAll(".pu").forEach(x=>x.addEventListener("change",e=>{
    const v=Date.parse(e.target.value);
    if(!isFinite(v)){alert("Fecha no reconocida. Usa 2026-11-15T21:30:00.000Z");return;}
    pr.puntos[+e.target.dataset.i].utc=v; guarda(); pinta();}));
  document.querySelectorAll(".pdel").forEach(b=>b.addEventListener("click",e=>{
    const i=+e.currentTarget.dataset.i;
    pr.puntos.splice(i,1); delete IMGS[claveImg(i)];
    guarda(); guardaImgs(); pinta();}));
  on("pAdd","click",()=>{
    const v=prompt("Intervalo nominal del nuevo punto, en segundos:","600");
    if(v===null||!isFinite(+v)) return;
    pr.puntos.push({nom:+v,utc:null,cron:null}); pr.puntos.sort((a,b)=>a.nom-b.nom); guarda(); pinta();});
  on("pReset","click",()=>{
    if(!confirm("¿Restaurar los puntos? Se pierden las lecturas y las fotos de esta pestaña.")) return;
    pr.puntos.forEach((p,i)=>delete IMGS[claveImg(i)]);
    pr.puntos=NOM_DEF.map(n=>({nom:n,utc:null,cron:null}));
    CR.t0=null; CR.tStop=null; CR.corriendo=false;
    guarda(); guardaImgs(); pinta();});

  on("bReg","click",()=>{$("#salida").value=registro();});
  on("bCopia","click",()=>{const s=$("#salida"); if(!s.value) s.value=registro();
    navigator.clipboard?.writeText(s.value); s.select();});
  on("bDesc","click",()=>{
    const s=$("#salida").value||registro();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([s],{type:"text/markdown;charset=utf-8"}));
    a.download="verificacion-"+D.tab+"-"+(pr.equipo||"sin-id").replace(/\W+/g,"-")+"-"+
      new Date().toISOString().slice(0,10)+".md";
    a.click(); URL.revokeObjectURL(a.href);});
  on("bNuevo","click",()=>{
    if(!confirm("¿Empezar una verificación nueva en esta pestaña? Se borran lecturas, fotos y observaciones.")) return;
    pr.puntos.forEach((p,i)=>delete IMGS[claveImg(i)]);
    pr.puntos=pr.puntos.map(p=>({nom:p.nom,utc:null,cron:null}));
    pr.obs=""; pr.func={bateria:false,display:false,pulsadores:false,cero:false};
    CR.t0=null; CR.tStop=null; CR.corriendo=false;
    guarda(); guardaImgs(); $("#salida").value=""; pinta();});
}

/* -------------------------------------------------------------- el registro */
function registro(){
  const R=resultados(), pr=P(), iso=t=>t?new Date(t).toISOString():"—", si=b=>b?"sí":"NO";
  const L=[];
  L.push("# Registro de verificación de cronómetro","",
    "Procedimiento: "+(D.tab==="disp"
      ? "verificación de la base de tiempos del propio dispositivo."
      : "verificación de cronómetro independiente por captura de su display."),"",
    "| | |","|---|---|",
    "| Fecha del registro | "+new Date().toISOString().slice(0,19).replace("T"," ")+" UTC |",
    "| Equipo | "+(pr.equipo||"—")+" |",
    "| Marca y modelo | "+(pr.modelo||"—")+" |",
    "| Número de serie | "+(pr.serie||"—")+" |",
    "| Resolución del display | "+fmt(pr.resol,3)+" s |",
    "| Operador | "+(D.operador||"—")+" |","",
    "## Método","",
    D.tab==="disp"
      ? "El cronómetro integrado de la aplicación corre sobre el oscilador del dispositivo, el mismo del que cuelga\nsu reloj de sistema. Cada vuelta registra un punto con una consulta propia e independiente a la red, sin lo\ncual la desviación saldría cero por construcción. Se verifica la base de tiempos del aparato; no se verifican\nni la latencia de los pulsadores de la app de reloj ni el tiempo de reacción del operador."
      : (D.metodoExt==="camara"
        ? "Fotografía del display del cronómetro tomada por la propia aplicación, que anota el instante UTC del\nfotograma mediante la marca temporal "+(CAM.via||"no disponible")+". Las imágenes se conservan junto a cada punto\ncomo muestra de la lectura."
        : D.metodoExt==="foto"
        ? "Fotografía externa que recoge en la misma imagen el display del cronómetro en marcha y el reloj UTC en\npantalla. La imagen establece la simultaneidad, por lo que no intervienen el tiempo de reacción ni el desfase\nentre pulsaciones."
        : "Doble pulsación simultánea del lap del cronómetro y del botón de captura. El desfase entre ambas no se\ncancela y constituye la contribución dominante."),
    "","Todos los puntos se comparan contra un origen común, de modo que cualquier desfase constante de la",
    "referencia se cancela al restar.","",
    "### Fuentes horarias utilizadas","",
    "| Servidor | URL | Estado | Ida y vuelta | Adoptado |","|---|---|---|---|---|",
    ...((SYNC.fuentes||[]).map(d=>"| "+d.n+" | "+(d.url||"—")+" | "+(d.ok?d.n_ok+" sondeos correctos":"sin respuesta: "+(d.err||"—"))+
       " | "+(d.rtt===null?"—":fmt(d.rtt,0)+" ms")+" | "+(d.n===SYNC.fuente?"sí":"no")+" |")),
    "","Se consultan todas y se adopta la de menor ida y vuelta. La incertidumbre declarada es la mitad de ese",
    "tiempo, cota conservadora que supone el peor reparto posible del camino.","",
    "## Criterio de aceptación","",
    "Error máximo admisible EMA = ±("+fmt(D.mpeA,3)+" s + "+fmt(D.mpeB,2)+" s/día × T). TUR exigido "+fmt(D.tur,0)+":1.",
    "Criterio interno, no requisito normativo.","","## Resultados","");
  if(R){
    const o=pr.puntos[0], hechos=R.filter(x=>!x.origen&&!x.vacio);
    L.push("Origen: UTC "+iso(o.utc)+", cronómetro "+fmt(o.cron,3)+" s.","",
      "| Intervalo | Referencia ΔT (s) | Cronómetro ΔS (s) | Error (s) | EMA (s) | Veredicto | Muestra |",
      "|---|---|---|---|---|---|---|");
    hechos.forEach(x=>L.push("| "+nomTxt(x.nom)+" | "+fmt(x.dT,3)+" | "+fmt(x.dS,3)+" | "+
      (x.e>=0?"+":"")+fmt(x.e,3)+" | ± "+fmt(x.mpe,3)+" | "+
      (x.dudoso?"NO CONCLUYENTE":(x.apto?"APTO":"NO APTO"))+" | "+
      (IMGS[claveImg(x.i)]?"punto-"+x.i+".jpg":"—")+" |"));
    if(hechos.length){
      const nAp=hechos.filter(x=>x.apto).length, nDu=hechos.filter(x=>x.dudoso).length;
      L.push("","Incertidumbre expandida U (k = 2): ± "+fmt(hechos[0].U,4)+" s. TUR conseguido frente al término fijo: "+
        fmt(D.mpeA/hechos[0].U,1)+":1.","",
        "**Veredicto global: "+(nDu?"NO CONCLUYENTE":(nAp===hechos.length?"APTO":"NO APTO"))+
        "** ("+nAp+" de "+hechos.length+" puntos dentro del criterio"+(nDu?", "+nDu+" no concluyentes":"")+").","");
    }
  } else L.push("Sin datos suficientes.","");
  L.push("## Comprobación funcional","","| Comprobación | Resultado |","|---|---|",
    "| Batería con carga suficiente | "+si(pr.func.bateria)+" |",
    "| Segmentos del display legibles | "+si(pr.func.display)+" |",
    "| Pulsadores responden | "+si(pr.func.pulsadores)+" |",
    "| Puesta a cero y conteo continuo | "+si(pr.func.cero)+" |","",
    "## Observaciones","",(pr.obs||"—"),"",
    "## Alcance y limitaciones","",
    "1. Verificación interna. **No es un certificado de calibración trazable a un patrón nacional**, que solo puede",
    "   emitir un laboratorio acreditado.",
    "2. Los puntos comprobados cubren el rango habitual de uso. **El resultado no se extrapola fuera de ese rango**:",
    "   no acredita la marcha del oscilador en periodos largos, que exigiría un ensayo de varias horas.",
    "3. En intervalos de segundos o minutos la deriva del oscilador es despreciable frente a la resolución del",
    "   display: lo que se acredita es el comportamiento del instrumento tal como se usa.",
    "4. En medidas con arranque y parada manuales, la contribución dominante es el tiempo de reacción del operador,",
    "   del orden de 0,2 s, muy superior al error aquí verificado. Esa contribución pertenece al presupuesto de la",
    "   medida, no al del instrumento.","");
  if(D.tab==="ext") L.push("5. Las imágenes citadas en la tabla acompañan a este registro como muestra de cada lectura.","");
  return L.join("\n");
}

/* ------------------------------------------------- enlaces de una sola vez */
$("#tDisp").addEventListener("click",()=>{D.tab="disp"; guarda(); pinta();});
$("#tExt").addEventListener("click",()=>{D.tab="ext"; guarda(); pinta();});
$("#crGo").addEventListener("click",async()=>{
  if(SYNC.off===null){ alert("Sincroniza primero con UTC."); return; }
  if(CR.corriendo) return;
  const pr=P(); pr.puntos.forEach((p,i)=>{p.utc=null;p.cron=null;});
  CR.t0=performance.now(); CR.tStop=null; CR.corriendo=true; pinta();
  await crMarca();});
$("#crLap").addEventListener("click",()=>{ if(CR.corriendo) crMarca(); });
$("#crStop").addEventListener("click",async()=>{
  if(!CR.corriendo) return;
  CR.tStop=performance.now(); CR.corriendo=false; await crMarca(); });
