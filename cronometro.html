<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verificación de cronómetros contra UTC</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;
  --acc:#4493f8;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--org:#ff7b40}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);padding:0 0 40px;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:12px}
h1{margin:0;font-size:16px;font-weight:600}
h2{margin:22px 0 6px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}

#reloj{background:#000;border:1px solid var(--line);border-radius:10px;padding:16px 10px;text-align:center;margin:10px 0}
#utc{font:700 clamp(30px,10.5vw,54px)/1 ui-monospace,monospace;letter-spacing:.01em}
#fecha{font:600 14px ui-monospace,monospace;color:var(--dim);margin-top:6px}
#estado{font-size:12px;margin-top:9px;color:var(--dim)}
#crono{background:#07100a;border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;margin:10px 0}
#crNum{font:700 clamp(26px,8.5vw,44px)/1 ui-monospace,monospace;color:var(--ok)}
#crEt{font-size:11.5px;color:var(--dim);margin-top:5px}

.row{display:flex;gap:8px;align-items:center;margin:7px 0}
.row>label{flex:0 0 150px;color:var(--dim);font-size:12.5px}
input,select,textarea{flex:1 1 auto;min-width:0;background:#0d1117;color:var(--txt);
  border:1px solid var(--line);border-radius:6px;padding:8px 9px;font:14px ui-monospace,monospace}
textarea{font-size:12.5px;line-height:1.45;width:100%;min-height:230px}
.u{flex:0 0 auto;color:var(--dim);font-size:12px;width:52px}
button{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;font-size:13.5px;font-weight:500}
button:active{background:#30363d}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.g{background:var(--ok);border-color:var(--ok);color:#06240f}
button.o{background:var(--org);border-color:var(--org);color:#1a1000}
.btns{display:flex;gap:8px;margin:9px 0;flex-wrap:wrap}
.btns>button{flex:1 1 130px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin:9px 0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;color:var(--dim)}
.kv b{color:var(--txt);font-family:ui-monospace,monospace;font-weight:600;text-align:right}
.big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0}
.big b{font:700 26px/1.1 ui-monospace,monospace}
.big s{text-decoration:none;color:var(--dim);font-size:12px}
.verdict{margin-top:10px;padding:9px 11px;border-radius:6px;font-weight:600;font-size:13px;text-align:center}
.v-ok{background:rgba(63,185,80,.16);color:var(--ok);border:1px solid rgba(63,185,80,.4)}
.v-no{background:rgba(248,81,73,.16);color:var(--bad);border:1px solid rgba(248,81,73,.4)}
.v-na{background:rgba(210,153,34,.14);color:var(--warn);border:1px solid rgba(210,153,34,.38)}
.note{color:var(--dim);font-size:11.5px;line-height:1.55;margin:8px 0}
.err{color:var(--bad);font-size:12px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:11px}
td:first-child,th:first-child{text-align:left}
a{color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:none;border-radius:0;font-size:12.5px;padding:9px 4px;background:#0d1117;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.hide{display:none}
</style>
</head>
<body>
<header><div class="wrap"><h1>Verificación de cronómetros contra UTC</h1></div></header>
<div class="wrap">

<div id="reloj">
  <div id="utc">--:--:--.---</div>
  <div id="fecha">—</div>
  <div id="estado">Sin sincronizar</div>
</div>
<div id="crono">
  <div id="crNum">0.000</div>
  <div id="crEt">Cronómetro integrado · base de tiempos del dispositivo</div>
</div>
<div class="btns">
  <button class="p" id="crGo">Iniciar</button>
  <button class="o" id="crLap" disabled>Vuelta</button>
  <button id="crStop" disabled>Parar</button>
  <button id="crCero">Poner a cero</button>
</div>
<div id="crTabla"></div>
<div class="btns">
  <button class="p" id="bSync">Sincronizar con UTC</button>
  <button id="bTec">Detalle técnico</button>
</div>
<div id="servidores"></div>
<div id="syncDet" class="hide"></div>

<div id="app"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const fmt=(v,n=2)=>(v===null||v===undefined||!isFinite(v))?"—":v.toFixed(n).replace(".",",");
const T0 = Date.now() - performance.now();        // ancla reloj monótono → reloj de pared

/* ------------------------------------------------------------------ estado */
const NOM_DEF=[0,10,180,300];
const D = Object.assign({
  equipo:"", modelo:"", serie:"", resol:0.01,
  metodo:"foto",            // foto | lap
  uUtcFoto:0.005,           // reloj UTC leído en foto, s
  uDesfase:0.040,           // desfase entre las dos pulsaciones del doble lap, s
  mpeA:0.10,                // término fijo del criterio, s
  mpeB:1.0,                 // término proporcional, s/día
  tur:5,
  puntos:NOM_DEF.map(n=>({nom:n,utc:null,cron:null})),
  operador:"", obs:"",
  func:{bateria:false, display:false, pulsadores:false, cero:false}
}, JSON.parse(localStorage.getItem("cron.d")||"{}"));
if(!Array.isArray(D.puntos)||!D.puntos.length) D.puntos=NOM_DEF.map(n=>({nom:n,utc:null,cron:null}));
const guarda=()=>localStorage.setItem("cron.d",JSON.stringify(D));

const SYNC={off:null,u:null,fuente:null,rtt:null,n:0,log:[],err:"",fuentes:[]};
const CR={t0:null, corriendo:false, laps:[], pend:0};
let tecnico=false;

/* -------------------------------------------------------------- fuentes UTC */
const FUENTES=[
  {n:"timeapi.io",      url:"https://timeapi.io/api/Time/current/zone?timeZone=UTC",
   lee:j=>Date.parse((j.dateTime||"").replace(/Z?$/,"")+"Z")},
  {n:"worldtimeapi.org",url:"https://worldtimeapi.org/api/timezone/Etc/UTC",
   lee:j=>Date.parse(j.utc_datetime)},
  {n:"hourora.app",     url:"https://hourora.app/api/v1/time?timezone=UTC",
   lee:j=>Date.parse(j.utc)}
];
/* Intercambio al estilo NTP: con T1 el envío y T4 la recepción medidos en el
   reloj monótono local y Ts la marca del servidor, el desfase es
   Ts − (T1+T4)/2, con error acotado por la mitad del tiempo de ida y vuelta. */
async function sondea(f){
  const t1=performance.now();
  const r=await fetch(f.url,{cache:"no-store",mode:"cors"});
  const t4=performance.now();
  if(!r.ok) throw new Error(f.n+": HTTP "+r.status);
  const Ts=f.lee(await r.json());
  if(!isFinite(Ts)) throw new Error(f.n+": respuesta sin fecha legible");
  return {off: Ts-(T0+(t1+t4)/2), rtt: t4-t1, fuente:f.n};
}
/* Respaldo sin API: la cabecera Date es legible entre orígenes, con
   resolución de 1 s. Sondeando deprisa se detecta el cambio de segundo. */
async function sondeaCabecera(url, intentos=60){
  let prev=null, prevT=null;
  for(let i=0;i<intentos;i++){
    const t1=performance.now();
    const r=await fetch(url,{method:"HEAD",cache:"no-store"});
    const t4=performance.now();
    const d=r.headers.get("date");
    if(!d) throw new Error("el servidor no expone la cabecera Date");
    const v=Date.parse(d);
    if(prev!==null && v>prev)
      return {off: v-(T0+(prevT+t4)/2), rtt: t4-prevT, fuente:"cabecera Date de "+new URL(url).host};
    prev=v; prevT=t1;
    await new Promise(s=>setTimeout(s,40));
  }
  throw new Error("no se observó el cambio de segundo");
}
/* Sondea TODAS las fuentes, conserva el detalle de cada una y devuelve la de
   menor ida y vuelta. El detalle por servidor se muestra en pantalla y se
   vuelca al registro: la referencia de tiempos tiene que quedar identificada. */
async function sondeoMulti(reps=3, soloMejor=false){
  const det=[], buenos=[];
  const lista = soloMejor && SYNC.fuente ? FUENTES.filter(f=>f.n===SYNC.fuente) : FUENTES;
  for(const f of (lista.length?lista:FUENTES)){
    const r={n:f.n, url:f.url, ok:false, rtt:null, off:null, err:null, n_ok:0};
    for(let k=0;k<reps;k++){
      try{ const x=await sondea(f); buenos.push(x); r.ok=true; r.n_ok++;
           if(r.rtt===null||x.rtt<r.rtt){ r.rtt=x.rtt; r.off=x.off; } }
      catch(e){ r.err=String(e.message||e).replace(f.n+": ",""); break; }
    }
    det.push(r);
  }
  if(!buenos.length){
    try{ const x=await sondeaCabecera(location.href); buenos.push(x);
         det.push({n:x.fuente, url:location.origin, ok:true, rtt:x.rtt, off:x.off, err:null, n_ok:1}); }
    catch(e){ return {det, err:String(e.message||e)}; }
  }
  buenos.sort((a,b)=>a.rtt-b.rtt);
  const m=buenos[0];
  return {det, off:m.off, u:m.rtt/2, rtt:m.rtt, fuente:m.fuente, n:buenos.length};
}
async function sincroniza(){
  SYNC.err=""; pinta();
  const r=await sondeoMulti(3);
  SYNC.fuentes=r.det;
  SYNC.log=r.det.map(d=>d.ok? ("✓ "+d.n+": "+d.n_ok+" sondeos, mejor ida y vuelta "+fmt(d.rtt,0)+" ms")
                            : ("✗ "+d.n+": "+(d.err||"sin respuesta")));
  if(r.err||r.off===undefined){ SYNC.err="No se pudo obtener UTC: "+(r.err||"ninguna fuente respondió"); pinta(); return; }
  SYNC.off=r.off; SYNC.u=r.u; SYNC.fuente=r.fuente; SYNC.rtt=r.rtt; SYNC.n=r.n;
  pinta();
}
const utcAhora = () => SYNC.off===null ? null : T0+performance.now()+SYNC.off;
function hms(ms){
  if(ms===null||ms===undefined) return {h:"--:--:--.---",f:"—"};
  const d=new Date(ms), p=(x,n=2)=>String(x).padStart(n,"0");
  return {h:p(d.getUTCHours())+":"+p(d.getUTCMinutes())+":"+p(d.getUTCSeconds())+"."+p(d.getUTCMilliseconds(),3),
          f:d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" UTC"};
}
function tic(){
  const t=utcAhora(), o=hms(t);
  $("#utc").textContent=o.h; $("#fecha").textContent=o.f;
  $("#utc").style.color = t===null?"var(--dim)":"var(--txt)";
  requestAnimationFrame(tic);
}

/* ----------------------------------------------------- cronómetro integrado */
/* Corre sobre performance.now(), es decir sobre el oscilador del dispositivo,
   el mismo del que cuelga el reloj del sistema y, por tanto, la app de reloj.
   Lo que mide frente a UTC es la BASE DE TIEMPOS DEL APARATO; no mide la
   latencia de los pulsadores de la app de reloj ni el tiempo de reacción.

   Cada vuelta dispara su propia sincronización. Sin eso la desviación saldría
   cero por construcción, porque el reloj UTC en pantalla está anclado al mismo
   reloj monótono que el cronómetro: solo una consulta nueva a la red aporta
   una referencia independiente de ese oscilador. */
function crElapsed(){ return CR.t0===null?0:(performance.now()-CR.t0)/1000; }
let crUltima=0;
async function crMarca(etiqueta){
  const ahora=performance.now();
  if(ahora-crUltima<250) return;        // rebote: dos vueltas no caben en 250 ms
  crUltima=ahora;
  const tAbs=ahora, t=(tAbs-CR.t0)/1000;
  const L={t, utc:null, u:null, fuente:null, et:etiqueta};
  CR.laps.push(L); CR.pend++; pinta();
  /* En cada vuelta solo se consulta el servidor más rápido: tres peticiones
     en vez de nueve. El barrido completo de todas las fuentes, que es el que
     da la comprobación cruzada del registro, lo hace el botón de sincronizar. */
  let r=await sondeoMulti(3,true);
  if(r.off===undefined) r=await sondeoMulti(2);
  CR.pend--;
  if(r.off!==undefined){ L.utc=T0+tAbs+r.off; L.u=r.u; L.fuente=r.fuente;
    SYNC.off=r.off; SYNC.u=r.u; SYNC.rtt=r.rtt;
    if(r.det.length>=FUENTES.length){ SYNC.fuente=r.fuente; SYNC.fuentes=r.det; } }
  else L.fuente="sin respuesta";
  pinta();
}
function crDesv(){
  const L=CR.laps.filter(x=>x.utc!==null);
  if(L.length<2) return [];
  const o=L[0];
  return L.slice(1).map(x=>{
    const dT=(x.utc-o.utc)/1000, dS=x.t-o.t, e=dS-dT;
    const U=2*Math.hypot((o.u||0)/1000,(x.u||0)/1000);
    return {t:x.t, dT, dS, e, U, ppm: dT>0? e/dT*1e6:null};
  });
}
function crTic(){
  const n=$("#crNum");
  if(n) n.textContent = crElapsed().toFixed(3).replace(".",",");
  requestAnimationFrame(crTic);
}

/* ------------------------------------------------------------ incertidumbre */
/* Incertidumbre de la lectura de UN punto, según cómo se capture el par
   cronómetro–UTC:

   · foto: ambos displays en marcha en la misma imagen. La foto es la
     simultaneidad, así que no hay tiempo de reacción ni desfase entre
     pulsaciones. Quedan la cuantificación del display del cronómetro y la
     granularidad de refresco del reloj en pantalla, uniforme sobre un
     fotograma de 60 Hz, es decir 16,7/√12 ≈ 5 ms. El retardo fijo de
     renderizado no entra: es común a todos los puntos y se cancela al restar.

   · doble lap: se congelan los dos relojes con dos pulsaciones. El desfase
     entre ellas NO se cancela y entra entero, y domina el presupuesto. */
function uPunto(){
  const uCron=(+D.resol||0.01)/Math.sqrt(12);
  if(D.metodo==="foto") return Math.hypot(uCron, +D.uUtcFoto||0.005);
  return Math.hypot(uCron, (SYNC.u??20)/1000, +D.uDesfase||0.040);
}
const uIntervalo = () => Math.SQRT2*uPunto();      // origen y punto, independientes
const mpeDe = dT => (+D.mpeA||0) + (+D.mpeB||0)*dT/86400;

function resultados(){
  const P=D.puntos, o=P[0];
  if(!o || o.utc===null || o.cron===null) return null;
  const u=uIntervalo(), U=2*u;
  return P.map((p,i)=>{
    if(i===0) return {i,nom:p.nom,origen:true};
    if(p.utc===null||p.cron===null) return {i,nom:p.nom,vacio:true};
    const dT=(p.utc-o.utc)/1000, dS=(+p.cron)-(+o.cron), e=dS-dT;
    const mpe=mpeDe(dT), tur=U>0?mpe/U:null;
    return {i,nom:p.nom,dT,dS,e,U,u,mpe,tur,
            ppm: dT>0? e/dT*1e6 : null, sdia: dT>0? e/dT*86400 : null,
            apto: Math.abs(e)+U<=mpe,
            dudoso: Math.abs(e)-U<mpe && Math.abs(e)+U>mpe};
  });
}
const nomTxt=s=>s<60?(s+" s"):(s%60?(Math.floor(s/60)+" min "+(s%60)+" s"):(s/60+" min"));

/* -------------------------------------------------------------------- vista */
function pinta(){
  const e=$("#estado");
  if(SYNC.err) e.innerHTML='<span style="color:var(--bad)">'+SYNC.err+'</span>';
  else if(SYNC.off===null) e.textContent="Sin sincronizar — pulsa «Sincronizar con UTC»";
  else e.innerHTML='Fuente: <b>'+SYNC.fuente+'</b> · incertidumbre ±'+fmt(SYNC.u,0)+' ms · ida y vuelta '+fmt(SYNC.rtt,0)+' ms';
  // --- servidores de tiempo utilizados ---
  const F=SYNC.fuentes||[];
  $("#servidores").innerHTML = !F.length ? "" : `<div class="card">
    <div class="kv" style="color:var(--txt)"><b style="text-align:left">Servidores de tiempo consultados</b><b></b></div>
    <table><tr><th>Servidor</th><th>Estado</th><th>Ida y vuelta</th><th></th></tr>
    ${F.map(d=>`<tr>
      <td style="font-size:11.5px">${d.n}<br><span style="color:var(--dim);font-size:10.5px">${d.url||""}</span></td>
      <td style="color:${d.ok?"var(--ok)":"var(--bad)"}">${d.ok?d.n_ok+" sondeos":"sin respuesta"}</td>
      <td>${d.rtt===null?"—":fmt(d.rtt,0)+" ms"}</td>
      <td>${d.n===SYNC.fuente?'<b style="color:var(--acc)">usado</b>':""}</td>
    </tr>`).join("")}</table>
    <div class="note" style="margin:6px 0 0">Se consultan todas y se adopta la de menor ida y vuelta, porque es la
    que da la estimación más ajustada del desfase. Las demás quedan registradas como comprobación cruzada.
    ${F.filter(d=>d.ok&&d.off!==null).length>1?"Dispersión entre servidores: ±"+
      fmt((Math.max(...F.filter(d=>d.ok).map(d=>d.off))-Math.min(...F.filter(d=>d.ok).map(d=>d.off)))/2,0)+
      " ms, que acota el acuerdo real entre fuentes independientes.":""}</div></div>`;

  // --- cronómetro integrado ---
  $("#crGo").disabled=CR.corriendo; $("#crLap").disabled=!CR.corriendo; $("#crStop").disabled=!CR.corriendo;
  const dv=crDesv();
  $("#crTabla").innerHTML = !CR.laps.length ? "" : `<div class="card">
    <table><tr><th>Vuelta</th><th>Cronómetro</th><th>Referencia</th><th>Desviación</th></tr>
    ${CR.laps.map((L,i)=>{
      const d=i===0?null:dv[i-1];
      return `<tr><td>${i===0?"<b>origen</b>":i}</td>
        <td>${fmt(L.t,3)} s</td>
        <td>${L.utc===null?(CR.pend?"sincronizando…":"—"):fmt(d?d.dT:0,3)+" s"}</td>
        <td>${!d?"—":`${d.e>=0?"+":""}${fmt(d.e,3)} ± ${fmt(d.U,3)} s`}</td></tr>`;
    }).join("")}</table>
    ${dv.length?`<div class="note" style="margin:6px 0 0">Mide la <b>base de tiempos del aparato</b> frente a la red,
      que es la misma de la que cuelga la app de reloj. No mide la latencia de sus pulsadores ni el tiempo de
      reacción. En intervalos de minutos la desviación mostrada está dominada por la incertidumbre de red, no por el
      oscilador: ${Math.abs(dv[dv.length-1].e)<=dv[dv.length-1].U
        ?"los valores son compatibles con cero, es decir, el oscilador del móvil no es una contribución detectable aquí."
        :"la desviación supera su incertidumbre, lo que sí apunta a un oscilador apreciablemente desviado."}</div>`:""}
    <div class="btns"><button id="crUsar">Usar estas vueltas como puntos de comprobación</button></div></div>`;

  $("#syncDet").className = tecnico?"":"hide";
  $("#syncDet").innerHTML = tecnico? `<div class="card"><div class="note" style="margin:0">
    <b>Cómo se obtiene el UTC.</b> Se marca el envío y la recepción con el reloj monótono del navegador y se toma la
    marca del servidor: el desfase es esa marca menos el punto medio del intercambio, con error acotado por la mitad
    del tiempo de ida y vuelta, que es lo que se declara. Se lanzan varios sondeos y se conserva el de menor ida y vuelta.
    <br><br><b>En el método fotográfico el desfase absoluto casi no importa</b>, porque todos los puntos se comparan
    contra el mismo reloj y la resta elimina cualquier desfase común, incluido el retardo de renderizado de la pantalla.
    Lo que entra es la granularidad de refresco entre un punto y otro.
    <br><br><b>Esto no es trazabilidad.</b> Un certificado trazable a un patrón nacional solo lo emite un laboratorio acreditado.
    <br><br>Último sondeo:<br>${SYNC.log.map(x=>"· "+x).join("<br>")||"—"}</div></div>`:"";

  const R=resultados(), o=D.puntos[0];
  let h="";

  h+=`<h2>Equipo verificado</h2>
  <div class="row"><label>Identificación</label><input id="fEq" value="${(D.equipo||"").replace(/"/g,"&quot;")}" placeholder="p. ej. CRON-03"></div>
  <div class="row"><label>Marca y modelo</label><input id="fMod" value="${(D.modelo||"").replace(/"/g,"&quot;")}"></div>
  <div class="row"><label>Número de serie</label><input id="fSer" value="${(D.serie||"").replace(/"/g,"&quot;")}"></div>
  <div class="row"><label>Resolución del display</label><input type="number" step="0.001" id="fRes" value="${D.resol}"><span class="u">s</span></div>

  <h2>Método de captura</h2>
  <div class="seg">
    <button class="${D.metodo==="foto"?"on":""}" id="mFoto">Foto de ambos displays</button>
    <button class="${D.metodo==="lap"?"on":""}" id="mLap">Doble lap simultáneo</button>
  </div>`;

  if(D.metodo==="foto"){
    h+=`<div class="note">Con el cronómetro <b>en marcha</b>, fotografía en la misma imagen su display y el reloj UTC
    de esta pantalla. La foto es la simultaneidad: no hay que pulsar nada, así que no entra ni tiempo de reacción ni
    desfase entre pulsaciones. Usa exposición corta; a 1/200 s los dos displays salen nítidos. Después lees ambas
    cifras de la foto y las tecleas abajo.</div>
    <div class="row"><label>Lectura del UTC en foto</label><input type="number" step="0.001" id="fUF" value="${D.uUtcFoto}"><span class="u">s</span></div>
    <div class="note">Por defecto 0,005 s: el reloj se refresca a 60 Hz, de modo que el valor mostrado se queda entre
    0 y 16,7 ms por detrás del real, repartido uniformemente, lo que da 16,7/√12 ≈ 5 ms. El retardo fijo de
    renderizado no cuenta, porque es común a todos los puntos y desaparece al restar.</div>`;
  } else {
    h+=`<div class="note">Se congelan los dos relojes con dos pulsaciones simultáneas, el <i>lap</i> del cronómetro y
    el botón de esta pantalla, y después se fotografía el display para dejar constancia.
    <b>El desfase entre las dos pulsaciones no se cancela y domina el presupuesto</b>, porque afecta solo a uno de
    los dos relojes.</div>
    <div class="row"><label>Desfase entre pulsaciones</label><input type="number" step="0.005" id="fUD" value="${D.uDesfase}"><span class="u">s</span></div>`;
  }
  h+=`<div class="card">
    <div class="kv"><span>incertidumbre por punto</span><b>${fmt(uPunto(),4)} s</b></div>
    <div class="kv"><span>U del intervalo (k = 2)</span><b>± ${fmt(2*uIntervalo(),4)} s</b></div>
    <div class="kv"><span>TUR frente al término fijo del criterio</span><b>${fmt(D.mpeA/(2*uIntervalo()),1)} : 1 ${
      D.mpeA/(2*uIntervalo())>=D.tur?"✓":"✗"}</b></div>
  </div>`;
  if(D.metodo==="lap" && D.mpeA/(2*uIntervalo())<D.tur)
    h+=`<div class="verdict v-no">Con este desfase el método no discrimina el criterio: la incertidumbre es
      comparable a la propia tolerancia. Pasa al método fotográfico.</div>`;

  h+=`<h2>Criterio de aceptación</h2>
  <div class="row"><label>Error máximo, fijo</label><input type="number" step="0.01" id="fA" value="${D.mpeA}"><span class="u">s</span></div>
  <div class="row"><label>Error máximo, proporcional</label><input type="number" step="0.1" id="fB" value="${D.mpeB}"><span class="u">s/día</span></div>
  <div class="row"><label>Relación TUR exigida</label><input type="number" step="1" id="fTur" value="${D.tur}"><span class="u">: 1</span></div>
  <div class="card"><div class="kv"><span>error máximo admisible en cada punto</span><b></b></div>
    ${D.puntos.filter((p,i)=>i>0).map(p=>`<div class="kv"><span>${nomTxt(p.nom)}</span><b>± ${fmt(mpeDe(p.nom),4)} s</b></div>`).join("")}
  </div>
  <div class="note"><b>Por qué el criterio tiene dos términos.</b> En intervalos cortos la deriva del oscilador no se
  manifiesta: en 10 s, un cronómetro con 1 s/día de deriva se desvía 0,12 ms, mil veces menos que la resolución del
  display. Lo que se verifica en el rango corto es el conjunto del instrumento tal como se usa, y su límite es
  absoluto. El término proporcional solo empieza a mandar en intervalos largos, donde sí aparece la deriva.
  Con ±0,1 s y 1 s/día, el límite vale 0,100 s a los 10 s y 0,104 s a los 5 min: en todo el rango que admite el
  organismo notificado manda el término fijo.
  <b>Valores por defecto como recomendación propia, no como requisito normativo.</b></div>

  <h2>Puntos de comprobación</h2>
  <div class="note">El primer punto es el origen: puede tomarse en cualquier instante con el cronómetro ya en marcha,
  y no hace falta que marque cero. Los demás se comparan contra él, así que lo que importa es la diferencia entre
  ambas lecturas, no su valor absoluto.${o&&o.cron!==null?` Para el siguiente punto, dispara cuando el cronómetro
  marque en torno a <b>${fmt((+o.cron)+(D.puntos.find(p=>p.cron===null)?.nom??0),2)} s</b>.`:""}</div>
  <table>
    <tr><th>Punto</th><th>UTC</th><th>Cronómetro</th><th></th></tr>
    ${D.puntos.map((p,i)=>`<tr>
      <td><b>${i===0?"Origen":nomTxt(p.nom)}</b></td>
      <td style="font-family:ui-monospace,monospace;font-size:11.5px">${p.utc===null?"—":hms(p.utc).h}</td>
      <td><input type="number" step="0.001" class="pc" data-i="${i}" value="${p.cron??""}" placeholder="s"></td>
      <td><button class="mini pcap" data-i="${i}" style="padding:5px 8px;font-size:11.5px">${D.metodo==="lap"?"lap":"ahora"}</button>
          ${i>1?`<button class="mini pdel" data-i="${i}" style="padding:5px 7px;font-size:11.5px">×</button>`:""}</td>
    </tr>
    <tr><td colspan="4" style="padding:0 0 7px 0;border:none">
      <input type="text" class="pu" data-i="${i}" placeholder="o teclea el UTC leído en la foto: ${hms(Date.now()).f.slice(0,10)}T21:30:00.000Z"
        style="width:100%;font-size:11.5px;padding:5px 7px"></td></tr>`).join("")}
  </table>
  <div class="btns"><button id="pAdd">+ punto</button>
    <button id="pReset">Restaurar 10 s / 3 min / 5 min</button></div>

  <h2>Resultado</h2>`;
  if(!R) h+=`<div class="card"><div class="note" style="margin:0">Registra el punto de origen para empezar.</div></div>`;
  else{
    const hechos=R.filter(x=>!x.origen&&!x.vacio);
    if(!hechos.length) h+=`<div class="card"><div class="note" style="margin:0">Origen registrado. Añade al menos un punto más.</div></div>`;
    else{
      h+=`<table>
        <tr><th>Intervalo</th><th>Referencia</th><th>Cronómetro</th><th>Error</th><th>Límite</th><th></th></tr>
        ${hechos.map(x=>`<tr>
          <td>${nomTxt(x.nom)}</td>
          <td>${fmt(x.dT,3)} s</td>
          <td>${fmt(x.dS,3)} s</td>
          <td style="color:${x.dudoso?"var(--warn)":(x.apto?"var(--ok)":"var(--bad)")}"><b>${x.e>=0?"+":""}${fmt(x.e,3)}</b></td>
          <td>± ${fmt(x.mpe,3)}</td>
          <td>${x.dudoso?"?":(x.apto?"✓":"✗")}</td>
        </tr>`).join("")}
      </table>
      <div class="note">Error = intervalo del cronómetro − intervalo de referencia. U (k = 2) común a todos los
      puntos: ± ${fmt(hechos[0].U,4)} s. Un resultado marcado «?» es no concluyente: la incertidumbre se solapa con
      el límite y el ensayo no permite afirmar ni lo uno ni lo otro.</div>`;
      const nAp=hechos.filter(x=>x.apto).length, nDu=hechos.filter(x=>x.dudoso).length;
      const cls = nDu? "v-na" : (nAp===hechos.length?"v-ok":"v-no");
      const txt = nDu? "NO CONCLUYENTE en "+nDu+" de "+hechos.length+" puntos"
                : (nAp===hechos.length?"APTO en los "+hechos.length+" puntos comprobados"
                                      :"NO APTO en "+(hechos.length-nAp)+" de "+hechos.length+" puntos");
      h+=`<div class="verdict ${cls}">${txt}</div>`;
      const lar=hechos[hechos.length-1];
      if(lar.dT>=60) h+=`<div class="note">Deriva equivalente en el intervalo más largo:
        <b>${lar.sdia>=0?"+":""}${fmt(lar.sdia,1)} s/día</b> (${lar.ppm>=0?"+":""}${fmt(lar.ppm,0)} ppm). Dato
        informativo: en intervalos de minutos esta cifra está dominada por la lectura, no por el oscilador, así que
        no debe tomarse como la marcha del cronómetro.</div>`;
      if(tecnico) h+=`<h2>Presupuesto de incertidumbre</h2>
        <table><tr><th>Contribución, por punto</th><th>u (s)</th></tr>
          <tr><td>Cuantificación del display del cronómetro (resolución/√12)</td><td>${fmt((+D.resol||0.01)/Math.sqrt(12),4)}</td></tr>
          ${D.metodo==="foto"
            ?`<tr><td>Lectura del reloj UTC en la foto</td><td>${fmt(+D.uUtcFoto,4)}</td></tr>`
            :`<tr><td>Referencia UTC de red</td><td>${fmt((SYNC.u??20)/1000,4)}</td></tr>
              <tr><td>Desfase entre las dos pulsaciones</td><td>${fmt(+D.uDesfase,4)}</td></tr>`}
          <tr><td><b>u por punto</b></td><td><b>${fmt(uPunto(),4)}</b></td></tr>
          <tr><td>u del intervalo (origen y punto, independientes)</td><td>${fmt(uIntervalo(),4)}</td></tr>
          <tr><td><b>U (k = 2)</b></td><td><b>${fmt(2*uIntervalo(),4)}</b></td></tr>
        </table>`;
    }
  }

  h+=`<h2>Comprobación funcional</h2>
  <div class="note">Son los fallos que de verdad estropean una medida, y ninguno se detecta comparando intervalos.</div>
  ${[["bateria","Batería con carga suficiente, sin aviso de nivel bajo"],
     ["display","Todos los segmentos del display encienden y se leen"],
     ["pulsadores","Arranque, parada, lap y puesta a cero responden a la primera"],
     ["cero","Puesta a cero correcta y el conteo no se detiene solo"]]
   .map(([k,t])=>`<div class="row" style="align-items:flex-start">
     <input type="checkbox" class="fk" data-k="${k}" ${D.func[k]?"checked":""}
       style="flex:0 0 auto;width:19px;height:19px;margin-top:2px">
     <label style="flex:1 1 auto;color:var(--txt);font-size:13px">${t}</label></div>`).join("")}

  <h2>Registro de verificación</h2>
  <div class="row"><label>Operador</label><input id="fOp" value="${(D.operador||"").replace(/"/g,"&quot;")}"></div>
  <div class="row"><label>Observaciones</label><input id="fObs" value="${(D.obs||"").replace(/"/g,"&quot;")}"></div>
  <div class="btns">
    <button class="g" id="bReg">Generar registro</button>
    <button id="bCopia">Copiar</button>
    <button id="bDesc">Descargar</button>
    <button id="bNuevo">Nueva verificación</button>
  </div>
  <textarea id="salida" readonly placeholder="Pulsa «Generar registro»"></textarea>
  <div class="note">Herramienta de verificación interna. No sustituye a un certificado de calibración trazable,
  que solo emite un laboratorio acreditado. <a href="index.html">Visor pirotécnico digital</a></div>`;

  $("#app").innerHTML=h;
  enlaza();
}

/* ------------------------------------------------------------ vinculaciones */
function enlaza(){
  const on=(id,ev,fn)=>{const x=$("#"+id); if(x) x.addEventListener(ev,fn);};
  const txt=(id,k)=>on(id,"input",e=>{D[k]=e.target.value; guarda();});
  const num=(id,k)=>on(id,"change",e=>{D[k]=e.target.value===""?null:+e.target.value; guarda(); pinta();});

  txt("fEq","equipo"); txt("fMod","modelo"); txt("fSer","serie");
  txt("fOp","operador"); txt("fObs","obs");
  num("fRes","resol"); num("fA","mpeA"); num("fB","mpeB"); num("fTur","tur");
  num("fUF","uUtcFoto"); num("fUD","uDesfase");
  on("mFoto","click",()=>{D.metodo="foto"; guarda(); pinta();});
  on("mLap","click",()=>{D.metodo="lap"; guarda(); pinta();});

  document.querySelectorAll(".fk").forEach(x=>x.addEventListener("change",e=>{
    D.func[e.target.dataset.k]=e.target.checked; guarda();}));
  document.querySelectorAll(".pc").forEach(x=>x.addEventListener("change",e=>{
    D.puntos[+e.target.dataset.i].cron = e.target.value===""?null:+e.target.value; guarda(); pinta();}));
  document.querySelectorAll(".pcap").forEach(b=>b.addEventListener("click",e=>{
    const t=utcAhora(); if(t===null){alert("Sincroniza primero con UTC.");return;}
    D.puntos[+e.currentTarget.dataset.i].utc=t; guarda(); pinta();}));
  document.querySelectorAll(".pu").forEach(x=>x.addEventListener("change",e=>{
    const v=Date.parse(e.target.value);
    if(!isFinite(v)){alert("Fecha no reconocida. Usa 2026-11-15T21:30:00.000Z");return;}
    D.puntos[+e.target.dataset.i].utc=v; guarda(); pinta();}));
  document.querySelectorAll(".pdel").forEach(b=>b.addEventListener("click",e=>{
    D.puntos.splice(+e.currentTarget.dataset.i,1); guarda(); pinta();}));
  on("pAdd","click",()=>{
    const v=prompt("Intervalo nominal del nuevo punto, en segundos:","600");
    if(v===null||!isFinite(+v)) return;
    D.puntos.push({nom:+v,utc:null,cron:null});
    D.puntos.sort((a,b)=>a.nom-b.nom); guarda(); pinta();});
  on("pReset","click",()=>{
    if(!confirm("¿Restaurar los puntos a origen, 10 s, 3 min y 5 min? Se pierden las lecturas.")) return;
    D.puntos=NOM_DEF.map(n=>({nom:n,utc:null,cron:null})); guarda(); pinta();});

  on("crUsar","click",()=>{
    const L=CR.laps.filter(x=>x.utc!==null);
    if(L.length<2){ alert("Hacen falta al menos dos vueltas con referencia."); return; }
    D.puntos = L.map((x,i)=>({nom: i===0?0:Math.round(x.t-L[0].t), utc:x.utc, cron:+x.t.toFixed(3)}));
    guarda(); pinta();
    alert("Puntos de comprobación rellenados con "+L.length+" vueltas.");});

  on("bReg","click",()=>{$("#salida").value=registro();});
  on("bCopia","click",()=>{const s=$("#salida"); if(!s.value) s.value=registro();
    navigator.clipboard?.writeText(s.value); s.select();});
  on("bDesc","click",()=>{
    const s=$("#salida").value||registro();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([s],{type:"text/markdown;charset=utf-8"}));
    a.download="verificacion-cronometro-"+(D.equipo||"sin-id").replace(/\W+/g,"-")+"-"+
      new Date().toISOString().slice(0,10)+".md";
    a.click(); URL.revokeObjectURL(a.href);});
  on("bNuevo","click",()=>{
    if(!confirm("¿Empezar una verificación nueva? Se borran las lecturas y las observaciones.\n\nSe conservan equipo, criterio y método.")) return;
    D.puntos=D.puntos.map(p=>({nom:p.nom,utc:null,cron:null}));
    D.obs=""; D.func={bateria:false,display:false,pulsadores:false,cero:false};
    guarda(); $("#salida").value=""; pinta();});
}

/* -------------------------------------------------------------- el registro */
function registro(){
  const R=resultados(), iso=t=>t?new Date(t).toISOString():"—", si=b=>b?"sí":"NO";
  const L=[];
  L.push("# Registro de verificación de cronómetro","",
    "| | |","|---|---|",
    "| Fecha del registro | "+new Date().toISOString().slice(0,19).replace("T"," ")+" UTC |",
    "| Equipo | "+(D.equipo||"—")+" |",
    "| Marca y modelo | "+(D.modelo||"—")+" |",
    "| Número de serie | "+(D.serie||"—")+" |",
    "| Resolución del display | "+fmt(D.resol,3)+" s |",
    "| Operador | "+(D.operador||"—")+" |","",
    "## Método","",
    "Verificación por comparación directa en varios puntos repartidos por el rango habitual de uso, contra una",
    "referencia UTC obtenida por servicio horario en red. Todos los puntos se comparan contra un punto de origen",
    "común, de modo que cualquier desfase constante de la referencia se cancela al restar.","",
    D.metodo==="foto"
      ? "Captura de cada punto: fotografía única que recoge, con el cronómetro en marcha, su display y el reloj UTC\nen pantalla. La imagen establece la simultaneidad, por lo que no intervienen el tiempo de reacción del\noperador ni el desfase entre pulsaciones."
      : "Captura de cada punto: doble pulsación simultánea del lap del cronómetro y del botón de captura en pantalla,\ncon fotografía posterior del display congelado como constancia. El desfase entre ambas pulsaciones no se\ncancela y constituye la contribución dominante.",
    "","### Fuentes horarias utilizadas","",
    "| Servidor | URL | Estado | Ida y vuelta | Adoptado |","|---|---|---|---|---|",
    ...((SYNC.fuentes||[]).map(d=>"| "+d.n+" | "+(d.url||"—")+" | "+(d.ok?d.n_ok+" sondeos correctos":"sin respuesta: "+(d.err||"—"))+
       " | "+(d.rtt===null?"—":fmt(d.rtt,0)+" ms")+" | "+(d.n===SYNC.fuente?"sí":"no")+" |")),
    "",
    "Se consultan todas las fuentes y se adopta la de menor tiempo de ida y vuelta. La incertidumbre declarada en",
    "cada punto es la mitad de ese tiempo, cota conservadora que supone el peor reparto posible del camino.",
    "","## Criterio de aceptación","",
    "Error máximo admisible EMA = ±("+fmt(D.mpeA,3)+" s + "+fmt(D.mpeB,2)+" s/día × T).",
    "Relación TUR exigida: "+fmt(D.tur,0)+":1. Criterio interno, no requisito normativo.","",
    "## Resultados","");
  if(R){
    const o=D.puntos[0], hechos=R.filter(x=>!x.origen&&!x.vacio);
    L.push("Punto de origen: UTC "+iso(o.utc)+", cronómetro "+fmt(o.cron,3)+" s.","",
      "| Intervalo nominal | Referencia ΔT (s) | Cronómetro ΔS (s) | Error (s) | EMA (s) | Veredicto |",
      "|---|---|---|---|---|---|");
    hechos.forEach(x=>L.push("| "+nomTxt(x.nom)+" | "+fmt(x.dT,3)+" | "+fmt(x.dS,3)+" | "+
      (x.e>=0?"+":"")+fmt(x.e,3)+" | ± "+fmt(x.mpe,3)+" | "+
      (x.dudoso?"NO CONCLUYENTE":(x.apto?"APTO":"NO APTO"))+" |"));
    if(hechos.length){
      const U=hechos[0].U;
      L.push("","Incertidumbre expandida U (k = 2) común a todos los intervalos: ± "+fmt(U,4)+" s.",
        "TUR conseguido frente al término fijo del criterio: "+fmt(D.mpeA/U,1)+":1.","",
        "### Presupuesto de incertidumbre","",
        "| Contribución, por punto | u (s) |","|---|---|",
        "| Cuantificación del display (resolución/√12) | "+fmt((+D.resol||0.01)/Math.sqrt(12),4)+" |");
      if(D.metodo==="foto") L.push("| Lectura del reloj UTC en la foto | "+fmt(+D.uUtcFoto,4)+" |");
      else L.push("| Referencia UTC de red | "+fmt((SYNC.u??20)/1000,4)+" |",
                  "| Desfase entre las dos pulsaciones | "+fmt(+D.uDesfase,4)+" |");
      L.push("| u por punto | "+fmt(uPunto(),4)+" |",
             "| u del intervalo | "+fmt(uIntervalo(),4)+" |",
             "| U (k = 2) | "+fmt(2*uIntervalo(),4)+" |","");
      const nAp=hechos.filter(x=>x.apto).length, nDu=hechos.filter(x=>x.dudoso).length;
      L.push("**Veredicto global: "+(nDu?"NO CONCLUYENTE":(nAp===hechos.length?"APTO":"NO APTO"))+
        "** ("+nAp+" de "+hechos.length+" puntos dentro del criterio"+(nDu?", "+nDu+" no concluyentes":"")+").","");
    }
  } else L.push("Sin datos suficientes.","");
  L.push("## Comprobación funcional","",
    "| Comprobación | Resultado |","|---|---|",
    "| Batería con carga suficiente | "+si(D.func.bateria)+" |",
    "| Segmentos del display legibles | "+si(D.func.display)+" |",
    "| Pulsadores responden | "+si(D.func.pulsadores)+" |",
    "| Puesta a cero y conteo continuo | "+si(D.func.cero)+" |","",
    "## Observaciones","",(D.obs||"—"),"",
    "## Alcance y limitaciones","",
    "1. Verificación interna. **No es un certificado de calibración trazable a un patrón nacional**, que solo puede",
    "   emitir un laboratorio acreditado.",
    "2. La referencia UTC procede de un servicio horario público consultado por red. En el método fotográfico un",
    "   desfase constante de esa referencia no afecta al resultado, porque todos los puntos se restan de un origen",
    "   común; lo que entra es la incertidumbre de lectura en cada punto.",
    "3. Los puntos comprobados cubren el rango habitual de uso del instrumento. **El resultado no se extrapola a",
    "   intervalos fuera de ese rango**: en particular, no acredita la marcha del oscilador en periodos largos, que",
    "   requeriría un ensayo de varias horas.",
    "4. En intervalos de segundos o minutos, la deriva del oscilador es despreciable frente a la resolución del",
    "   display: lo que esta verificación acredita es el comportamiento del instrumento en conjunto tal como se usa.",
    "5. En las medidas de tiempos de combustión, retardo y duración de efecto realizadas con arranque y parada",
    "   manuales, la contribución dominante es el tiempo de reacción del operador, del orden de 0,2 s, muy superior",
    "   al error aquí verificado. Esa contribución debe figurar en el presupuesto de incertidumbre de la medida, no",
    "   en el del instrumento.","");
  return L.join("\n");
}

/* Los controles del cronómetro viven en el encabezado, que NO se repinta.
   Se enlazan una sola vez, aquí: hacerlo dentro de enlaza(), que corre en
   cada repintado, acumulaba un manejador por repintado y una pulsación
   acababa generando decenas de vueltas. */
$("#crGo").addEventListener("click",async()=>{
  if(SYNC.off===null){ alert("Sincroniza primero con UTC."); return; }
  if(CR.corriendo) return;
  CR.t0=performance.now(); CR.corriendo=true; CR.laps=[]; pinta();
  await crMarca("origen");});
$("#crLap").addEventListener("click",()=>{ if(CR.corriendo) crMarca("vuelta"); });
$("#crStop").addEventListener("click",async()=>{
  if(!CR.corriendo) return;
  CR.corriendo=false; await crMarca("parada"); });
$("#crCero").addEventListener("click",()=>{
  if(CR.laps.length&&!confirm("¿Borrar las vueltas?")) return;
  CR.t0=null; CR.corriendo=false; CR.laps=[]; pinta(); });

$("#bSync").addEventListener("click",sincroniza);
$("#bTec").addEventListener("click",()=>{tecnico=!tecnico; pinta();});
pinta(); tic(); crTic(); sincroniza();
</script>
</body>
</html>
