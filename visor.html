      ${S.camaras.map(c=>`<option value="${c.id}"${c.id===S.calib.camaraId?" selected":""}>${c.nombre}</option>`).join("")}
    </select></div>
    <div class="note">Esta imagen no procede de una captura, así que la página no sabe con qué cámara se tomó.
    ${S.camaras.length
      ? "Elígela si corresponde a una de las tuyas; si viene de otro equipo, déjalo en «ninguna» y el perfil se seleccionará a mano en Foto o Vídeo."
      : "<b>Aún no has definido ninguna cámara</b>: hazlo en la pestaña Cámaras si esta imagen procede de una de las tuyas."}</div>`;
}
function estadoCalib(){
  const pts=S.calib.puntos;
  const fij=pts.filter(p=>p.y!==null && isFinite(+p.h)).length;
  const alt=pts.filter(p=>isFinite(+p.h)).length;
  const min=S.calib.tipo==="phi"?2:3;
  const perfil = perfilDe(S.calib.camaraId, S.calib.uso||"foto");
  const geom=!!(+S.calib.d) && S.calib.hCam!=="" && S.calib.hCam!==null;
  return {fij, alt, min, nTot:pts.length, geom, perfil,
          ajuste: !!(S.calib.out && !S.calib.out.err),
          listo: geom && fij>=min};
}
function uiCamaras(){
  let h=`<div class="note">Aquí defines las cámaras con las que vas a medir. Una cámara es una
  <b>configuración con nombre</b>: el objetivo más el zoom. Eso importa porque el ×2 del objetivo principal
  no es otra cámara para el navegador, sino la misma con otro zoom, y sin embargo <b>ve distinto y necesita su
  propia calibración</b>. Cada cámara que definas aquí se calibra una vez y queda lista para usar en vivo.</div>`;

  /* --- cámaras ya definidas --- */
  if (S.camaras.length){
    h+=`<h3>Cámaras definidas</h3><table>
      <tr><th>Nombre</th><th>Tipo</th><th>Calibrada para</th><th></th></tr>
      ${S.camaras.map(c=>{
        const us=["vivo","foto","video"].filter(u=>perfilDe(c.id,u));
        return `<tr class="${S.camaraId===c.id?"sel":""}">
          <td><input type="text" class="cmNom" data-id="${c.id}" value="${(c.nombre||"").replace(/"/g,"&quot;")}"
              style="font:13px inherit"></td>
          <td style="font-size:11.5px">${esExterna(c)?"de otros":"este aparato"+(c.zoom?" ×"+fmt(c.zoom,1):"")}</td>
          <td style="font-size:11.5px;color:${us.length?"var(--ok)":"var(--bad)"}">${
            us.length? us.map(u=>USOS[u]).join(", ") : "nada"}</td>
          <td>${esExterna(c)?"":`<button class="mini cmUsa" data-id="${c.id}">abrir</button>`}
              <button class="mini cmDel" data-id="${c.id}">×</button></td></tr>`;}).join("")}
    </table>
    <div class="note">Escribe el nombre que quieras en cada fila: «Principal ×1», «Principal ×2», «Gran angular»…
    «Abrir» la enciende para comprobarla o para capturarla en Calibración.</div>`;
  } else h+=`<div class="verdict v-na">Todavía no has definido ninguna cámara.</div>`;

  /* --- externas --- */
  h+=`<h3>Cámaras de otros</h3>
  <div class="note">Para calibrar fotos o vídeos que te manden, hechos con una cámara que no es este aparato.
  Aquí solo le pones nombre: la calibración sale del archivo que te envíen.</div>
  <div class="btns"><button id="cmExt">Añadir cámara externa</button></div>`;

  /* --- añadir de este aparato --- */
  h+=`<h3>Añadir una cámara de este aparato</h3>`;
  if (!(S.src && S.src.kind==="live")){
    h+=`<div class="btns"><button class="p" id="cmAbrir">Encender la cámara</button></div>
    <div class="note">Se enciende, eliges objetivo y zoom mirando la imagen, y la guardas con un nombre.</div>`;
    if (S.liveErr) h+=`<div class="err">${S.liveErr}</div>`;
  } else {
    h+=`<div class="row"><label>Objetivo</label><select id="cmDev">
      ${S.cams.map((c,i)=>`<option value="${c.deviceId}"${c.deviceId===S.srcCamId?" selected":""}>${
        (c.label||("objetivo "+(i+1))).replace(/</g,"")}</option>`).join("")}
    </select></div>`;
    if (S.zoomCap)
      h+=`<div class="row"><label>Zoom</label>
        <input type="number" step="0.1" id="cmZoom" value="${fmt(S.zoomActual??S.zoomCap.min,1)}"
          min="${S.zoomCap.min}" max="${S.zoomCap.max}"><span class="u">×</span></div>
        <div class="note">Esta lente admite zoom de ×${fmt(S.zoomCap.min,1)} a ×${fmt(S.zoomCap.max,1)}.
        <b>Cuidado con este número: no es el mismo que el de la aplicación de cámara del teléfono.</b>
        Aquí el ×1 es el campo completo de <i>la lente que tengas seleccionada arriba</i>, así que el mismo valor
        significa cosas distintas en cada lente. Los ×0,6, ×1, ×2, ×3 y ×10 del teléfono son combinaciones de
        lente y recorte, y están referidos siempre a la principal.
        <br><br><b>No hace falta que adivines la equivalencia.</b> Elige el zoom que quieras, guarda la cámara,
        y calíbrala: el factor × que verás después sale de la focal medida y <b>sí está en la misma escala que el
        teléfono</b>. Entonces renombras la cámara con el nombre que corresponda.
        <br><br>Cada valor de zoom que vayas a usar para medir necesita su propia cámara aquí y su propia
        calibración. Y comprueba que la imagen sigue nítida: si el zoom recorta el sensor, ganas resolución
        angular de verdad y es útil para efectos lejanos; si solo interpola, emborrona justo los bordes sobre los
        que hay que colocar la cruz.</div>`;
    else
      h+=`<div class="note">Este móvil <b>no deja al navegador controlar el zoom</b>, así que cada cámara que
      definas aquí es uno de los objetivos físicos de la lista de arriba. No se puede crear un «×2» aparte: ese
      zoom existe en la aplicación de cámara del teléfono, no para una página web.
      <br><br>Tiene su lado bueno: al no haber zoom que tocar, una vez calibrado un objetivo <b>no hay forma de
      descalibrarlo sin querer</b>. El zoom de pellizco del visor solo amplía la imagen en pantalla para colocar
      la cruz y no cambia nada de lo que ve la cámara.
      <br><br>Define uno por cada entrada de la lista. Si no sabes cuál es cuál, dales un nombre provisional,
      calíbralos, y renómbralos después: <b>la calibración te dirá qué son</b>, porque el factor × sale de la
      focal medida: ×1 el principal, ×0,6 aproximadamente el gran angular.</div>`;
    h+=`<div class="row"><label>Nombre</label><input type="text" id="cmNombre"
      placeholder="p. ej. «Lente A zoom 1» · ponle el definitivo tras calibrar" value=""></div>
    <div class="btns"><button class="g" id="cmGuardar">Guardar esta cámara</button>
      <button id="cmCerrar">Cerrar</button></div>
    <div class="note">Fuente actual: <b>${S.src.w}×${S.src.h} px</b>${
      S.zoomActual?` · zoom ×${fmt(S.zoomActual,1)}`:""}.</div>`;
  }
  return h;
}

function uiCalib(){
  const o = S.calib.out, esPhi = S.calib.tipo==="phi";
  let h = `<div class="seg">
    <button class="${esPhi?"":"on"}" id="kFull">Calibrar el objetivo</button>
    <button class="${esPhi?"on":""}" id="kPhi">Ajustar el inclinómetro</button>
  </div>
  ${esPhi?`<div class="verdict v-na" style="text-align:left;font-weight:500">Este modo <b>no crea perfiles</b>.
    Para calibrar un objetivo nuevo, cambia a «Calibrar el objetivo».</div>`:""}
  <div class="note">${esPhi
    ? "Corrige el pequeño desfase entre el sensor de inclinación del móvil y hacia dónde mira realmente la lente. <b>Solo sirve si el objetivo ya está calibrado</b>, y no crea perfiles nuevos. Para fiarte del resultado, repítelo en dos o tres fotos tomadas con inclinaciones distintas y comprueba que sale casi lo mismo."
    : "<b>Esta es la calibración normal.</b> Mide cómo ve esta cámara, que es lo que hace falta para que las alturas salgan bien. Se hace una vez por cada objetivo y cada modo de captura.<br><br>Conviene repetirla sobre una segunda toma y comprobar que sale lo mismo: con todas las marcas en una sola vertical, un resultado puede parecer bueno sin serlo."}</div>
  <div class="note"><b>¿Qué vas a calibrar?</b> Cada uso necesita su propio perfil, porque el mismo aparato da
  otra focal en vivo, en foto y en vídeo.</div>
  <div class="btns">
    <button class="${S.calib.uso==="vivo"?"p":""}" id="bCamCal">Cámara en vivo</button>
    <button class="${S.calib.uso==="video"?"p":""}" id="bLoadVidCal">Un vídeo</button>
  </div>
  <div class="btns">
    <button class="${S.calib.uso==="foto"?"p":""}" id="bLoadImg">Foto · galería</button>
    <button class="${S.calib.uso==="foto"?"p":""}" id="bLoadDoc">Foto · archivo</button>
  </div>
  <div class="note">Para <b>en vivo</b>, captura con la cámara de este aparato. Para <b>foto</b> o <b>vídeo</b>,
  carga un archivo tomado con la cámara de la que luego te vayan a mandar material: ese perfil quedará listo para
  cuando llegue.</div>`;

  /* --- captura con la cámara --- */
  const vivo = S.src && S.src.kind==="live";
  if (vivo){
    h += S.camaras.length
      ? `<div class="row"><label>Cámara</label><select id="iCam">
          ${S.camaras.map(c=>`<option value="${c.id}"${c.id===S.camaraId?" selected":""}>${c.nombre}${
            perfilDeCamara(c.id)?"":"  ·  sin calibrar"}</option>`).join("")}</select></div>`
      : `<div class="verdict v-na" style="text-align:left;font-weight:500">No has definido ninguna cámara.
         Defínelas en la pestaña <b>Cámaras</b> y vuelve aquí a capturarlas.</div>`;
    h += `<div class="btns"><button class="p" id="bCapCal" ${S.camaras.length?"":"disabled"}>Capturar</button>
      <button id="bCerrarCam">Cerrar cámara</button></div>
    <div class="note">Capturando: <b>${nombreCamara(S.camaraId)}</b> · ${S.src.w}×${S.src.h} px.
    Captura con una cámara, cambia de cámara arriba y vuelve a capturar <b>sin tocar el trípode</b>: así los dos
    perfiles comparten distancia y altura de lente exactas y son directamente comparables. La calibración se hace
    después, sobre las capturas.</div>`;
    if (S.capErr) h += `<div class="err">${S.capErr}</div>`;
  }
  if (S.liveErr) h += `<div class="err">Cámara: ${S.liveErr}</div>`;

  /* --- capturas guardadas --- */
  if (S.capturas.length){
    h += `<h3>Capturas guardadas</h3><table>
      <tr><th>Imagen</th><th>Objetivo</th><th></th></tr>
      ${S.capturas.map(c=>{
        const cal=perfilDeCamara(c.camaraId);
        const act=S.calib.capId===c.id;
        return `<tr class="${act?"sel":""}">
        <td><a href="${urlDe(c)}" download="calib-${(c.camLabel||"obj").replace(/\s+/g,"")}-${c.w}x${c.h}.jpg">
            <img src="${urlDe(c)}" style="width:76px;border-radius:5px;display:block;border:1px solid var(--line)"></a></td>
        <td><b style="font-size:13.5px">${c.camLabel||"—"}</b>
            <div style="font-size:11px;color:${cal?"var(--ok)":"var(--dim)"}">${cal?"ya calibrado":"sin calibrar"}</div>
            <div style="font-size:10.5px;color:var(--dim)">${c.w}×${c.h} · ${new Date(c.ts).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div></td>
        <td><button class="mini capUsa" data-id="${c.id}">${act?"cargada":"calibrar"}</button>
            <button class="mini capDel" data-id="${c.id}">×</button></td></tr>`;}).join("")}
    </table>
    <div class="note">Se conservan aunque cierres la página, pero <b>solo en este navegador y en este aparato</b>:
    el almacén es local y no se sincroniza. Pulsa la miniatura para descargar la imagen y así poder abrirla en otro
    equipo con «Archivo». Pulsa «calibrar» para trabajar sobre ella aquí.</div>`;
  }

  if (!S.src || vivo) return h;
  if (S.src.kind==="vid")
    h += `<div class="btns">
      <button id="vcBack10">⏪ 10</button><button id="vcBack">◀</button>
      <button id="vcFwd">▶</button><button id="vcFwd10">10 ⏩</button></div>
    <div class="note">Avanza hasta el fotograma donde se vean bien las marcas y calibra sobre él.
    Fotograma <b id="vcTime">—</b> · ${S.src.w}×${S.src.h} px. El perfil valdrá para vídeos de esa misma cámara
    y esa misma resolución.</div>`;
  const rlc = rollUsado();
  if (rlc!==null && Math.abs(rlc)>ROLL_OK)
    h += `<div class="err">Inclinación lateral ρ = ${fmt(rlc,2)}° en la lectura actual.
    La foto de calibración debe tomarse con ρ ≈ 0: una inclinación lateral apreciable sesga y₀ y φ.</div>`;

  const E=estadoCalib();
  const paso=(ok,txt)=>`<div class="kv"><span style="text-align:left">${ok?"✓":"○"} ${txt}</span><b></b></div>`;
  h += `<h3>Estado de la calibración</h3>
  <div class="card">
    ${paso(true,"Calibrando para <b>"+USOS[S.calib.uso||"foto"]+"</b> · "+S.src.w+"×"+S.src.h+" px")}
    ${paso(E.geom,"Distancia y altura de lente introducidas")}
    ${paso(E.alt>=E.min,"Alturas de las marcas escritas ("+E.alt+" de "+E.nTot+")")}
    ${paso(E.fij>=E.min,"Marcas fijadas con la cruz ("+E.fij+" de "+E.nTot+", mínimo "+E.min+")")}
    ${paso(!!S.calib.camaraId,"Cámara indicada"+(S.calib.camaraId?": "+nombreCamara(S.calib.camaraId):""))}
    ${paso(E.ajuste,"Cálculo hecho")}
    ${paso(!!E.perfil,"Perfil guardado"+(E.perfil?": "+E.perfil.name:""))}
    <div class="verdict ${E.perfil?"v-ok":(E.ajuste?"v-na":"v-no")}" style="text-align:left;font-weight:500">
      ${E.perfil ? "Objetivo calibrado. Al seleccionarlo en vivo, este perfil se activa solo."
       : E.ajuste ? "Falta el último paso: pulsa <b>"+rotuloGuardar()+"</b>, abajo del resultado del ajuste."
       : !E.geom ? "Siguiente: escribe la distancia horizontal y la altura de la lente."
       : E.alt<E.min ? "Siguiente: escribe la altura real de cada marca en la tabla de puntos."
       : E.fij<E.min ? "Siguiente: lleva la cruz sobre cada marca y pulsa <b>fijar</b> en su fila."
       : "Siguiente: pulsa <b>Ajustar</b>."}
    </div>
  </div>

  ${bloqueObjetivo()}

  <h3>Geometría del ensayo</h3>
  <div class="row"><label>Distancia horiz.</label><input type="number" step="0.1" id="cD" value="${S.calib.d}"><span class="u">cm</span></div>
  <div class="row"><label>Altura de lente</label><input type="number" step="0.1" id="cHc" value="${S.calib.hCam}"><span class="u">cm</span></div>
  <div class="row"><label>Lectura sensor · frontal</label><input type="text" inputmode="decimal" id="cSen"
    value="${S.calib.sensor}" placeholder="${S.calib.origen==="archivo"?"recomendable":"obligatorio"}">
    <button class="mini sg" data-f="cSen">±</button><span class="u">°</span></div>
  <div class="row"><label>Lectura sensor · lateral</label><input type="text" inputmode="decimal" id="cSenR"
    value="${S.calib.sensorRoll}" placeholder="opcional">
    <button class="mini sg" data-f="cSenR">±</button><span class="u">°</span></div>
  <div class="note">La altura de la lente sobre el suelo es imprescindible: sin ella la inclinación y la altura de cámara son indistinguibles y el ajuste no significa nada.
  ${S.calib.origen==="archivo"
    ? `<br><br><b>Esta imagen viene de un archivo: la lectura frontal es recomendable, no obligatoria.</b>
       Si la tienes, se obtiene δ y el perfil queda completo. Una foto no guarda el ángulo del aparato, así que solo
       la tienes de verdad cuando la toma se hizo con el móvil fijo y pudiste leerla en ese momento: sobre trípode,
       o con el aparato apoyado. <b>Si no la tienes, déjala vacía</b>, y no pongas una lectura de antes o después de
       disparar: con la cámara en la mano, un grado es un movimiento que no se nota, y una lectura equivocada
       produce una δ falsa que estropea todas las medidas. Sin ella el perfil se guarda con δ = 0 y el ángulo de
       cada medida se escribe al medir, que para fotos es lo normal.`
    : `La inclinación lateral es opcional, pero si la anotas se obtiene también el cero lateral del inclinómetro.`}
  <br><br>El botón <b>±</b> cambia el signo, porque el teclado numérico del móvil no trae tecla de menos.</div>

  <h3>Puntos</h3>
  ${(()=>{ const E=escalas(S.calib.puntos);
    const esc=new Map(); let raro=false;
    if(E&&E.med) E.tramos.forEach(t=>{
      const d = t.s===null?null:Math.abs(t.s/E.med-1);
      if(d!==null && d>0.15) raro=true;
      esc.set(t.a, {s:t.s, d});
    });
    return `<table><tr><th>#</th><th>Altura (cm)</th><th>y (px)</th><th>x (px)</th><th>px/cm</th><th></th></tr>
    ${S.calib.puntos.map((p,i)=>{
      const e = (p.h!==null&&esc.has(+p.h)) ? esc.get(+p.h) : null;
      return `<tr>
        <td>${i+1}</td>
        <td><input type="number" step="0.1" class="cH" data-i="${i}" value="${p.h??""}"></td>
        <td>${p.y===null?"—":fmt(p.y,1)}</td>
        <td>${p.x===null||p.x===undefined?"—":fmt(p.x,0)}</td>
        <td${e&&e.d>0.15?' style="color:var(--bad);font-weight:700"':""}>${e&&e.s!==null?fmt(e.s,3):"—"}</td>
        <td><button class="mini cFix" data-i="${i}">fijar</button></td>
      </tr>`;}).join("")}</table>
    ${raro?`<div class="verdict v-no" style="text-align:left;font-weight:500">
      <b>La escala no es uniforme entre marcas.</b> En la pared, la separación en píxeles por centímetro cambia
      despacio y siempre en el mismo sentido al subir. Una marca cuya escala se sale del resto más de un 15 %
      señala que esa altura está mal escrita o que la cruz está en otra marca. Está marcado en rojo arriba, y
      conviene arreglarlo antes de ajustar: esto no depende del ajuste, así que es más fiable que su error.</div>`
    :(E&&E.med?`<div class="note">Escala entre marcas consecutivas, en píxeles por centímetro. Cambia despacio al
      subir; si una se sale del resto, esa altura está mal escrita o la cruz está en otra marca.</div>`:"")}`;
  })()}
  <div class="note">La columna <b>x</b> se guarda para medir la inclinación lateral: todas las marcas están en una misma vertical de la pared, así que su desviación lateral en la imagen delata el giro de la cámara.</div>
  <div class="btns"><button id="cAdd">+ punto</button><button id="cDel">− punto</button>
    <button class="p" id="cRun">Ajustar</button></div>`;

  /* Los datos de cada calibración viven en Ajustes, pero nadie los busca ahí:
     se buscan donde se calibró. Esta lista es el atajo. */
  if (S.perfiles.length) h += `<h3>Perfiles guardados</h3>
    <table><tr><th>Perfil</th><th>Calibrado</th><th>Error</th><th></th></tr>
    ${S.perfiles.map(q=>`<tr>
      <td>${q.name}<br><span style="color:var(--dim)">[${USOS[q.uso||"foto"]}]${q.w?" · "+q.w+"×"+q.h:""}</span></td>
      <td>${q.datos?new Date(q.datos.fecha).toLocaleDateString("es-ES"):"—"}</td>
      <td>${q.datos?fmt(q.datos.rms,2)+" px":"—"}</td>
      <td><button class="mini aVer" data-id="${q.id}">${q.datos?"ver datos":"abrir"}</button></td>
    </tr>`).join("")}</table>
    <div class="note">«Ver datos» abre el expediente de esa calibración: distancia, altura de lente, lecturas del
    inclinómetro, la fila y la columna de cada marca con su desajuste, y los botones de reabrir e informe.</div>`;

  h += navHTML();

  if (o){
    if (o.err) h += `<div class="err">${o.err}</div>`;
    else {
      const malo = o.rms > 0.004*S.src.h;
      h += `<h3>Resultado del ajuste</h3><div class="res">
      ${o.tipo==="full" ? `
      <div class="kv"><span>focal f</span><b>${fmt(o.f,1)} px</b></div>
      <div class="kv"><span>focal relativa al fotograma</span><b>${fmt(o.fRel,5)}</b></div>
      <div class="kv"><span>centro óptico y₀</span><b>${fmt(o.y0,1)} px (${fmt(o.y0Rel,5)})</b></div>`
      : `<div class="kv"><span>óptica tomada del perfil</span><b>${fmt(o.fRel,5)} / ${fmt(o.y0Rel,5)}</b></div>`}
      <div class="kv"><span>inclinación frontal real de la toma</span><b>${(o.phi>=0?"+":"")+fmt(o.phi,3)}°</b></div>
      <div class="kv"><span>lo que marcaba el sensor</span><b>${vacio(S.calib.sensor)?"sin anotar":((+S.calib.sensor>=0?"+":"")+fmt(+S.calib.sensor,2)+"°")}</b></div>
      <div class="big" style="margin-top:6px"><s>Desfase del sensor (δ)</s><b>${o.delta===null?"no determinado":((o.delta>=0?"+":"")+fmt(o.delta,3)+"°")}</b></div>
      <div class="kv"><span>error de ajuste</span><b>${fmt(o.rms,2)} px (${o.n} puntos)</b></div>
      <div class="kv"><span>en alturas, a esta distancia</span><b>± ${fmt(o.rms*(+S.calib.d)/o.f,2)} cm</b></div>
      <div class="verdict ${malo?"v-na":"v-ok"}">${malo
        ?"Ajuste pobre: revisa las alturas escritas, la distancia y que las marcas se vean nítidas"
        :"Ajuste correcto"}</div></div>
      ${o.sosp?`<div class="verdict v-na" style="text-align:left;font-weight:500">
        <b>${o.sosp.idx.length>1
          ? "Las marcas "+o.sosp.idx.map(i=>i+1).join(" y ")+" desentonan."
          : "La marca "+(o.sosp.i+1)+" desentona."}</b> Dejándo${o.sosp.idx.length>1?"las":"la"} fuera, el error de
        ajuste baja de ${fmt(o.sosp.base,2)} px a ${fmt(o.sosp.rms,2)} px. ${o.sosp.idx.length>1
          ? "Ninguna sola lo explica, y eso tiene una causa típica: al teclear las alturas de una fila de marcas es fácil saltarse una y correr las siguientes."
          : "Ninguna otra marca mejora tanto el ajuste, así que el problema no está repartido: está en esa."}
        ${(()=>{ const fuera=o.sosp.puntos;
          const F = o.tipo==="full" ? fitFull(o.pts.filter(z=>!fuera.includes(z)), +S.calib.d, +S.calib.hCam) : null;
          if(!F) return "";
          return fuera.map((q,k)=>{
            const rr = Math.tan(Math.atan((F.y0-q.y)/F.f)+F.phi*Math.PI/180);
            const hR = (+S.calib.hCam)+rr*(+S.calib.d);
            return `<br>Marca ${o.sosp.idx[k]+1}: la fila que marcaste corresponde a <b>${fmt(hR,1)} cm</b> y no a
                    los ${fmt(+q.h,1)} cm escritos.`;
          }).join("")+"<br>O la cruz quedó en otra marca, o esa altura está mal escrita.";
        })()}
        </div>
      <div class="btns"><button id="cQuita" data-i="${o.sosp.idx.map(i=>S.calib.puntos.indexOf(o.pts[i])).join(",")}">Quitar
        ${o.sosp.idx.length>1?"esas marcas":"la marca "+(o.sosp.i+1)} y reajustar</button></div>`:""}
      ${(o.delta===null && S.calib.origen==="archivo")?`<div class="verdict v-na" style="text-align:left;font-weight:500">
        <b>Sin δ.</b> No hay lectura del inclinómetro, así que el perfil se guardará con δ = 0: válido para medir
        sobre imágenes escribiendo el ángulo de cada toma, pero no para medir en vivo con esta cámara.
        Si conocías el ángulo de esta toma, escríbelo arriba y vuelve a ajustar; si no, sigue adelante.</div>`
       : o.delta===null?`<div class="verdict v-na" style="text-align:left;font-weight:500">
        <b>Falta la lectura del inclinómetro de esta toma.</b> Sin ella no hay δ: la inclinación resuelta por el
        ajuste no tiene con qué compararse. Escríbela arriba y vuelve a pulsar Ajustar.</div>`
       : Math.abs(o.delta)>DELTA_MAX?`<div class="verdict v-no" style="text-align:left;font-weight:500">
        <b>δ = ${(o.delta>=0?"+":"")+fmt(o.delta,2)}° no es una desalineación creíble.</b>
        El desfase entre el acelerómetro y el sensor de imagen es de décimas de grado; esto es ${fmt(Math.abs(o.delta),0)}°.
        Las dos causas habituales: que la lectura del inclinómetro escrita arriba no sea la de esta toma
        (el ajuste ha resuelto ${(o.phi>=0?"+":"")+fmt(o.phi,2)}° de inclinación real, así que comprueba si el móvil estaba
        así de inclinado al disparar la foto), o que hayas usado «solo desalineación» sobre un perfil cuya óptica no
        corresponde a este fotograma, caso en el que el ajuste mete la diferencia de focal dentro del ángulo.
        Aplicarlo dejaría la aplicación midiendo con ${fmt(Math.abs(o.delta),0)}° de error de inclinación frontal.</div>`:""}
      ${o.roll ? `<h3>Inclinación lateral medida sobre las marcas</h3><div class="res">
      <div class="kv"><span>inclinación observada de la línea de marcas</span><b>${(o.roll.total>=0?"+":"")+fmt(o.roll.total,3)}°</b></div>
      <div class="kv"><span>parte explicada por la perspectiva</span><b>${(o.roll.total-o.roll.rho>=0?"+":"")+fmt(o.roll.total-o.roll.rho,3)}°</b></div>
      <div class="big" style="margin-top:6px"><s>Inclinación lateral real de la imagen (ρ)</s><b>${(o.roll.rho>=0?"+":"")+fmt(o.roll.rho,3)}°${o.roll.u!==null?" ± "+fmt(o.roll.u,3)+"°":""}</b></div>
      <div class="kv"><span>deriva lateral de las marcas</span><b>${fmt(o.roll.deriva,0)} px de ${S.src.w}</b></div>
      <div class="kv"><span>lo que marcaba el sensor</span><b>${vacio(S.calib.sensorRoll)?"sin anotar":((+S.calib.sensorRoll>=0?"+":"")+fmt(+S.calib.sensorRoll,2)+"°")}</b></div>
      ${vacio(S.calib.sensorRoll)?"":`<div class="big"><s>Desfase lateral del sensor (δρ)</s><b>${(o.deltaRoll>=0?"+":"")+fmt(o.deltaRoll,3)}°</b></div>`}
      <div class="kv"><span>curvatura residual</span><b>${fmt(o.roll.rms,1)} px</b></div>
      <div class="verdict ${o.roll.rms>0.004*S.src.w?"v-na":"v-ok"}">${o.roll.rms>0.004*S.src.w
        ?"Las marcas no caen en una recta: eso ya no es inclinación lateral, es distorsión del objetivo o alguna cruz mal puesta"
        :"Las marcas caen en una recta, como debe ser"}</div></div>
      <div class="note"><b>Para qué sirve esto.</b> Que la vertical dibujada no cruce todas las marcas tiene dos causas sumadas, y aquí se separan.
      Una es la perspectiva: una vertical del mundo que no pase por el centro óptico se proyecta inclinada, converge igual que las fachadas vistas desde abajo, y no es un defecto del equipo.
      La otra es la inclinación lateral real, que incluye el desfase entre el cero del inclinómetro y las filas del sensor de imagen, igual que δ en la inclinación frontal.
      La <b>curvatura residual</b> es lo que queda sin explicar por ninguna de las dos: si es grande, hay distorsión de objetivo o un error al marcar.
      Ninguno de los dos efectos altera la altura medida de una marca, porque con inclinación frontal pura la fila de un punto depende solo de su altura y su distancia, no de su posición lateral.
      Sí la alteran cuando origen y punto están muy separados en horizontal, y por eso la inclinación lateral se corrige y la separación lateral sigue presupuestándose.</div>
      ${vacio(S.calib.sensorRoll)?`<div class="note">Anota arriba la inclinación lateral que marcaba el inclinómetro en la toma y se obtendrá δρ, aplicable al perfil.</div>`:""}` : ""}
      <div class="note">Desajuste de cada marca, en píxeles: ${o.res.map(v=>fmt(v,1)).join(" / ")}.
      Si crece hacia las marcas de arriba y de abajo, suele ser distorsión del objetivo o una focal mal resuelta.
      Si todas fallan por igual, suele ser un error en la altura de la lente.
      ${o.delta===null?"":"δ equivale a un sesgo de "+fmt(100*Math.abs(o.delta)*Math.PI/180,2)+" % de la distancia de observación si no se corrige."}</div>
      <div class="btns">
        ${o.tipo==="full"?'<button class="g" id="cSave">'+rotuloGuardar()+'</button>'
          :(o.delta===null?'<button disabled>Aplicar δ: falta la lectura del inclinómetro</button>'
                          :'<button class="'+(Math.abs(o.delta)>DELTA_MAX?"":"g")+'" id="cSaveD">Aplicar δ al perfil activo</button>')}
        ${(o.tipo!=="full" && o.deltaRoll!==null && o.deltaRoll!==undefined)
          ?'<button id="cSaveDR">Aplicar δρ al perfil activo</button>':""}
      </div>`;
    }
  }
  return h;
}

/* El rótulo del botón cuenta lo que de verdad se está haciendo.

   Calibrando desde la cámara en vivo, la cámara ya existe como configuración
   con nombre: lo que se guarda es SU calibración, y si ya tenía una, lo
   natural es sustituirla. Llamarlo «perfil nuevo» sugería crear algo suelto y
   acababa dejando dos calibraciones de la misma cámara, de las que el modelo
   usa la primera que encuentra.

   Desde un vídeo o una foto no hay cámara que calibrar: la imagen viene de
   fuera y lo que se crea sí es un perfil nuevo. */
function rotuloGuardar(){
  if ((S.calib.uso||"foto")!=="vivo") return "Guardar perfil nuevo";
  return perfilDe(S.calib.camaraId,"vivo") ? "Guardar la calibración (sustituye la anterior)"
                                           : "Guardar la calibración";
}
/* INFORME DE ENSAYO.

   Registro de una verificación concreta. Lleva la trazabilidad completa hasta
   la calibración del objetivo, porque una altura sin saber con qué óptica se
   midió no se sostiene ante nadie. El veredicto se da frente al intervalo
   admisible y se dice con qué regla de decisión, sin dar por buena ninguna:
   si se resta la incertidumbre o no es cosa del criterio acordado, no del
   instrumento, y presentarlo como un simple «cumple» sería impreciso.      */
/* Importación con confirmación explícita. NUNCA borra: ante un choque de
   identificador la opción por omisión es conservar lo de aquí y traer lo de
   fuera aparte, porque una importación equivocada no debe destruir una
   calibración que costó una tarde de pared. */
function importaAqui(){
  const b=leeBundle($("#aJson").value);
  if(b.err){ alert(b.err); return; }
  const linea=[];
  if(b.perfiles.length) linea.push(b.perfiles.length+" perfiles");
  if(b.camaras.length)  linea.push(b.camaras.length+" cámaras");
  if(b.ensayos.length)  linea.push(b.ensayos.length+" configuraciones de ensayo");
  const choque = b.perfiles.some(q=>S.perfiles.some(p=>p.id===q.id))
              || b.camaras.some(q=>S.camaras.some(c=>c.id===q.id))
              || b.ensayos.some(q=>ensayosLee().some(e=>e.id===q.id));
  let modo="conservar";
  if(choque){
    modo = confirm("El archivo trae "+linea.join(", ")+".\n\nAlgunos coinciden con los que ya tienes.\n\n"
      +"Aceptar: SUSTITUIR los que coincidan por los del archivo.\n"
      +"Cancelar: conservar los tuyos y añadir los del archivo aparte.") ? "sustituir" : "conservar";
  } else if(!confirm("¿Importar "+linea.join(", ")+"?")) return;
  const r=aplicaBundle(S,b,{modo});
  guarda(); if(typeof guardaCam==="function") guardaCam(); pinta();
  alert(resumenImport(r)+(b.sinDatos?"\n\n"+b.sinDatos+" perfiles llegan sin expediente de calibración: "
    +"se pueden usar, pero no auditar.":""));
}

/* Fijar la marca activa sobre la cruz. Lo usan el botón del panel y el de
   la superposición de pantalla completa, que no pueden divergir. */
function fijaAqui(){
  if (!dentro()) return;
  const c = centroImg();
  if (S.sel===-1){
    S.marks.origen = {x:c.x, y:c.y};
    const sig = S.marks.puntos.findIndex(q=>q.y===null);
    S.sel = sig>=0 ? sig : 0;
  } else { S.marks.puntos[S.sel].y = c.y; S.marks.puntos[S.sel].x = c.x; }
  pinta();
}

/* Superposición de pantalla completa. Se repinta con cada pinta(), y
   fuera de pantalla completa no se ve porque el CSS la oculta. */
function pintaFS(){
  const bar=$("#fsbar"), num=$("#fsnum");
  if(!bar||!num) return;
  if(!S.src){ bar.innerHTML=""; num.innerHTML=""; return; }
  const R=medidas();
  bar.innerHTML =
    `<button class="${S.sel===-1?"p":""}" data-fs="o">Origen</button>`
    + S.marks.puntos.map((q,i)=>`<button class="${S.sel===i?"p":""}" data-fs="p${i}">${i+1}</button>`).join("")
    + `<button class="g" data-fs="fijar"${dentro()?"":" disabled"}>Fijar</button>`
    + `<button class="x" data-fs="salir">✕</button>`;
  const hechos = R ? R.filter(x=>x.y!==null) : [];
  num.innerHTML = hechos.length
    ? hechos.map((x,i)=>`${x.lab||("marca "+(i+1))}: <b>${fmtH(x.H)}</b> ± ${fmtH(x.U)} m`).join("<br>")
    : (S.marks.origen ? "pon la cruz y pulsa Fijar" : "fija primero el origen");
  bar.querySelectorAll("[data-fs]").forEach(el=>el.addEventListener("click",ev=>{
    const k=ev.currentTarget.dataset.fs;
    if(k==="salir") return fsSale();
    if(k==="o"){ S.sel=-1; pinta(); return; }
    if(k[0]==="p"){ S.sel=+k.slice(1); pinta(); return; }
    if(k==="fijar"){ fijaAqui(); }
  }));
}
function informeEnsayo(){
  const R=medidas(), p=perfil(), M=S.med;
  if(!R||!p) return "No hay medidas que informar.";
  const hechos=R.filter(x=>x.y!==null);
  if(!hechos.length) return "No hay ninguna marca fijada.";
  const d=+M.d, L=[];
  const fila=(k,v)=>L.push("| "+k+" | "+v+" |");
  const cab=(...c)=>{ L.push("| "+c.join(" | ")+" |"); L.push("|"+c.map(()=>"---").join("|")+"|"); };
  const ang=(lec,apl)=>(lec===null?"—":fmt(lec,2)+"°")+" (eje óptico "+(apl===null?"—":fmt(apl,2)+"°")+")";

  L.push("# Informe de verificación de altura","",
    "Registro interno de medida. No sustituye a un organismo notificado ni a un laboratorio de ensayo acreditado.","",
    "## 1. Identificación","");
  cab("Campo","Valor");
  fila("Fecha y hora", new Date().toLocaleString("es-ES"));
  if(M.nEns) fila("Nº de ensayo", M.nEns);
  if(M.ref) fila("Artículo o referencia", M.ref);
  if(M.lote) fila("Lote", M.lote);
  if(M.cat) fila("Categoría", M.cat);
  if(M.ensayoNom) fila("Configuración de ensayo", M.ensayoNom);
  if(M.lugar) fila("Lugar", M.lugar);
  if(M.operador) fila("Operador", M.operador);
  fila("Origen de la imagen", S.src ? ({live:"cámara en vivo", img:"imagen fija", video:"vídeo"}[S.src.kind]||S.src.kind) : "—");

  L.push("","## 2. Equipo y trazabilidad","");
  cab("Campo","Valor");
  fila("Perfil óptico", p.name);
  fila("Uso del perfil", USOS[p.uso||"foto"]);
  fila("Cámara asociada", p.camaraId?nombreCamara(p.camaraId):"ninguna");
  fila("Fotograma del ensayo", S.src?(S.src.w+"×"+S.src.h+" px"):"—");
  fila("Fotograma de la calibración", p.w?(p.w+"×"+p.h+" px"):"sin registrar");
  fila("Focal relativa a la altura del fotograma", fmt(p.fRel,5));
  fila("Centro óptico relativo", fmt(p.y0Rel,5));
  fila("Desalineación δ · frontal", fmt(p.delta,3)+"°");
  fila("Desalineación δρ · lateral", fmt(+p.deltaRoll||0,3)+"°");
  fila("Error asignado a la focal", fmt(p.uF,2)+" %");
  if(p.datos){
    fila("Fecha de la calibración", new Date(p.datos.fecha).toLocaleDateString("es-ES"));
    fila("Marcas de la calibración", p.datos.puntos.length);
    fila("Error de ajuste de la calibración", fmt(p.datos.rms,2)+" px");
    fila("Distancia y altura de lente en calibración", fmt(p.datos.d,1)+" cm / "+fmt(p.datos.hCam,1)+" cm");
  } else fila("Calibración", "el perfil no conserva sus datos de calibración");

  L.push("","## 3. Condiciones de la observación","");
  cab("Campo","Valor");
  fila("Distancia de observación", fmt(d,3)+" m");
  fila("Incertidumbre asignada a la distancia", fmt(+M.ud,2)+" %");
  fila("Inclinación frontal", ang(tiltLeido(), tiltUsado()));
  fila("Inclinación lateral", ang(rollLeido(), rollUsado()));
  fila("Incertidumbre de la inclinación", "± "+fmt(+M.uphi,2)+"°");
  fila("Error de marcado asignado", "± "+fmt(+M.upx,1)+" px");
  fila("Altura del origen sobre el plano de referencia", fmt(+M.hRef||0,3)+" m");
  fila("Origen", "punto de disparo, fijado sobre la imagen");

  L.push("","## 4. Resultados","");
  const hayReal = hechos.some(x=>x.hReal!==null&&x.hReal!==undefined&&isFinite(+x.hReal));
  if(hayReal) cab("Marca","Altura medida (m)","% de la distancia","U k=2 (m)","U relativa","Altura real (m)","Error (m)");
  else cab("Marca","Altura medida (m)","% de la distancia","U k=2 (m)","U relativa");
  hechos.forEach((x,i)=>{
    const base=["| "+(x.lab||("marca "+(i+1))), fmtH(x.H), fmt(100*x.dH/d,2)+" %",
                fmtH(x.U), x.relU===null?"—":fmt(x.relU,2)+" %"];
    if(hayReal){ const hr=(x.hReal!==null&&x.hReal!==undefined&&isFinite(+x.hReal))?+x.hReal:null;
      base.push(hr===null?"—":fmtH(hr), hr===null?"—":fmtH(x.dH-hr)); }
    L.push(base.join(" | ")+" |");
  });
  if(hechos.length>1){
    L.push("","Separación entre marcas consecutivas, en metros: "
      + hechos.slice(1).map((x,k)=>fmtH(x.dH-hechos[k].dH)).join(" / ")+".");
  }

  const may=hechos.reduce((a,b)=>Math.abs(b.dH)>Math.abs(a.dH)?b:a);
  L.push("","## 5. Presupuesto de incertidumbre","",
    "Contribuciones a la marca de mayor altura ("+(may.lab||"sin etiqueta")+", "+fmtH(may.dH)+" m), en metros.","");
  cab("Contribución","Valor (m)");
  fila("Distancia de observación", fmtH(may.comp.cDist));
  fila("Focal del perfil", fmtH(may.comp.cF));
  fila("Inclinación frontal", fmtH(may.comp.cPhi));
  fila("Marcado del origen", fmtH(may.comp.cPo));
  fila("Marcado del punto", fmtH(may.comp.cPt));
  fila("Separación lateral con inclinación lateral", fmtH(may.comp.cRoll));
  fila("Incertidumbre típica combinada", fmtH(may.uc));
  fila("Incertidumbre expandida U (k = 2)", fmtH(may.U));
  L.push("","Las contribuciones se combinan en cuadratura. El factor k = 2 corresponde a una probabilidad de",
    "cobertura próxima al 95 % suponiendo distribución normal.");

  const cmp=hechos.filter(x=>x.hReal!==null&&x.hReal!==undefined&&isFinite(+x.hReal));
  if(cmp.length>=2){
    const nn=cmp.length, sx=cmp.reduce((t,x)=>t+(+x.hReal),0), sy=cmp.reduce((t,x)=>t+x.dH,0);
    const sxx=cmp.reduce((t,x)=>t+(+x.hReal)*(+x.hReal),0), sxy=cmp.reduce((t,x)=>t+(+x.hReal)*x.dH,0);
    const det=nn*sxx-sx*sx, aE=det?(nn*sxy-sx*sy)/det:1, bE=det?(sy-aE*sx)/nn:0;
    const rr=Math.sqrt(cmp.reduce((t,x)=>t+Math.pow(x.dH-(aE*(+x.hReal)+bE),2),0)/nn);
    L.push("","## 6. Comprobación con alturas conocidas","",
      "Ajuste de medida = a · real + b sobre "+nn+" marcas de altura conocida.","");
    cab("Parámetro","Valor");
    fila("a, escala", fmt(aE,4));
    fila("b, desfase de origen", fmt(bE*100,1)+" cm");
    fila("Dispersión alrededor de la recta", fmt(rr*100,1)+" cm");
    L.push("","Una escala distinta de 1 indica error en la distancia de observación o en la focal del perfil, que son",
      "las dos únicas causas de un factor constante. Un desfase indica error de origen, que no escala con la altura.");
  }

  L.push("","## "+(cmp.length>=2?"7":"6")+". Criterio y resultado","");
  const hn=+M.hNom, tol=+M.tol;
  if(hn && isFinite(hn) && hn>0){
    const lo=hn*(1-tol/100), hi=hn*(1+tol/100);
    const v=may.H, dentro=v>=lo&&v<=hi;
    const seguro=(v-may.U)>=lo && (v+may.U)<=hi;
    const fuera=(v+may.U)<lo || (v-may.U)>hi;
    cab("Campo","Valor");
    fila("Altura declarada", fmtH(hn)+" m");
    fila("Tolerancia aplicada", "± "+fmt(tol,0)+" %");
    fila("Intervalo admisible", fmtH(lo)+" m a "+fmtH(hi)+" m");
    fila("Altura medida", fmtH(v)+" m");
    fila("Incertidumbre expandida", "± "+fmtH(may.U)+" m (k = 2)");
    fila("Valor medido respecto al intervalo", dentro?"dentro":"fuera");
    L.push("");
    L.push(seguro
      ? "El intervalo medido ± U queda **íntegramente dentro** del intervalo admisible: conforme con cualquier regla de decisión."
      : fuera
      ? "El intervalo medido ± U queda **íntegramente fuera** del intervalo admisible: no conforme con cualquier regla de decisión."
      : "El valor medido queda "+(dentro?"dentro":"fuera")+" del intervalo admisible, pero el intervalo medido ± U **cruza el límite**. "
        +"El resultado depende entonces de la regla de decisión acordada: con aceptación simple (comparar solo el valor medido) "
        +"el resultado sería "+(dentro?"conforme":"no conforme")+"; con banda de guarda de una incertidumbre expandida, no puede "
        +"declararse la conformidad. La regla de decisión la fija el criterio acordado, no el instrumento.");
  } else {
    L.push("No se ha declarado altura nominal, así que no se emite juicio de conformidad: el informe recoge solo el",
      "resultado de la medida con su incertidumbre.");
  }

  if(M.obs) L.push("","### Observaciones","",M.obs);

  L.push("","## "+(cmp.length>=2?"8":"7")+". Limitaciones y salvedades","",
    "1. La altura se obtiene como fracción de la distancia de observación: todo error en esa distancia se traslada",
    "   proporcionalmente al resultado. La distancia debe medirse, no estimarse.",
    "2. El método supone que el punto de disparo y el punto medido están a la misma distancia horizontal de la cámara.",
    "   Un desplazamiento del efecto en profundidad no se detecta y no está incluido en el presupuesto.",
    "3. El presupuesto no cubre errores groseros: origen mal fijado, perfil que no corresponde al objetivo realmente",
    "   usado, o un efecto cuyo punto de altura máxima no se aprecie con nitidez en la imagen.",
    "4. La incertidumbre declarada supone que la calibración del objetivo sigue siendo válida. Un cambio de objetivo,",
    "   de recorte o de zoom respecto a las condiciones de calibración introduce un error de escala no cubierto aquí.",
    "5. Instrumento de verificación interna. No sustituye el dictamen de un organismo notificado ni el ensayo en",
    "   laboratorio acreditado.","");
  return L.join("\n");
}
function informeCalib(p){
  if(!p||!p.datos) return "Este perfil no guarda datos de calibración.";
  const D=p.datos, L=[];
  L.push("# Informe de calibración de cámara","",
    "| | |","|---|---|",
    "| Perfil | "+p.name+" |",
    "| Uso | "+USOS[p.uso||"foto"]+" |",
    "| Cámara | "+(p.camaraId?nombreCamara(p.camaraId):"sin asociar")+" |",
    "| Fecha de la calibración | "+new Date(D.fecha).toISOString().slice(0,19).replace("T"," ")+" |",
    "| Fotograma | "+p.w+"×"+p.h+" px |","",
    "## Condiciones del ensayo","",
    "| | |","|---|---|",
    "| Distancia al plano de las marcas | "+fmt(D.d,1)+" cm |",
    "| Altura de la lente sobre el suelo | "+fmt(D.hCam,1)+" cm |",
    "| Lectura del inclinómetro en la toma · frontal | "+fmt(D.sensor,2)+"° |",
    "| Lectura del inclinómetro en la toma · lateral | "+(D.sensorRoll===null||D.sensorRoll===undefined?"no anotada":fmt(D.sensorRoll,2)+"°")+" |",
    "| Tipo de ajuste | "+(D.tipo==="phi"?"solo inclinación":"óptica completa")+" |","",
    "## Datos y desajustes","",
    "| Marca | Altura (cm) | Fila y (px) | Columna x (px) | Desajuste (px) |","|---|---|---|---|---|");
  D.puntos.forEach((q,i)=>L.push("| "+(i+1)+" | "+fmt(q.h,1)+" | "+fmt(q.y,1)+" | "
    +(q.x===null||q.x===undefined?"—":fmt(q.x,0))+" | "+fmt(D.res[i],1)+" |"));
  L.push("","## Resultado","",
    "| | |","|---|---|",
    "| Distancia focal (f) | "+fmt(D.f,1)+" px |",
    "| Focal relativa al fotograma | "+fmt(p.fRel,5)+" |",
    "| Centro óptico (y₀) | "+fmt(D.y0,1)+" px ("+fmt(p.y0Rel,5)+") |",
    "| Inclinación frontal resuelta de la toma | "+fmt(D.phi,3)+"° |",
    "| Desfase del sensor (δ) | "+fmt(p.delta,3)+"° |",
    "| Desfase lateral del sensor (δρ) | "+((+p.deltaRoll||+p.deltaRoll===0)?fmt(+p.deltaRoll||0,3)+"°":"no determinado")+" |",
    "| Error de ajuste (rms) | "+fmt(D.rms,2)+" px |",
    "| Inclinación lateral medida sobre las marcas (ρ) | "+(D.rho===null||D.rho===undefined?"no determinado":fmt(D.rho,3)+"°")+" |",
    "| Curvatura residual de la línea de marcas | "+(D.rhoRms===null||D.rhoRms===undefined?"—":fmt(D.rhoRms,1)+" px")+" |",
    "| Factor de zoom deducido | "+(zoomDe(p)===null?"—":"×"+fmt(zoomDe(p),2))+" |","",
    "## Modelo","",
    "r = tan( arctan( (y₀ − y) / f ) + φ );   altura = (r_punto − r_origen) · d","",
    "siendo y la fila de la imagen, f la distancia focal en píxeles, y₀ el centro óptico,",
    "φ la inclinación de la toma y d la distancia de observación.","",
    "## Alcance y limitaciones","",
    "1. Calibración interna. **No es un certificado trazable a un patrón nacional.**",
    "2. El perfil vale para **esta cámara en este uso y con este tamaño de fotograma**. Aplicarlo a otro modo de",
    "   captura introduce un error de escala constante que no se manifiesta como anomalía.",
    "3. Las alturas de las marcas se toman como verdad absoluta: su error se traslada íntegro al resultado.",
    "4. Con todas las marcas en una sola vertical y a una sola distancia, focal, centro óptico e inclinación están",
    "   correlacionados. Un error de ajuste bajo no garantiza por sí solo que cada valor sea correcto; la",
    "   comprobación es repetir sobre otra toma.",
    "5. La inclinación lateral ρ se obtiene suponiendo que la columna del centro óptico es el centro del fotograma, porque con",
    "   todas las marcas en una vertical la calibración no la determina. Un punto principal desplazado el 1 % del",
    "   ancho sesga ρ en torno a 0,09°.","");
  return L.join("\n");
}

function uiAjustes(){

    <div class="btns"><button id="aBase">Restaurar el perfil base de fábrica</button></div>
    <div class="btns"><button id="aImp">Importar perfiles</button></div>

    <div class="kv"><span>centro óptico relativo</span><b>${fmt(p.y0Rel,5)}</b></div>
    <div class="kv"><span>desalineación δ · frontal</span><b${deltaRaro(p)?' style="color:var(--bad)"':''}>${(p.delta>=0?"+":"")+fmt(p.delta,3)}°${deltaRaro(p)?" ⚠":""}</b></div>
    <div class="kv"><span>desalineación δρ · lateral</span><b>${((+p.deltaRoll||0)>=0?"+":"")+fmt(+p.deltaRoll||0,3)}°</b></div>
    <div class="kv"><span>factor de zoom del objetivo</span><b>${zoomDe(p)===null?"—":"×"+fmt(zoomDe(p),2)}</b></div>
    <div class="kv"><span>uso</span><b>${USOS[p.uso||"foto"]}</b></div>
    <div class="kv"><span>cámara asociada</span><b>${p.camaraId?nombreCamara(p.camaraId):"ninguna"}</b></div>
    <div class="kv"><span>calibrado sobre</span><b>${p.w&&p.h?p.w+"×"+p.h+" px (relación "+fmt(p.w/p.h,3)+")":"sin registrar"}</b></div>
    <div class="kv"><span>error de la focal</span><b>${fmt(p.uF,2)} %</b></div>
  </div>
  <div class="note">${p.note||""}</div>
  ${deltaRaro(p)?`<div class="verdict v-no" style="text-align:left;font-weight:500">
    <b>δ = ${(p.delta>=0?"+":"")+fmt(p.delta,2)}° es imposible como desalineación mecánica.</b> El acelerómetro y el
    sensor de imagen difieren en décimas de grado. Con este valor, el móvil a plomo marca ${fmt(p.delta,0)}° de
    inclinación frontal y todo lo que dependa de la inclinación frontal sale mal: la altura, las oblicuas y la vertical de referencia.
    Ponlo a cero para poder medir mientras recalibras, y al recalibrar anota la lectura del inclinómetro de la toma,
    que ahora es obligatoria.</div>
  <div class="btns"><button class="g" id="aDelta0">Poner δ a cero en este perfil</button></div>`:""}
  ${p.datos?`
  <h3>Datos de la calibración</h3>
  <div class="card">
    <div class="kv"><span>fecha</span><b>${new Date(p.datos.fecha).toLocaleString("es-ES")}</b></div>
    <div class="kv"><span>distancia a las marcas</span><b>${fmt(p.datos.d,1)} cm</b></div>
    <div class="kv"><span>altura de la lente</span><b>${fmt(p.datos.hCam,1)} cm</b></div>
    <div class="kv"><span>lectura del sensor · frontal</span><b>${fmt(p.datos.sensor,2)}°</b></div>
    <div class="kv"><span>lectura del sensor · lateral</span><b>${p.datos.sensorRoll===null||p.datos.sensorRoll===undefined?"no anotada":fmt(p.datos.sensorRoll,2)+"°"}</b></div>
    <div class="kv"><span>inclinación frontal resuelta</span><b>${fmt(p.datos.phi,3)}°</b></div>
    <div class="kv"><span>inclinación lateral medida en las marcas</span><b>${p.datos.rho===null||p.datos.rho===undefined?"no determinado":fmt(p.datos.rho,3)+"°"}</b></div>
    <div class="kv"><span>error de ajuste</span><b>${fmt(p.datos.rms,2)} px${p.datos.rhoRms===null||p.datos.rhoRms===undefined?"":" · lateral "+fmt(p.datos.rhoRms,1)+" px"}</b></div>
  </div>
  <table><tr><th>Marca</th><th>Altura (cm)</th><th>Fila (px)</th><th>Columna (px)</th><th>Desajuste (px)</th></tr>
    ${p.datos.puntos.map((q,i)=>`<tr><td>${i+1}</td><td>${fmt(q.h,1)}</td><td>${fmt(q.y,1)}</td>
      <td>${q.x===null||q.x===undefined?"—":fmt(q.x,0)}</td>
      <td style="color:${Math.abs(p.datos.res[i]||0)>0.004*p.h?"var(--warn)":"var(--txt)"}">${fmt(p.datos.res[i],1)}</td></tr>`).join("")}

  <div class="btns"><button id="aDel">Borrar este perfil</button></div>
  <div class="btns">
    <button id="aDelTodo">Borrar todos los perfiles</button>
    <button id="aCero">Empezar de cero</button>
  </div>
  <div class="btns"><button id="aBase">Restaurar el perfil base de fábrica</button></div>
  <div class="note"><b>Borrar todos los perfiles</b> deja únicamente el perfil base de fábrica, para que la
  aplicación siga funcionando; no toca las capturas ni los datos de campo.
  <b>Empezar de cero</b> borra además las capturas de calibración guardadas, la distancia y los ángulos de la
  última toma, la elección de objetivo y las referencias sobre la imagen. Ninguna de las dos cosas se puede
  deshacer, así que exporta antes lo que quieras conservar.</div>

  <h3>Incertidumbres de entrada</h3>
  <div class="row"><label>Error de marcado</label><input type="number" step="0.5" id="aUpx" value="${S.med.upx}"><span class="u">px</span></div>
  <div class="row"><label>Error de la inclinación frontal</label><input type="number" step="0.05" id="aUphi" value="${S.med.uphi}"><span class="u">°</span></div>
  <div class="note">u(marcado) es la repetibilidad al poner la cruz sobre el punto; 2 a 3 px es realista con zoom.
  u(inclinación) cubre el ruido del sensor más el residuo de la desalineación.</div>

  <h3>Trasladar datos entre aparatos</h3>
  <div class="btns">
    <button id="aExp">Exportar todo</button>
    <button id="aExpF">Descargar archivo</button>
  </div>
  <div class="btns">
    <button id="aImp">Importar del texto</button>
    <button id="aImpF">Importar de archivo</button>
  </div>
  <input type="file" id="aFile" accept=".json,application/json" style="display:none">
  <textarea id="aJson" placeholder="Aquí sale el texto al exportar; pega aquí el texto recibido y pulsa Importar"
    style="width:100%;min-height:90px;background:#0d1117;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:8px;font:11.5px ui-monospace,monospace"></textarea>
  <div class="note">Los perfiles y las capturas se guardan en el almacén local del navegador, así que
  <b>no pasan del móvil al ordenador ni al revés</b>. Exporta el texto, pásalo por donde quieras y pégalo en el
  otro equipo.
  <br><br>Al importar, el perfil llega <b>sin asociar a ninguna cámara</b>: el identificador de objetivo es
  distinto en cada navegador, así que la asociación automática se pierde y habrá que elegir el perfil a mano.
  La focal, el centro óptico y la desalineación sí se conservan, que es lo que cuesta medir.
  <br><br>Aun así, <b>calibra en el aparato donde vayas a medir</b>. Un perfil describe una cámara concreta en un
  modo de captura concreto: traerlo de otro sitio solo tiene sentido para conservar un respaldo o para pasárselo
  a alguien con el mismo equipo.</div>

  <h3>Un perfil por modo de captura</h3>
  <div class="note">La focal en píxeles depende de la resolución y del recorte del sensor, así que
  <b>foto 12 MP, foto 50 MP, vídeo 4K, vídeo 1080p y la vista en directo necesitan cada uno su calibración</b>.
  Usar un perfil de foto para medir sobre vídeo introduce un error de escala que no avisa de su presencia.
  Nombra cada perfil con el modo y el zoom con que se obtuvo.</div>

  <h3>Alcance</h3>
  <div class="note">Herramienta de trabajo interno. No sustituye a un organismo notificado ni a un laboratorio de ensayo.
  Para un expediente de conformidad, la trazabilidad de la distancia de observación y la calibración del dispositivo
  deben documentarse aparte.</div>
  <div class="note"><a href="nivel.html">Página de nivel y diagnóstico de sensores</a><br><a href="cronometro.html">Verificación de cronómetros contra UTC</a><br><a href="index.html">Inicio</a></div>`;
}

function enlaza(){
  const on=(id,ev,fn)=>{ const e=$("#"+id); if(e) e.addEventListener(ev,fn); };
  /* Acepta coma decimal, que es lo que teclea cualquiera aquí, y descarta un

    S.marks={origen:null, puntos:[{lab:"Altura de funcionamiento", x:null, y:null, hReal:null}]}; S.sel=-1;
    S.src=null; S.reticula=false;
    cerrarCamara(); $("#hint").classList.remove("hide");
    guarda(); pinta();
    alert("Hecho. Todo vuelve al estado inicial.");
  });
  num("aUpx","upx",S.med); num("aUphi","uphi",S.med);
  on("aReabrir","click",async()=>{
    const p=perfil(); if(!p||!p.datos) return;
    const D=p.datos;
    S.calib.d=D.d; S.calib.hCam=D.hCam; S.calib.sensor=D.sensor;
    S.calib.sensorRoll=(D.sensorRoll===null||D.sensorRoll===undefined)?"":D.sensorRoll;
    S.calib.camaraId=p.camaraId||""; S.calib.uso=p.uso||"foto"; S.calib.tipo=D.tipo||"full";
    S.calib.puntos=D.puntos.map(q=>({h:q.h, y:q.y, x:(q.x===null||q.x===undefined)?null:q.x}));
    S.calib.capId=D.capId||""; S.calib.origen=D.capId?"captura":"archivo";
    S.calib.out=null;
    S.modo="calib"; sincTabs();
    if(D.capId && S.capturas.some(c=>c.id===D.capId)) await usaCaptura(D.capId);
    else { S.src=null; $("#hint").classList.remove("hide"); pinta();
      alert("Los números están cargados y puedes corregirlos y volver a ajustar.\n\nLa imagen original ya no está guardada, así que para recolocar alguna cruz tendrías que volver a cargarla."); }
    pinta();});
  on("aInforme","click",()=>{ const t=$("#aInfTxt"); if(t){ t.value=informeCalib(perfil()); t.select();
    navigator.clipboard?.writeText(t.value); } });
  on("aBase","click",()=>{
    if(!confirm("Añade el perfil base de fábrica.\n\nEstá medido sobre foto de 12 MP de un Galaxy S25+: solo sirve\npara esa cámara en ese modo. Para cualquier otra, calibra.\n\n¿Continuar?")) return;
    const b=Object.assign({},PERFIL_BASE,{id:"base"+Date.now()});
    S.perfiles.push(b); S.perfilId=b.id; guarda(); pinta();});
  on("aExp","click",()=>{
    const t=$("#aJson"); t.value=exportaDatos(S); t.select();
    navigator.clipboard?.writeText(t.value);
    alert("Exportados "+S.perfiles.length+" perfiles, "+S.camaras.length+" cámaras y "
      +ensayosLee().length+" configuraciones.\n\nEl texto está en el cuadro y en el portapapeles.");
  });
  on("aExpF","click",()=>{ const t=$("#aJson"); t.value=exportaDatos(S);
    descargaTexto(t.value, nombreExport()); });
  on("aImpF","click",()=>{ const f=$("#aFile"); if(f) f.click(); });
  on("aFile","change",e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ $("#aJson").value=fr.result; importaAqui(); };
    fr.readAsText(f); e.target.value="";
  });
  on("aImp","click",importaAqui);
}
function sincTabs(){ $$(".tab").forEach(b=>b.classList.toggle("on", b.dataset.m===S.modo)); }
$$(".tab").forEach(b=>b.addEventListener("click",()=>{
  S.modo=b.dataset.m; sincTabs();
  if (S.modo==="calib" && S.calib.puntos.length===0)
    S.calib.puntos=[{h:null,y:null},{h:null,y:null},{h:null,y:null},{h:null,y:null},{h:null,y:null}];
  pinta();
}));
["fImg","fDoc"].forEach(id=>$("#"+id).addEventListener("change",e=>{
  const f=e.target.files[0]; e.target.value="";
  if (!f) return;
  if (f.type && !f.type.startsWith("image/")){ alert("Ese archivo no es una imagen ("+f.type+")."); return; }
  cargaImagen(f);
}));
$("#fVidCal").addEventListener("change",e=>{
  const f=e.target.files[0]; e.target.value="";
  if(!f) return;
  if(f.type && !f.type.startsWith("video/")){ alert("Ese archivo no es un vídeo ("+f.type+")."); return; }
  S.calib.uso="video"; S.calib.origen="archivo"; S.calib.camaraId=""; S.calib.capId="";
  S.calib.puntos.forEach(p=>{p.y=null;p.x=null;}); S.calib.out=null;
  cargaVideo(f);
});
["fVid","fVidDoc"].forEach(id=>$("#"+id).addEventListener("change",e=>{
  const f=e.target.files[0]; e.target.value="";
  if (!f) return;
  if (f.type && !f.type.startsWith("video/")){ alert("Ese archivo no es un vídeo ("+f.type+")."); return; }
  cargaVideo(f);
}));

/* El lienzo se redimensiona cuando cambia el elemento, no cuando cambia la
   ventana: al maximizar, el panel reflueye y el rect no es fiable todavía. */
if (window.ResizeObserver) new ResizeObserver(()=>dimensiona()).observe($("#stage"));
window.addEventListener("resize",dimensiona);
window.addEventListener("orientationchange",()=>setTimeout(dimensiona,250));
dimensiona(); pinta(); cargaCapturas(); listaCamaras().then(pinta);
activaSensores().catch(()=>{});
</script>
</body>
</html>
