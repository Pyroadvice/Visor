<style>
:root{

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = (v,n=2) => (v===null||v===undefined||!isFinite(v)) ? "—" : v.toFixed(n).replace(".",",");
/* Decimales según la magnitud. Con dos decimales fijos, una altura de 0,85 m
   queda cuantificada en ±5 mm, que a corta distancia es mayor que la
   repetibilidad real del instrumento: la pantalla escondía precisión que la
   medida sí tenía. */
const dec = v => Math.abs(v)<10 ? 3 : (Math.abs(v)<100 ? 2 : 1);
const fmtH = v => fmt(v, dec(v));
/* Las alturas de referencia las escribe el usuario y pueden llevar decimales.
   Redondear la etiqueta a entero convertía «0,5 m» en «1 m»: la etiqueta
   mentía sobre la línea que acompaña, que es peor que no etiquetar. Se usan
   los decimales justos, hasta tres, y ninguno de más. */
/* Lectura de un campo numérico escrito a mano: admite coma decimal y
   devuelve "" para lo que no sea un número, incluido un «-» a medio teclear. */
const numDe = v => {
  const t=String(v==null?"":v).trim().replace(",",".");
  return (t===""||!isFinite(+t)) ? "" : +t;
};
const fmtEtiq = v => {
  if(v===null||v===undefined||!isFinite(v)) return "—";
  for(const k of [0,1,2]) if(Math.abs(v-+v.toFixed(k))<1e-9) return fmt(v,k);
  return fmt(v,3);
};
const COL = ["#4493f8","#3fb950","#d29922","#bc8cff","#39c5cf","#f778ba"];

/* ---------------------------------------------------------------- estado */
const PERFIL_BASE = {
  id:"s25p-foto",
  name:"S25+ · foto 12 MP · zoom 1,0",
  fRel:0.67700,     // f / altura de fotograma
  y0Rel:0.49750,    // centro óptico / altura de fotograma
  delta:0.511,      // desalineación acelerómetro → eje óptico (grados)
  uF:0.40,          // u(f) relativa, %
  w:3000, h:4000, uso:"foto",   // fotograma y uso para el que se calibró
  note:"Validado 15/11/2026 sobre 3000×4000 px"
};

const S = {
  modo:"foto",
  perfiles: JSON.parse(localStorage.getItem("vpd.perfiles")||"null") || [PERFIL_BASE],
  perfilId: localStorage.getItem("vpd.perfilId") || PERFIL_BASE.id,
  med: JSON.parse(localStorage.getItem("vpd.med")||"null") || {
    d:100, ud:1.0, hRef:0, tol:20, upx:3, uphi:0.3, phiManual:"", rollManual:"",
    obliq:false, angulos:"15, 30", horiz:false, alturas:"20, 30",
    ref:"", lote:"", cat:"", nEns:"", operador:"", lugar:"", obs:"",
    ensayoId:"", ensayoNom:""
  },
  src:null,
  marks:{ origen:null, puntos:[{lab:"Altura de funcionamiento", x:null, y:null, hReal:null}] },
  sel:-1,                 // -1 = origen ; 0..n-1 = índice de punto
  paso:"fino",            // fino | normal
  view:{s:1, tx:0, ty:0, fit:1},
  calib:{ puntos:[], d:100, hCam:0, sensor:"", sensorRoll:"", out:null, tipo:"phi", camaraId:"", origen:"", capId:"", uso:"foto" },
  reticula:false,
  liveErr:"",
  cams:[], capturas:[], capErr:"", camDistinta:false,
  camaras: JSON.parse(localStorage.getItem("vpd.camaras")||"[]"),
  camaraId: localStorage.getItem("vpd.camaraId")||"",
  nuevaCam:null,          // configuración en preparación: {deviceId, zoom, nombre}
  zoomCap:null,           // margen de zoom que admite el dispositivo abierto
  tecnico: localStorage.getItem("vpd.tecnico")==="1"
};
const guardaCam = () => {
  localStorage.setItem("vpd.camaras", JSON.stringify(S.camaras));
  localStorage.setItem("vpd.camaraId", S.camaraId);
};
/* Una «cámara» aquí es una CONFIGURACIÓN con nombre: dispositivo más zoom.
   El navegador solo enumera dispositivos, y el ×2 del objetivo principal no
   es un dispositivo distinto sino el mismo con otro zoom, así que un perfil
   tiene que colgar de la configuración y no del dispositivo. */
const camara = id => S.camaras.find(c=>c.id===id) || null;
const esExterna = c => !!(c && c.tipo==="externa");
const nombreCamara = id => { const c=camara(id); return c? c.nombre : "—"; };
const perfilDe = (id,uso) => S.perfiles.find(q=>q.camaraId && q.camaraId===id && (q.uso||"foto")===uso) || null;
const perfilDeCamara = id => perfilDe(id,"vivo");

const guarda = () => {
  localStorage.setItem("vpd.perfiles", JSON.stringify(S.perfiles));
  localStorage.setItem("vpd.perfilId", S.perfilId);
  localStorage.setItem("vpd.med", JSON.stringify(S.med));
};
/* Puede no haber ningún perfil. Antes se reponía uno de fábrica para que la
   aplicación siguiera calculando, y eso es justo lo peligroso: un perfil que
   no corresponde a la cámara produce un error de escala constante que no
   avisa de su presencia. Sin perfil, la aplicación se niega a dar alturas. */
/* Cada perfil vale para UN uso. El mismo aparato da focales distintas en
   vivo, en foto y en vídeo, porque cada modo recorta y escala el sensor de
   otra manera, y una cámara ajena necesita las suyas. Mezclarlos produce un
   error de escala constante que no avisa. */
const USOS={vivo:"en vivo", foto:"foto", video:"vídeo"};
const usoDeModo = m => m==="directo" ? "vivo" : (m==="video" ? "video" : "foto");
const perfilesDe = u => S.perfiles.filter(q=>(q.uso||"foto")===u);
const perfil = () => S.perfiles.find(p=>p.id===S.perfilId) || null;
/* Factor de zoom del objetivo, deducido de la focal calibrada. Ninguna API lo
   facilita, pero f dividida por la diagonal del fotograma es invariante frente
   al recorte y comparable entre fuentes de distinta relación de aspecto.
   La referencia ×1 es el objetivo principal del perfil base. */
const FDIAG_REF = 0.67700*4000/Math.hypot(3000,4000);
function zoomDe(p){
  if(!p||!p.w||!p.h||!p.fRel) return null;
  return (p.fRel*p.h/Math.hypot(p.w,p.h))/FDIAG_REF;
}
const PASO = () => S.paso==="fino" ? 0.25 : 4;   // en píxeles de imagen

/* ------------------------------------------------------------- sensores */
let sensorOn = false;

/* ---------------------------------------------------------------------
   Resolución de los sensores en el navegador.

   Chrome redondea las lecturas para mitigar la huella digital por
   calibración de fábrica (ataque SensorID). Los dos redondeos no son
   equivalentes para medir ángulos:

     · Acelerómetro / GravitySensor: 0,1 m/s². Con el móvil casi vertical
       eso son 0,1/9,81 rad = 0,584° de salto, porque dρ/dg = 1/|g|.
     · DeviceOrientationEvent: 0,1° directamente sobre el ángulo.

   Por eso la orientación es la fuente preferente y la gravedad queda de
   respaldo y de comprobación cruzada. Además se promedia en una ventana:
   el ruido del sensor hace oscilar la lectura entre escalones contiguos
   en proporción a dónde cae el valor real, así que el promedio recupera
   resolución por debajo del escalón. La dispersión de la ventana dice si
   ese tramado está funcionando o si la lectura se ha quedado clavada en
   un escalón, caso en el que promediar no aporta nada.
   --------------------------------------------------------------------- */
const VENTANA = 1500;                    // ms de promediado
const SENS = {
  grav:{p:null,r:null,n:0,sp:new Set(),sr:new Set(),pasoP:null,pasoR:null},
  ori :{p:null,r:null,n:0,sp:new Set(),sr:new Set(),pasoP:null,pasoR:null},
  pref:"ori", buf:[], bufR:[], err:""
};
function pasoDe(s){
  const v=[...s].sort((a,b)=>a-b); let m=Infinity;
  for(let i=1;i<v.length;i++){ const d=v[i]-v[i-1]; if(d>1e-7&&d<m) m=d; }
  return isFinite(m)?m:null;
}
/* La inclinación lateral se toma SIEMPRE del vector gravedad, nunca de la orientación.
   La orientación descompone la postura en tres ángulos encadenados, y con el
   móvil a plomo la inclinación frontal vale 90°, que es exactamente la posición en que
   dos de los tres ejes se superponen: ahí la inclinación lateral deja de estar
   determinado y un giro pequeño se reparte de forma arbitraria entre dos
   ángulos, lo que produce lecturas absurdamente sensibles. El vector gravedad
   solo degenera con el móvil tumbado, que es la postura contraria a la de
   medida. La inclinación frontal sí se toma de la orientación, que ahí está bien
   condicionado y viene en rejilla de 0,1° en vez de 0,58°. */
function anota(src,p,r){
  const o=SENS[src]; o.p=p; o.r=r; o.n++;
  if (o.sp.size<600 && p!==null) o.sp.add(+p.toFixed(6));
  if (o.sr.size<600 && r!==null) o.sr.add(+r.toFixed(6));
  if (o.n%15===0){ o.pasoP=pasoDe(o.sp); o.pasoR=pasoDe(o.sr); }
  if (src===SENS.pref || SENS[SENS.pref].n===0){
    const t=performance.now();
    SENS.buf.push({t,p,r:null});
    while(SENS.buf.length && t-SENS.buf[0].t>VENTANA) SENS.buf.shift();
  }
  pintaBadges();
}
function media(){
  const b=SENS.buf;
  if (!b.length) return {p:null,r:null,sp:null,sr:null,n:0};
  const pp=b.filter(x=>x.p!==null), rr=b.filter(x=>x.r!==null);
  const mp=pp.length?pp.reduce((s,x)=>s+x.p,0)/pp.length:null;
  const mr=rr.length?rr.reduce((s,x)=>s+x.r,0)/rr.length:null;
  const sp=mp===null?null:Math.sqrt(pp.reduce((s,x)=>s+(x.p-mp)**2,0)/pp.length);
  const sr=mr===null?null:Math.sqrt(rr.reduce((s,x)=>s+(x.r-mr)**2,0)/rr.length);
  return {p:mp, r:mr, sp, sr, n:b.length};
}
/* Vector gravedad: inclinación frontal = asin(−gz/|g|), invariante a la inclinación lateral porque
   la inclinación lateral gira alrededor del eje óptico y no toca gz. Inclinación lateral
   ρ = atan2(gx, gy), cero con el móvil vertical en retrato. */
function fijaGrav(gx,gy,gz){
  const m = Math.hypot(gx,gy,gz) || 1;
  const pitch = Math.asin(-gz/m)*180/Math.PI;
  const roll  = Math.atan2(gx,gy)*180/Math.PI;
  const t=performance.now();
  SENS.bufR.push({t, r:roll});
  while(SENS.bufR.length && t-SENS.bufR[0].t>VENTANA) SENS.bufR.shift();
  anota("grav", pitch, roll);
}
function mediaRoll(){
  const b=SENS.bufR;
  if(!b.length) return {r:null, s:null, n:0};
  const m=b.reduce((s,x)=>s+x.r,0)/b.length;
  const sd=Math.sqrt(b.reduce((s,x)=>s+(x.r-m)**2,0)/b.length);
  return {r:m, s:sd, n:b.length};
}
async function activaSensores(){
  if (sensorOn) return;
  SENS.err="";
  try{
    if (typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
      const r = await DeviceMotionEvent.requestPermission();
      if (r!=="granted") throw new Error("permiso de movimiento denegado");
    }
    if (typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      try{ await DeviceOrientationEvent.requestPermission(); }catch(e){}
    }
  }catch(e){ SENS.err=e.message; }

  // Fuente fina (rejilla de 0,1° sobre el ángulo): orientación.
  window.addEventListener("deviceorientation", ev=>{
    if (ev.beta===null) return;
    /* De la orientación se toma solo la inclinación frontal: gamma no sirve aquí (ver
       nota en anota()), así que ni se lee. */
    anota("ori", ev.beta===null?null:ev.beta-90, null);
  });
  // Fuente de respaldo y comprobación cruzada: gravedad (0,1 m/s² → 0,58°).
  try{
    if ("GravitySensor" in window){
      const g = new GravitySensor({frequency:60});
      g.addEventListener("reading", ()=>fijaGrav(g.x,g.y,g.z));
      g.addEventListener("error", ev=>{ SENS.err = ev.error?.message || "error GravitySensor"; });
      g.start(); sensorOn=true;
    }
  }catch(e){ SENS.err=e.message; }
  if (!sensorOn){
    window.addEventListener("devicemotion", ev=>{
      const a = ev.accelerationIncludingGravity; if(!a||a.x===null) return;
      fijaGrav(a.x,a.y,a.z);
    });
  }
  sensorOn=true;
  pinta();
}
/* De dónde salen los ángulos.

   Solo la vista en directo puede tomarlos del sensor, porque solo ahí el
   móvil está apuntando a lo que se mide. Una foto o un vídeo se capturaron
   antes: su inclinación es un dato de la toma que hay que introducir, no
   algo que el sensor pueda decir ahora. Las entradas manuales recogen la
   LECTURA DEL SENSOR anotada en la toma; la desalineación δ la aplica la
   aplicación. Congelar un fotograma del directo solo rellena esas casillas,
   así que la vía es única y el valor queda visible y editable. */
const esVivo = () => !!(S.src && S.src.kind==="live");
const vacio  = v => v===""||v===null||v===undefined||!isFinite(+v);

function tiltUsado(){
  const dl = perfil()?perfil().delta:0;
  if (esVivo()){ const m=media().p; return m===null?null:m+dl; }
  if (vacio(S.med.phiManual)) return 0;          // a plomo supuesto, se avisa
  return +S.med.phiManual + dl;
}
function phiSupuesto(){ return !esVivo() && vacio(S.med.phiManual); }
/* DOS MAGNITUDES DISTINTAS, y conviene no volver a mezclarlas.

   tiltLeido / rollLeido son la DESVIACIÓN MEDIDA respecto al plomo: contestan
   a «¿lo tengo recto?» y valen 0,00 cuando el móvil está a plomo. Es lo que
   va en la insignia, porque es lo único sobre lo que el operador puede
   actuar mientras apunta.

   tiltUsado / rollUsado son el ÁNGULO DEL EJE ÓPTICO, que es lo que necesita
   el modelo: la lectura más la desalineación del aparato. Mezclar las dos
   hacía que un δ mal calibrado contestara «35°» a la pregunta «¿lo tengo
   recto?», que es exactamente la pregunta que la insignia debe responder.
   La corrección se sigue aplicando al medir, y la cadena completa (lectura,
   δ, ángulo aplicado) queda en el bloque técnico para quien la audite.     */
function tiltLeido(){
  if (esVivo()) return media().p;
  return vacio(S.med.phiManual) ? null : +S.med.phiManual;
}
function rollLeido(){
  if (esVivo()) return mediaRoll().r;
  return vacio(S.med.rollManual) ? null : +S.med.rollManual;
}
function rollUsado(){
  const dr = perfil() ? (+perfil().deltaRoll || 0) : 0;
  if (esVivo()){ const m=mediaRoll().r; return m===null?null:m+dr; }
  return vacio(S.med.rollManual) ? null : +S.med.rollManual + dr;
}
/* Umbrales de inclinación lateral. Recomendación propia, no requisito normativo:
   mantienen la contribución de la inclinación lateral por debajo del 1 % de la altura en
   los encuadres realistas. Ver nota en la interfaz. */
const ROLL_OK = 1.0, ROLL_AVISO = 3.0;
/* Incertidumbre de la inclinación lateral una vez corregida. Con el móvil casi vertical la
   lectura de inclinación lateral sale de atan2(gx,gy) y el redondeo del acelerómetro a
   0,1 m/s² se traduce en 0,1/9,8 rad ≈ 0,6°. Si no hay ninguna lectura de
   inclinación lateral (foto de un tercero sin dato), se presupuesta el límite de aviso. */
const U_ROLL_DESC = ROLL_AVISO;   // U_ROLL lo define modelo.js
/* DELTA_MAX y deltaRaro los define calib.js. */
function semaforoRoll(r){
  if (r===null) return {cls:"v-na", txt:"sin lectura"};
  const a=Math.abs(r);
  if (a<=ROLL_OK)    return {cls:"v-ok", txt:"dentro de ±"+fmt(ROLL_OK,1)+"°"};
  if (a<=ROLL_AVISO) return {cls:"v-na", txt:"entre ±"+fmt(ROLL_OK,1)+"° y ±"+fmt(ROLL_AVISO,1)+"°: aceptable si origen y punto quedan en la misma vertical"};
  return {cls:"v-no", txt:"por encima de ±"+fmt(ROLL_AVISO,1)+"°: corrige la inclinación lateral"};
}

/* ----------------------------------------------------------- geometría */
/* El perfil guarda el fotograma sobre el que se calibró. Si la fuente actual
   tiene OTRA RELACIÓN DE ASPECTO, no es solo otra resolución: es otro campo de
   visión, casi siempre otro objetivo, y la focal del perfil no es aplicable.
   Un perfil de foto 3:4 aplicado a vídeo 9:16 de la cámara ultra gran angular
   da un error de escala constante del orden del 65 %. */
function desajustePerfil(){
  if(!S.src) return null;
  const p=perfil();
  if(!p||!p.w||!p.h) return null;
  const aP=p.w/p.h, aS=S.src.w/S.src.h;
  if(Math.abs(aP-aS)/aP>0.02) return {aP,aS,pw:p.w,ph:p.h};
  return null;
}
/* El modelo de medida (geom y medidas) está en modelo.js, compartido con
   basico.html para que las dos páginas no puedan dar números distintos. */

/* ------------------------------------------------------------- lienzo */
const cv = $("#cv"), ctx = cv.getContext("2d");
let W=0, H=0, DPR=1;
function dimensiona(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  const r = $("#stage").getBoundingClientRect();
  const nw = Math.max(1,Math.round(r.width)), nh = Math.max(1,Math.round(r.height));
  if (nw===W && nh===H && cv.width===Math.round(nw*DPR)) return;
  W=nw; H=nh;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (S.src){ S.view.fit = Math.min(W/S.src.w, H/S.src.h); limita(); }
  dibuja(); pintaBadges();
}
function encaja(){
  if (!S.src) return;
  const s = Math.min(W/S.src.w, H/S.src.h);
  S.view.fit = s; S.view.s = s;
  S.view.tx = (W-S.src.w*s)/2; S.view.ty = (H-S.src.h*s)/2;
}
/* La cruz filar está en el centro del visor, así que cualquier píxel de la
   imagen tiene que poder llegar hasta ahí. El recorte permite sacar la
   imagen del visor hasta que su borde alcanza el centro, no antes. */
function limita(){
  const v=S.view, iw=S.src.w*v.s, ih=S.src.h*v.s;
  v.tx = Math.min(W/2, Math.max(W/2-iw, v.tx));
  v.ty = Math.min(H/2, Math.max(H/2-ih, v.ty));
}
const aImg = (sx,sy) => ({x:(sx-S.view.tx)/S.view.s, y:(sy-S.view.ty)/S.view.s});
const aPan = (ix,iy) => ({x:ix*S.view.s+S.view.tx, y:iy*S.view.s+S.view.ty});
const centroImg = () => aImg(W/2, H/2);
const dentro = () => { const c=centroImg();
  return c.x>=0 && c.y>=0 && c.x<=S.src.w && c.y<=S.src.h; };

function dibuja(){
  ctx.clearRect(0,0,W,H);
  if (S.src){
    const v=S.view;
    ctx.imageSmoothingEnabled = v.s < 2;
    try{ ctx.drawImage(S.src.el, 0,0,S.src.w,S.src.h, v.tx,v.ty,S.src.w*v.s,S.src.h*v.s); }catch(e){}
  }
  if (S.src && S.modo!=="calib"){
    if (S.marks.origen!==null) linea(S.marks.origen.y, "#ff7b40", "ORIGEN", S.sel===-1, S.marks.origen.x);
    S.marks.puntos.forEach((q,i)=>{
      if (q.y!==null) linea(q.y, COL[i%COL.length], (i+1)+" · "+(q.lab||"punto"), S.sel===i, q.x);
    });
  }
  if (S.modo==="calib" && S.src){
    S.calib.puntos.forEach(p=>{ if(p.y!==null) linea(p.y,"#3fb950",fmt(p.h,1)+" cm",false); });
  }
  if (S.med.obliq) dibujaOblicuas();
  if (S.med.horiz) dibujaHorizontales();
  if (S.reticula) dibujaReticula();
  cruz();
}
/* La línea de una marca señala SU ALTURA, y una altura constante es una
   horizontal del mundo: con la imagen girada ρ aparece girada ρ también. Se
   dibuja con esa pendiente y pivotando en la columna de la propia marca, para
   que no desmienta a las líneas de altura de referencia, que sí la llevan. */
function linea(iy,col,lab,activa,ix){
  const py = aPan(0,iy).y;
  /* En Calibración no se gira: ahí la inclinación lateral que se lee es la de ahora, no
     el de la captura que se está midiendo, y girar por él engañaría. */
  const rl = S.modo==="calib" ? null : rollUsado();
  const tg = rl===null?0:Math.tan(rl*Math.PI/180);
  const px0 = (ix===null||ix===undefined) ? aPan((S.src?S.src.w/2:0),0).x : aPan(ix,0).x;
  const yEn = xq => py + (xq-px0)*tg;
  if (Math.max(yEn(0),yEn(W))<-24 || Math.min(yEn(0),yEn(W))>H+24) return;
  ctx.strokeStyle=col; ctx.lineWidth=activa?2.2:1.4;
  ctx.setLineDash(activa?[]:[7,5]);
  ctx.beginPath(); ctx.moveTo(0,yEn(0)); ctx.lineTo(W,yEn(W)); ctx.stroke(); ctx.setLineDash([]);
  if (ix!==null && ix!==undefined){           // marca de posición lateral
    const px = aPan(ix,0).x, pyx = yEn(px);
    ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(px,pyx-7); ctx.lineTo(px,pyx+7); ctx.stroke();
  }
  ctx.font="600 11px ui-monospace,monospace";
  const w = ctx.measureText(lab).width;
  const ly = yEn(4+w/2);
  ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(4,ly-16,w+8,14);
  ctx.fillStyle=col; ctx.fillText(lab, 8, ly-5);
}
const lista = t => String(t||"").split(/[,;\s]+/).map(x=>parseFloat(x.replace(",","."))).filter(x=>isFinite(x)&&x>0);

/* Líneas de desviación respecto a la vertical, desde el punto de disparo.

   Son RECTAS en la imagen: una recta del espacio se proyecta como recta, y la
   generatriz del cono de desviación lo es. Lo que no es trivial es su escala
   lateral. Un punto a altura ΔH sobre el disparo y desplazado ΔH·tan(θ) queda,
   con la cámara inclinada φ, a una distancia al plano imagen distinta de d:

     separación lateral en píxeles = f·(ΔH/d)·tan(θ) / (r·sen φ + cos φ)
     fila de imagen                = yDe(r_origen + ΔH/d)

   Omitir ese denominador parece inocuo y no lo es: con 10° de inclinación frontal el error
   alcanza 414 px a 150 m de altura, y con 30° se dispara. Se traza punto a
   punto porque así el recorte y el caso límite de r·sen φ + cos φ → 0, cuando
   el punto se va al infinito, se resuelven solos.                            */
function dibujaOblicuas(){
  const g=geom(); if(!g||S.marks.origen===null) return;
  const d=+S.med.d; if(!d) return;
  const xo=S.marks.origen.x;
  if(xo===null||xo===undefined) return;
  const ro=g.r(S.marks.origen.y,xo), uo=g.uDe(S.marks.origen.y,xo);
  /* tangente lateral del origen: a/d, despejada de su propia columna */
  const A=uo*(ro*Math.sin(g.phi)+Math.cos(g.phi))/g.f;
  const angs=lista(S.med.angulos);
  const cols=["#bc8cff","#39c5cf","#f778ba","#d29922"];
  ctx.font="600 11px ui-monospace,monospace";
  // vertical de referencia
  traza(g,ro,A,0,"rgba(255,255,255,.45)",null);
  angs.forEach((a,k)=>{
    const col=cols[k%cols.length];
    traza(g,ro,A,+a,col,a+"°"); traza(g,ro,A,-a,col,null);
  });
}
function traza(g,ro,A,angDeg,col,lab){
  const tg=Math.tan(angDeg*Math.PI/180);
  const sp=Math.sin(g.phi), cp=Math.cos(g.phi);
  ctx.strokeStyle=col; ctx.lineWidth=angDeg===0?1:1.6; ctx.setLineDash(angDeg===0?[4,6]:[]);
  ctx.beginPath();
  let primero=true, ult=null;
  for(let t=0;t<=4;t+=0.01){
    const r=ro+t, den=r*sp+cp;
    if(den<=0.02) break;                       // el punto se va al infinito
    const q=g.aImgR(g.f*(A+t*tg)/den, g.yDe(r)-g.y0), p=aPan(q.x,q.y);
    if(p.y<-80) break;
    if(primero){ ctx.moveTo(p.x,p.y); primero=false; } else ctx.lineTo(p.x,p.y);
    ult=p;
  }
  ctx.stroke(); ctx.setLineDash([]);
  if(lab&&ult){ ctx.fillStyle=col; ctx.fillText(lab, ult.x+5, ult.y+12); }
}
/* Recta horizontal del mundo a la fila a plomo v. Con inclinación lateral ρ no es
   horizontal en pantalla: aparece girada exactamente ρ, igual que el resto de
   la imagen. Se dibuja en coordenadas a plomo y se gira al final. */
function lineaMundo(g,v,col,lw,dash,lab,der){
  const L=(S.src.w+S.src.h)*2;
  const q1=g.aImgR(-L,v), q2=g.aImgR(L,v);
  const a=aPan(q1.x,q1.y), b=aPan(q2.x,q2.y);
  if (Math.max(a.y,b.y)<-30 || Math.min(a.y,b.y)>H+30) return;
  ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]);
  if(!lab) return;
  const yEn = xq => a.y + (b.y-a.y)*(xq-a.x)/((b.x-a.x)||1);
  const w=ctx.measureText(lab).width;
  const px = der ? W-w-14 : 4;
  const py = yEn(px+w/2);
  ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(px,py-16,w+8,14);
  ctx.fillStyle=col; ctx.fillText(lab, px+4, py-5);
}
/* Alturas de referencia sobre el punto de disparo. */
function dibujaHorizontales(){
  const g=geom(); if(!g||S.marks.origen===null) return;
  const d=+S.med.d; if(!d) return;
  const ro=g.r(S.marks.origen.y,S.marks.origen.x);
  ctx.font="600 11px ui-monospace,monospace";
  for(const Hv of lista(S.med.alturas))
    lineaMundo(g, g.yDe(ro+Hv/d)-g.y0, "#39c5cf", 1.4, [10,4], fmtEtiq(Hv)+" m", true);
}
function dibujaReticula(){
  const g=geom(); if(!g||S.marks.origen===null) return;
  const d=+S.med.d, hn=+S.med.hNom, tol=+S.med.tol;
  if (!hn||!d) return;
  const ro = g.r(S.marks.origen.y,S.marks.origen.x);
  const sets=[[hn,"#8b949e","nominal"],[hn*(1+tol/100),"#f85149","+"+fmt(tol,0)+"%"],
              [hn*(1-tol/100),"#f85149","−"+fmt(tol,0)+"%"]];
  ctx.font="600 11px ui-monospace,monospace";
  for (const [hv,col,lab] of sets)
    lineaMundo(g, g.yDe(ro+hv/d)-g.y0, col, lab==="nominal"?1:1.8,
               lab==="nominal"?[3,6]:[], lab+"  "+fmtEtiq(hv)+" m", false);
}
function cruz(){
  const cx=W/2, cy=H/2;
  const col = S.modo==="calib" ? "#3fb950"
            : (S.sel===-1 ? "#ff7b40" : COL[S.sel%COL.length]);
  ctx.strokeStyle="rgba(0,0,0,.6)"; ctx.lineWidth=3.5;
  ctx.beginPath();
  ctx.moveTo(cx-30,cy); ctx.lineTo(cx-6,cy); ctx.moveTo(cx+6,cy); ctx.lineTo(cx+30,cy);
  ctx.moveTo(cx,cy-30); ctx.lineTo(cx,cy-6); ctx.moveTo(cx,cy+6); ctx.lineTo(cx,cy+30);
  ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.92)"; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx-30,cy); ctx.lineTo(cx-6,cy); ctx.moveTo(cx+6,cy); ctx.lineTo(cx+30,cy);
  ctx.moveTo(cx,cy-30); ctx.lineTo(cx,cy-6); ctx.moveTo(cx,cy+6); ctx.lineTo(cx,cy+30);
  ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(cx,cy,3.4,0,7); ctx.stroke();
}
function pintaBadges(){
  const t=tiltLeido();
  const fij = esVivo() ? "" : " ⏸";   // pausa = ángulo de la toma, no lectura viva
  const tb=$("#tiltbadge"), zb=$("#zoombadge"), rl=rollLeido();
  const dR = deltaRaro(perfil());
  tb.innerHTML = (t===null ? "φ —"
      : "φ "+(t>=0?"+":"")+fmt(t,2)+"°"+fij)
    + (dR?"<span style=\"color:var(--bad)\"> ⚠δ</span>":"")
    + "<br><span style=\"color:"
    + (rl===null?"var(--dim)":(Math.abs(rl)<=ROLL_OK?"var(--ok)":(Math.abs(rl)<=ROLL_AVISO?"var(--warn)":"var(--bad)")))
    + "\">ρ " + (rl===null?"—":(rl>=0?"+":"")+fmt(rl,2)+"°") + "</span>";
  if (S.src){
    const c=centroImg();
    /* «vista» explícito: sin esa palabra se confundía con el zoom de cámara,
       que sí cambia la focal y sí afectaría al resultado. El de vista no. */
    zb.textContent = "vista "+fmt(S.view.s/S.view.fit,1)+"×";
    zb.style.color = dentro()? "var(--txt)" : "var(--warn)";
  } else zb.textContent="—";
}

/* ------------------------------------------------- gestos (pan + pinza) */
const pts = new Map();
let pinza=null;
cv.addEventListener("pointerdown", e=>{
  if (!S.src) return;
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pts.size===2){
    const [a,b]=[...pts.values()];
    pinza={dist:Math.hypot(a.x-b.x,a.y-b.y), s:S.view.s, cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
  }
});
cv.addEventListener("pointermove", e=>{
  if (!pts.has(e.pointerId)||!S.src) return;
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const rect = cv.getBoundingClientRect();
  if (pts.size===2 && pinza){
    const [a,b]=[...pts.values()];
    const nd = Math.hypot(a.x-b.x,a.y-b.y);
    const ns = Math.max(S.view.fit*0.4, Math.min(S.view.fit*60, pinza.s*nd/pinza.dist));
    const px=pinza.cx-rect.left, py=pinza.cy-rect.top;
    const im = aImg(px,py);
    S.view.s = ns; S.view.tx = px - im.x*ns; S.view.ty = py - im.y*ns;
    limita(); dibuja(); pintaBadges();
  } else if (pts.size===1){
    S.view.tx += e.clientX-prev.x; S.view.ty += e.clientY-prev.y;
    limita(); dibuja(); pintaBadges();
  }
});
const soltar = e=>{ pts.delete(e.pointerId); if(pts.size<2) pinza=null; };
cv.addEventListener("pointerup",soltar); cv.addEventListener("pointercancel",soltar);
cv.addEventListener("wheel", e=>{
  if (!S.src) return; e.preventDefault();
  const rect=cv.getBoundingClientRect(), px=e.clientX-rect.left, py=e.clientY-rect.top;
  const im=aImg(px,py);
  const ns=Math.max(S.view.fit*0.4, Math.min(S.view.fit*60, S.view.s*Math.exp(-e.deltaY*0.0015)));
  S.view.s=ns; S.view.tx=px-im.x*ns; S.view.ty=py-im.y*ns;
  limita(); dibuja(); pintaBadges();
},{passive:false});

function zoom(fac){
  if(!S.src) return;
  const im=centroImg();
  S.view.s=Math.max(S.view.fit*0.4, Math.min(S.view.fit*60, S.view.s*fac));
  S.view.tx=W/2-im.x*S.view.s; S.view.ty=H/2-im.y*S.view.s;
  limita(); dibuja(); pintaBadges();
}
/* Desplaza en píxeles de IMAGEN, no de pantalla: el paso fino es el mismo
   a cualquier zoom. dx,dy en unidades de paso; mueve la imagen igual que
   el arrastre con el dedo. */
function mueve(dx,dy){
  if(!S.src) return;
  const k = PASO()*S.view.s;
  S.view.tx -= dx*k; S.view.ty -= dy*k;
  limita(); dibuja(); pintaBadges();
}
/* pulsación mantenida con repetición */
function repite(el, fn){
  if(!el) return;
  let t1=null,t2=null;
  const stop=()=>{ clearTimeout(t1); clearInterval(t2); t1=t2=null; };
  el.addEventListener("pointerdown", e=>{
    e.preventDefault(); fn();
    t1=setTimeout(()=>{ t2=setInterval(fn,45); }, 300);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(k=>el.addEventListener(k,stop));
}

/* ------------------------------------------------------ carga de medios */
function limpiaMarcas(){
  S.marks.origen=null;
  S.marks.puntos.forEach(q=>{q.y=null; q.x=null;});
  S.sel=-1;
}
/* Lector mínimo de EXIF: solo los campos que identifican la óptica. Basta
   para saber con qué lente y con qué zoom se tomó una foto, y por tanto qué
   perfil le corresponde. NO sirve para medir: el equivalente de 35 mm viene
   redondeado por el fabricante y en el S25+ se desvía un 1,9 % de la focal
   que da la calibración, lo que serían 1,9 % de error en cada altura. */
function leeExif(buf){
  const dv=new DataView(buf); const out={};
  try{
    if(dv.getUint16(0)!==0xFFD8) return out;
    let p=2;
    while(p<dv.byteLength-4){
      if(dv.getUint8(p)!==0xFF) break;
      const m=dv.getUint8(p+1), len=dv.getUint16(p+2);
      if(m===0xE1 && dv.getUint32(p+4)===0x45786966){
        const t=p+10, le=dv.getUint16(t)===0x4949;
        const u16=o=>dv.getUint16(o,le), u32=o=>dv.getUint32(o,le);
        if(u16(t+2)!==42) return out;
        const leeIFD=(off,dest)=>{
          const n=u16(t+off);
          for(let i=0;i<n;i++){
            const e=t+off+2+i*12, tag=u16(e), tipo=u16(e+2), cnt=u32(e+4);
            const tam={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8}[tipo]||1;
            const vo=(tam*cnt<=4)?e+8:t+u32(e+8);
            let v=null;
            if(tipo===2){ let x=""; for(let k=0;k<cnt-1;k++) x+=String.fromCharCode(dv.getUint8(vo+k)); v=x.trim(); }
            else if(tipo===3) v=u16(vo);
            else if(tipo===4) v=u32(vo);
            else if(tipo===5||tipo===10){ const a=u32(vo), b=u32(vo+4); v=b?a/b:null; }
            dest[tag]=v;
          }
        };
        const ifd0={}; leeIFD(u32(t+4), ifd0);
        out.marca=ifd0[0x010F]||null; out.modelo=ifd0[0x0110]||null;
        if(ifd0[0x8769]){ const ex={}; leeIFD(ifd0[0x8769], ex);
          out.focal=ex[0x920A]??null; out.f35=ex[0xA405]??null;
          out.zoomDigital=ex[0xA404]??null; out.lente=ex[0xA434]||null; }
        return out;
      }
      p+=2+len;
    }
  }catch(e){}
  return out;
}
/* Focal relativa a la diagonal, magnitud comparable entre fuentes de
   distinta resolución y relación de aspecto. 43,27 mm es la diagonal del
   formato de 35 mm, al que se refiere el equivalente del EXIF. */
const fDiagPerfil = q => (q&&q.w&&q.h) ? q.fRel*q.h/Math.hypot(q.w,q.h) : null;
function perfilPorExif(){
  if(!S.exif || !S.exif.f35) return null;
  const obj=S.exif.f35/43.27;
  let mejor=null, dif=Infinity;
  for(const q of S.perfiles){
    const v=fDiagPerfil(q); if(v===null) continue;
    const d=Math.abs(v-obj)/obj;
    if(d<dif){ dif=d; mejor=q; }
  }
  return (mejor && dif<0.12) ? {perfil:mejor, dif} : null;
}

async function cargaImagen(file){
  S.exif=null;
  try{ S.exif=leeExif(await file.slice(0,262144).arrayBuffer()); }catch(e){}
  let bmp;
  try{ bmp = await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ bmp = await createImageBitmap(file); }
  S.src={kind:"img", el:bmp, w:bmp.width, h:bmp.height};
  S.srcCamId="";                 // un archivo no viene de ninguna cámara de este aparato
  limpiaMarcas();
  if (S.modo==="calib"){ S.calib.puntos.forEach(p=>{p.y=null;p.x=null;}); S.calib.out=null;
    S.calib.origen="archivo"; S.calib.capId=""; S.calib.uso="foto";
    /* No se borra la cámara elegida: lo normal es calibrar varias fotos de la
       misma cámara seguidas, y volver a elegirla cada vez sería un estorbo. */ }
  const sug=perfilPorExif();
  if(sug){ S.perfilId=sug.perfil.id; guarda(); }
  encaja(); $("#hint").classList.add("hide"); pinta();
}
let vidRAF=0;
function cargaVideo(file){
  const v=$("#vid"); v.srcObject=null; v.src=URL.createObjectURL(file);
  v.onloadedmetadata = ()=>{
    S.src={kind:"vid", el:v, w:v.videoWidth, h:v.videoHeight};
    limpiaMarcas(); v.currentTime=0; encaja();
    $("#hint").classList.add("hide"); pinta();
  };
  v.onseeked = ()=>{ dibuja(); pinta(); };
}
/* Las capturas de calibración se guardan a resolución completa, así que no
   caben en localStorage. IndexedDB admite Blobs y decenas de megas, y permite
   capturar hoy y calibrar después sin perder el montaje del trípode. */
let IDB=null;
function idb(){
  return new Promise((res,rej)=>{
    if(IDB) return res(IDB);
    const r=indexedDB.open("vpd",1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("capturas"))
      r.result.createObjectStore("capturas",{keyPath:"id"}); };
    r.onsuccess=()=>{ IDB=r.result; res(IDB); };
    r.onerror=()=>rej(r.error);
  });
}
const idbOp=(modo,fn)=>idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction("capturas",modo), o=t.objectStore("capturas");
  const q=fn(o); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error);
}));
const idbPut=o=>idbOp("readwrite",st=>st.put(o));
const idbAll=()=>idbOp("readonly",st=>st.getAll());
const idbDel=id=>idbOp("readwrite",st=>st.delete(id));

const URLS={};                                   // object URLs de las miniaturas
function urlDe(c){
  if(!URLS[c.id]) URLS[c.id]=URL.createObjectURL(c.blob);
  return URLS[c.id];
}
async function cargaCapturas(){
  try{ S.capturas=(await idbAll()).sort((a,b)=>b.ts-a.ts); }catch(e){ S.capturas=[]; }
  pinta();
}
async function capturaCalib(){
  if(!S.src||S.src.kind!=="live") return;
  S.calib.uso="vivo";
  const c=document.createElement("canvas");
  c.width=S.src.w; c.height=S.src.h;
  c.getContext("2d").drawImage(S.src.el,0,0);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));
  /* Se guardan los ángulos del sensor EN EL INSTANTE de la captura: después no
     hay forma de recuperarlos, y sin la inclinación lateral no se puede obtener δρ. */
  const M=media(), MR=mediaRoll();
  const o={id:"c"+Date.now(), ts:Date.now(), w:S.src.w, h:S.src.h,
           camaraId:S.camaraId||"", camLabel: nombreCamara(S.camaraId),
           zoom:S.zoomActual??null, senP:M.p, senR:MR.r, blob};
  try{ await idbPut(o); S.capErr=""; }catch(e){ S.capErr="No se pudo guardar la captura: "+e.message; }
  await cargaCapturas();
}
async function usaCaptura(id){
  const c=S.capturas.find(x=>x.id===id); if(!c) return;
  cerrarCamara();
  const bmp=await createImageBitmap(c.blob);
  S.src={kind:"img", el:bmp, w:bmp.width, h:bmp.height};
  S.srcCamId=""; S.calib.camaraId=c.camaraId||"";
  /* Sin perfil para este objetivo, lo que hace falta es el ajuste óptico
     completo: «solo desalineación» no permite crear un perfil nuevo. */
  if(!perfilDeCamara(c.camaraId)) S.calib.tipo="full";
  S.calib.origen="captura"; S.calib.capId=c.id; S.calib.uso="vivo";
  if(c.senP!==null&&c.senP!==undefined) S.calib.sensor=+c.senP.toFixed(2);
  if(c.senR!==null&&c.senR!==undefined) S.calib.sensorRoll=+c.senR.toFixed(2);
  limpiaMarcas(); S.calib.puntos.forEach(p=>{p.y=null;p.x=null;}); S.calib.out=null;
  encaja(); $("#hint").classList.add("hide"); pinta();
}
function cerrarCamara(){
  cancelAnimationFrame(vidRAF);
  ($("#vid").srcObject?.getTracks()||[]).forEach(t=>t.stop());
  $("#vid").srcObject=null;
}

async function listaCamaras(){
  try{
    const d=await navigator.mediaDevices.enumerateDevices();
    const v=d.filter(x=>x.kind==="videoinput");
    /* Solo las traseras: la frontal apunta al operador y no sirve para medir.
       Si las etiquetas no permiten distinguirlas, se muestran todas. */
    const tras=v.filter(x=>/back|rear|trasera|environment/i.test(x.label||""));
    S.cams = tras.length? tras : v;
  }catch(e){}
}
/* Abre una CONFIGURACIÓN guardada: dispositivo más zoom. */
async function abreCamara(camId){
  const c=camara(camId); if(!c) return abreDirecto();
  S.camaraId=camId; guardaCam();
  return abreDirecto(c.deviceId, c.zoom);
}
async function aplicaZoom(track, z){
  const caps = track.getCapabilities ? track.getCapabilities() : null;
  S.zoomCap = (caps && caps.zoom) ? {min:caps.zoom.min, max:caps.zoom.max, step:caps.zoom.step||0.1} : null;
  if(S.zoomCap && z!==null && z!==undefined && isFinite(z)){
    try{ await track.applyConstraints({advanced:[{zoom:+z}]}); }catch(e){}
  }
  return track.getSettings ? (track.getSettings().zoom ?? null) : null;
}
async function abreDirecto(devId, zoom){
  S.liveErr="";
  /* Blindaje: solo una cadena es un deviceId. Cualquier otra cosa (un Event
     de un manejador mal cableado) se descarta en vez de colarse como
     restricción imposible. */
  if (devId!==undefined && devId!==null && typeof devId!=="string") devId=undefined;
  if (zoom!==undefined && zoom!==null && !isFinite(+zoom)) zoom=undefined;
  try{
    /* Sin forzar 3840 de ancho: esa petición hacía que Chrome abriera la
       cámara ultra gran angular en vez de la principal, con una focal un 65 %
       menor que la del perfil de foto. */
    /* Pedir un deviceId como «exact» falla con OverconstrainedError si ese
       identificador ya no existe, cosa que ocurre al revocar o reconceder el
       permiso de cámara. Se intenta en cascada y se avisa si hubo que caer a
       otra lente, porque calibrar la que no es sería peor que no calibrar. */
    const intentos=[];
    if(devId) intentos.push({deviceId:{exact:devId}, width:{ideal:1920}});
    intentos.push({facingMode:{ideal:"environment"}, width:{ideal:1920}});
    intentos.push({width:{ideal:1920}});
    intentos.push({});
    let st=null, ultimo=null;
    for(const v of intentos){
      try{ st=await navigator.mediaDevices.getUserMedia({video:v, audio:false}); break; }
      catch(e){ ultimo=e; }
    }
    if(!st) throw (ultimo||new Error("no se pudo abrir ninguna cámara"));
    await listaCamaras();
    const tr = st.getVideoTracks()[0];
    S.zoomActual = await aplicaZoom(tr, zoom);
    const v=$("#vid"); v.src=""; v.srcObject=st; await v.play();
    S.src={kind:"live", el:v, w:v.videoWidth, h:v.videoHeight};
    S.srcCamId = tr?.getSettings?.().deviceId || devId || "";
    S.camDistinta = !!(devId && S.srcCamId && S.srcCamId!==devId);
    const acorde = perfilDeCamara(S.camaraId);
    if(acorde){ S.perfilId=acorde.id; guarda(); }     // perfil propio de esa configuración
    limpiaMarcas(); encaja(); $("#hint").classList.add("hide");
    const bucle=()=>{ if(S.src&&S.src.kind==="live"){dibuja(); vidRAF=requestAnimationFrame(bucle);} };
    cancelAnimationFrame(vidRAF); bucle(); pinta();
  }catch(e){
    const n=e&&e.name;
    S.liveErr = n==="NotAllowedError" ? "permiso denegado: concédelo en el candado de la barra de direcciones"
      : n==="NotFoundError" ? "este aparato no ofrece ninguna cámara al navegador"
      : n==="NotReadableError" ? "la cámara está ocupada por otra aplicación: ciérrala y vuelve a intentarlo"
      : n==="OverconstrainedError" ? "la lente guardada ya no existe para el navegador; vuelve a definir la cámara en la pestaña Cámaras"
      : (e.message||String(e));
    pinta();
  }
}
function congela(){
  if (!S.src||S.src.kind!=="live") return;
  const c=document.createElement("canvas");
  c.width=S.src.w; c.height=S.src.h;
  c.getContext("2d").drawImage(S.src.el,0,0);
  cancelAnimationFrame(vidRAF);
  ($("#vid").srcObject?.getTracks()||[]).forEach(t=>t.stop());
  $("#vid").srcObject=null;
  const M=media();                  // los ángulos del instante pasan a ser datos de la toma
  if (M.p!==null) S.med.phiManual  = +M.p.toFixed(2);
  if (M.r!==null) S.med.rollManual = +M.r.toFixed(2);
  guarda();
  S.src={kind:"img", el:c, w:c.width, h:c.height};
  encaja(); pinta();
}

/* El ajuste de calibración y el expediente están en calib.js, compartidos
   con basico.html, para que las dos versiones calibren igual. */

/* -------------------------------------------------------------- interfaz */
function pinta(){
  const P=$("#panel"), m=S.modo;
  if (m==="camaras") P.innerHTML = uiCamaras();
  else if (m==="calib") P.innerHTML = uiCalib();
  else if (m==="ajustes") P.innerHTML = uiAjustes();
  else P.innerHTML = uiMedida(m);
  enlaza(); dibuja(); pintaBadges(); pintaFS();
}

function diagHTML(){
  const M=media();
  const fila=(nom,o,clave)=>`<tr>
    <td>${nom}</td>
    <td>${o.n?fmt(o[clave==="p"?"p":"r"],2):"—"}</td>
    <td>${o[clave==="p"?"pasoP":"pasoR"]===null||o[clave==="p"?"pasoP":"pasoR"]===undefined?"—":fmt(o[clave==="p"?"pasoP":"pasoR"],3)}</td>
    <td>${o.n}</td></tr>`;
  const dither = (s,paso)=> (s===null||paso===null||paso===undefined) ? null : s/paso;
  const dP = dither(M.sp, SENS[SENS.pref].pasoP), dR = dither(M.sr, SENS[SENS.pref].pasoR);
  const juicio = d => d===null ? "—"
    : (d>0.25 ? "promedio efectivo" : (d>0.05 ? "tramado escaso" : "lectura clavada en un escalón"));
  return `<h3>Resolución de los sensores</h3>
  <div class="seg">
    <button class="${SENS.pref==="ori"?"on":""}" id="sOri">Orientación · 0,1°</button>
    <button class="${SENS.pref==="grav"?"on":""}" id="sGrav">Gravedad · 0,58°</button>
  </div>
  <table>
    <tr><th>Fuente · inclinación frontal</th><th>último (°)</th><th>escalón (°)</th><th>n</th></tr>
    ${fila("Orientación",SENS.ori,"p")}
    ${fila("Gravedad",SENS.grav,"p")}
    <tr><th>Inclinación lateral · solo gravedad</th><th>último (°)</th><th>escalón (°)</th><th>n</th></tr>
    ${fila("Gravedad",SENS.grav,"r")}
  </table>
  <div class="kv"><span>promedio de ${fmt(VENTANA/1000,1)} s</span><b>${M.n} muestras</b></div>
  <div class="kv"><span>dispersión de la inclinación frontal</span><b>${fmt(M.sp,3)}° · ${juicio(dP)}</b></div>
  <div class="kv"><span>dispersión de la inclinación lateral</span><b>${fmt(M.sr,3)}° · ${juicio(dR)}</b></div>
  <div class="note">La columna «escalón» es el salto mínimo realmente observado entre lecturas distintas:
  la mide la página, no la supongo. El acelerómetro viene redondeado a 0,1 m/s², que junto al móvil vertical
  son 0,584°; la orientación viene redondeada a 0,1° sobre el propio ángulo. Es una mitigación del navegador
  contra la identificación del dispositivo por la calibración de fábrica del sensor, no un ajuste de la aplicación.
  <br><br>El valor que se usa para medir es el <b>promedio de la ventana</b>. Si la dispersión es del orden del
  escalón, el ruido está haciendo oscilar la lectura entre escalones contiguos y el promedio recupera resolución
  por debajo de ${fmt(VENTANA/1000,1)} s. Si la dispersión es casi nula, la lectura está clavada y el promedio
  no mejora nada: ahí el escalón es el límite y conviene tomar φ del ajuste óptico en Calibración, que da
  del orden de 0,1°.</div>`;
}

function uiMedida(m){
  const R = medidas(), g = geom(), T = S.tecnico;
  let h = "";

  /* --- carga --- */
  if (m==="foto") h += `<div class="btns">
    <button class="p" id="bLoadImg">Galería / cámara</button>
    <button id="bLoadDoc">Archivo</button></div>`;
  if (m==="video"){
    h += `<div class="btns">
      <button class="p" id="bLoadVid">Galería</button>
      <button id="bLoadVidDoc">Archivo</button></div>`;
    if (S.src&&S.src.kind==="vid") h += `
    <div class="btns">
      <button id="vBack10">⏪ 10</button><button id="vBack">◀</button>
      <button id="vFwd">▶</button><button id="vFwd10">10 ⏩</button>
    </div>
    <div class="note">Fotograma <b id="vTime">—</b> · paso de 1/50 s.</div>`;
  }
  if (m==="directo"){
    h += S.src&&S.src.kind==="live"
      ? `<div class="btns"><button class="o" id="bFreeze">Congelar fotograma</button></div>`
        + `<div class="note">Fuente en directo: <b>${S.src.w}×${S.src.h} px</b>, relación ${fmt(S.src.w/S.src.h,3)}.</div>`
      : `<div class="btns"><button class="p" id="bLive">Abrir cámara</button></div>`;
    if (S.liveErr) h += `<div class="err">Cámara: ${S.liveErr}</div>`;
  }
  if (m==="directo" && S.src && S.src.kind==="live"){
    h += S.camaras.length
      ? `<div class="row"><label>Cámara</label><select id="iCam">
          ${S.camaras.map(c=>`<option value="${c.id}"${c.id===S.camaraId?" selected":""}>${c.nombre}${
            perfilDeCamara(c.id)?"":"  ·  sin calibrar"}</option>`).join("")}
        </select></div>
        <div class="note">Son las cámaras que definiste en la pestaña Cámaras. Al elegir una se aplica su
        objetivo y su zoom, y se activa <b>su perfil de en vivo</b>. Un perfil de foto o de vídeo no vale aquí,
        porque el flujo en vivo recorta y escala el sensor de otra manera.</div>`
      : `<div class="verdict v-na" style="text-align:left;font-weight:500">No has definido ninguna cámara.
         Ve a la pestaña <b>Cámaras</b>, enciende la cámara, elige objetivo y zoom y guárdala con un nombre.</div>`;
  }
  if (!S.perfiles.length) return h + `<div class="verdict v-no" style="text-align:left;font-weight:500">
    <b>No hay ningún perfil de cámara.</b><br>Sin él no se puede convertir lo que se ve en alturas, así que la
    aplicación no va a dar ninguna cifra. Ve a <b>Calibración</b>.</div>` + tecBoton();
  if (!S.src) return h + `<div class="note">Perfil activo: <b>${perfil().name}</b>.</div>` + tecBoton();

  const des = desajustePerfil();
  if (des) h += `<div class="verdict v-no" style="text-align:left;font-weight:500">
    <b>Las alturas que salgan serán falsas.</b><br>
    El perfil «${perfil().name}» se calibró sobre ${des.pw}×${des.ph} px, relación ${fmt(des.pw/des.ph,3)},
    y esta fuente es ${S.src.w}×${S.src.h} px, relación ${fmt(des.aS,3)}.
    Distinta relación de aspecto no es solo otra resolución: es otro campo de visión, casi siempre otro objetivo,
    y la focal del perfil no es aplicable. El error resultante es un <b>factor de escala constante</b>, así que
    todas las medidas salen mal por el mismo múltiplo y nada parece roto.<br>
    Calibra un perfil para esta fuente en la pestaña Calibración.</div>`;

  /* --- toma: distancia y ángulos --- */
  const rl = rollLeido(), sem = semaforoRoll(rl), tt = tiltUsado(), tl = tiltLeido();
  h += `<h3>Toma</h3>`;
  if (esVivo()){
    /* En vivo solo se elige el OBJETIVO, arriba. El perfil no es una
       elección: es el que se calibró para ese objetivo, o no hay ninguno.
       Dos selectores aparentemente alternativos para una sola decisión
       confunden más de lo que ayudan. */
    const pA=perfilDeCamara(S.camaraId);
    h += `<div class="card" style="padding:10px">
      <div class="kv"><span>cámara en uso</span><b>${nombreCamara(S.camaraId)}</b></div>
      ${S.camDistinta?`<div class="verdict v-no" style="text-align:left;font-weight:500">El navegador no pudo abrir
        la lente guardada y ha abierto otra. <b>No midas ni calibres así</b>: vuelve a definir esta cámara en la
        pestaña Cámaras.</div>`:""}
      <div class="kv"><span>perfil que le corresponde</span><b style="color:${pA?"var(--ok)":"var(--bad)"}">${
        pA? pA.name+(zoomDe(pA)!==null?" · ×"+fmt(zoomDe(pA),2):"") : "ninguno"}</b></div>
      ${pA?"":`<div class="verdict v-no" style="text-align:left;font-weight:500">Este objetivo no está calibrado,
        así que las alturas serían falsas. Ve a Calibración, captúralo y calíbralo.</div>`}
      <div class="kv"><span>fotograma abierto ahora</span><b>${S.src.w}×${S.src.h} px</b></div>
      ${pA&&pA.w?`<div class="kv"><span>fotograma de la calibración</span><b style="color:${
        (pA.w===S.src.w&&pA.h===S.src.h)?"var(--ok)":"var(--warn)"}">${pA.w}×${pA.h} px</b></div>`:""}
      ${(()=>{ const cz=camara(S.camaraId);
        if(!cz||cz.zoom===null||cz.zoom===undefined) return "";
        const ok = S.zoomActual!==null && S.zoomActual!==undefined
                   && Math.abs(S.zoomActual-cz.zoom)<=0.02*Math.abs(cz.zoom||1);
        return `<div class="kv"><span>zoom guardado · aplicado</span><b style="color:${ok?"var(--ok)":"var(--bad)"}">${
          fmt(cz.zoom,2)} · ${S.zoomActual===null||S.zoomActual===undefined?"no aplicado":fmt(S.zoomActual,2)}</b></div>`
          + (ok?"":`<div class="verdict v-no" style="text-align:left;font-weight:500">
            <b>El zoom guardado no se ha aplicado.</b> El campo de visión de ahora no es el de la calibración, así
            que todas las alturas saldrán multiplicadas por un factor constante. Cierra la cámara y vuelve a
            abrirla; si sigue sin aplicarse, vuelve a definir esta cámara en la pestaña Cámaras.</div>`);
      })()}</div>
      ${pA&&pA.w&&(pA.w!==S.src.w||pA.h!==S.src.h)?`<div class="verdict v-na" style="text-align:left;font-weight:500">
        <b>La cámara no está abriendo con el mismo fotograma que al calibrar.</b>
        Un tamaño distinto con la misma relación de aspecto no estropea nada por sí solo, porque la focal del perfil
        es relativa a la altura del fotograma. Pero sí avisa de que el navegador ha negociado otra configuración de
        la cámara, y si además cambia el recorte o el zoom, el campo de visión ya no es el mismo y todas las alturas
        salen con un error de escala constante.
        Compruébalo midiendo algo de altura conocida y mirando la casilla «altura real» de la tabla de marcas.</div>`:""}`;
  } else {
    const uso=usoDeModo(m), lista=perfilesDe(uso);
    if(!lista.length) return h + `<div class="verdict v-no" style="text-align:left;font-weight:500">
      <b>No hay ningún perfil de ${USOS[uso]}.</b><br>Un perfil de otro uso no sirve aquí: el mismo aparato da
      otra focal en vivo, en foto y en vídeo. Ve a <b>Calibración</b> y calibra ${uso==="video"
      ? "a partir de un vídeo grabado con esa cámara" : "una foto tomada con esa cámara"}.</div>` + tecBoton();
    if(!lista.some(q=>q.id===S.perfilId)){ S.perfilId=lista[0].id; guarda(); }
    h += `<div class="row"><label>Perfil de ${USOS[uso]}</label><select id="iPerf">
      ${lista.map(q=>`<option value="${q.id}"${q.id===S.perfilId?" selected":""}>${q.name}${
        zoomDe(q)!==null?"  ·  ×"+fmt(zoomDe(q),2):""}</option>`).join("")}
    </select></div>
    <div class="note">${des
      ? "El perfil activo no corresponde a esta fuente: la relación de aspecto no coincide. Elige el que se calibró para ella."
      : (S.exif && S.exif.f35
        ? `La foto lleva escrito con qué óptica se tomó: <b>${[S.exif.marca,S.exif.modelo].filter(Boolean).join(" ")||"cámara desconocida"}</b>,
           equivalente <b>${fmt(S.exif.f35,0)} mm</b>${S.exif.zoomDigital&&S.exif.zoomDigital!==1?` · zoom digital ×${fmt(S.exif.zoomDigital,1)}`:""},
           lo que corresponde a <b>×${fmt((S.exif.f35/43.27)/FDIAG_REF,2)}</b>.
           ${perfilPorExif()? "He seleccionado el perfil que encaja con esa óptica." 
             : "<b>Ninguno de tus perfiles encaja con esa óptica</b>: calíbrala o elige el perfil a mano."}
           <br><br>Ese dato solo sirve para <b>identificar</b> la lente: el fabricante redondea el equivalente, y
           usarlo para medir daría cerca del 2 % de error en cada altura.`
        : "Esta imagen no trae datos de la óptica, así que <b>el perfil se elige a mano</b>: tiene que ser el calibrado para la cámara y el modo con los que se grabó. Las fotos reenviadas por mensajería suelen perder esos datos; usa el archivo original.")}</div>`;
  }
  h += `<div class="row"><label>Distancia de observación</label><input type="number" step="0.01" id="iD" value="${S.med.d}"><span class="u">m</span></div>`;

  /* Lo que se muestra es la LECTURA: desviación respecto al plomo, cero cuando
     el móvil está recto. El ángulo del eje óptico, que es el que entra en el
     modelo, se enseña al lado solo cuando la desalineación es apreciable, para
     que la cifra grande siga contestando a «¿lo tengo recto?». */
  const dl = +perfil().delta||0, dr = +perfil().deltaRoll||0;
  const apl = (v,d) => (v===null||Math.abs(d)<0.05) ? ""
    : `<span style="color:var(--dim);font:500 12px inherit"> · eje óptico ${(v+d>=0?"+":"")+fmt(v+d,2)}°</span>`;
  if (esVivo()){
    const colR = sem.cls==="v-ok"?"var(--ok)":(sem.cls==="v-no"?"var(--bad)":"var(--warn)");
    h += `<div class="row"><label>Inclinación frontal</label>
      <div style="flex:1;font:700 17px ui-monospace,monospace">${tl===null?"—":(tl>=0?"+":"")+fmt(tl,2)+"°"}${apl(tl,dl)}</div></div>
    <div class="row"><label>Inclinación lateral</label>
      <div style="flex:1;font:700 17px ui-monospace,monospace;color:${colR}">${rl===null?"—":(rl>=0?"+":"")+fmt(rl,2)+"°"}${apl(rl,dr)}</div></div>
    ${sensorOn?"":'<div class="btns"><button class="p" id="bSens">Activar sensores</button></div>'}
    <div class="note">Estas dos cifras son la <b>desviación respecto al plomo</b> que mide el inclinómetro: valen
    0,00° con el móvil recto. El modelo no usa esa lectura directamente, le suma la desalineación del aparato
    (δ y δρ) para obtener el ángulo del eje óptico, que es otra cosa y figura en el bloque técnico.
    Al congelar, estas lecturas pasan a ser datos de la toma.</div>`;
  } else {
    h += `<div class="row"><label>Inclinación frontal</label><input type="text" inputmode="decimal" id="iPhi"
      value="${S.med.phiManual??""}" placeholder="ángulo de la toma">
      <button class="mini sg" data-f="iPhi">±</button><span class="u">°</span>
      <span style="flex:0 0 auto">${apl(tl,dl)}</span></div>
    <div class="row"><label>Inclinación lateral</label><input type="text" inputmode="decimal" id="iRoll"
      value="${S.med.rollManual??""}" placeholder="opcional">
      <button class="mini sg" data-f="iRoll">±</button><span class="u">°</span>
      <span style="flex:0 0 auto">${apl(rl,dr)}</span></div>
    <div class="note">Escribe lo que marcaba el inclinómetro al disparar, no un ángulo ya corregido: la
    desalineación del aparato la añade el modelo.</div>`;
    if (phiSupuesto()) h += `<div class="verdict v-na">Sin inclinación frontal: se supone cámara a plomo</div>`;
    else if (rl!==null && sem.cls!=="v-ok") h += `<div class="verdict ${sem.cls}">Inclinación lateral ${fmt(Math.abs(rl),1)}°: se corrige, pero deja origen y punto en la misma vertical</div>`;
  }
  if (deltaRaro(perfil())) h += `<div class="verdict v-no" style="text-align:left;font-weight:500">
    <b>El perfil activo lleva δ = ${(perfil().delta>=0?"+":"")+fmt(perfil().delta,2)}°.</b>
    Eso no es una desalineación del sensor, que sería de décimas de grado: es una calibración mal cerrada, y la
    aplicación está sumando ese ángulo a la lectura para obtener el ángulo del eje óptico. Así, con el móvil a
    plomo, el modelo cree que la cámara apunta ${fmt(perfil().delta,0)}° arriba, y la vertical de referencia no
    cruza marcas que sí están a plomo: la perspectiva se calcula con una inclinación que no es la real.
    Corrígelo en Ajustes y vuelve a calibrar anotando la lectura del inclinómetro de la toma.</div>`;

  if (T){
    h += `<div class="row"><label>Error de la distancia</label><input type="number" step="0.1" id="iUd" value="${S.med.ud}"><span class="u">%</span></div>
    <div class="row"><label>Altura del disparo</label><input type="number" step="0.01" id="iHref" value="${S.med.hRef}"><span class="u">m</span></div>
    <div class="note"><b>Altura del disparo</b>: a qué altura está la boca del mortero sobre el suelo, o sobre el plano
    al que quieras referir los resultados. Déjala en cero y las alturas salen medidas desde el propio punto de disparo, que es como
    las define la norma. Solo se usa cuando el informe tiene que darlas sobre otra referencia.
    <br><br>Los ángulos son datos <b>de la toma</b>: el sensor de ahora no sabe nada de cómo estaba la cámara
    cuando se capturó la imagen. En la inclinación frontal se teclea la lectura cruda y la aplicación añade
    δ = ${(perfil().delta>=0?"+":"")+fmt(perfil().delta,3)}°.
    <br><br><b>La inclinación frontal no tiene límite</b>: el modelo la usa como dato y no introduce error por sí misma.
    Lo que importa es que origen y punto queden a un lado y otro del centro de la imagen, vigilado por la suma
    r<sub>origen</sub> + r<sub>punto</sub>. <b>La inclinación lateral sí es error directo</b>, porque gira el eje y de la
    imagen respecto a la vertical real; se anula cuando origen y punto están en la misma vertical.</div>`;
    if (SENS.err) h += `<div class="err">${SENS.err}</div>`;
  }

  /* --- marcas y resultados en una sola tabla --- */
  h += `<h3>Marcas y alturas</h3>
  <table>
    <tr><th>Marca</th>${T?"<th>Fila y</th><th>Lateral Δx</th>":""}<th>Altura</th><th>% dist.</th><th>± incert.</th><th></th></tr>
    <tr class="${S.sel===-1?"sel":""}">
      <td><span class="dot" style="background:#ff7b40"></span><b>Origen</b></td>
      ${T?`<td>${S.marks.origen===null?"—":fmt(S.marks.origen.y,1)}</td><td>0</td>`:""}
      <td colspan="3" style="text-align:left;color:var(--dim)">${S.marks.origen===null?"sin fijar":"punto de disparo"}</td>
      <td><button class="mini mSel" data-i="-1">sel.</button></td>
    </tr>
    ${S.marks.puntos.map((q,i)=>{
      const x = R && R[i] && R[i].y!==null ? R[i] : null;
      const col = x ? (x.relU<=4?"var(--ok)":(x.relU<=8?"var(--warn)":"var(--bad)")) : "var(--dim)";
      return `<tr class="${S.sel===i?"sel":""}">
        <td><span class="dot" style="background:${COL[i%COL.length]}"></span>
            <input type="text" class="mLab" data-i="${i}" list="dlEtiq" value="${(q.lab||"").replace(/"/g,"&quot;")}"
                   placeholder="etiqueta" style="font:13px inherit">
            <input type="number" step="0.001" class="mReal" data-i="${i}" value="${q.hReal??""}"
                   placeholder="altura real (m)" style="font:12px inherit;margin-top:3px"></td>
        ${T?`<td>${q.y===null?"—":fmt(q.y,1)}</td><td>${x&&x.dx!==null?fmt(x.dx,0):"—"}</td>`:""}
        <td><b>${x?fmtH(x.H):"—"}</b></td>
        <td>${x?fmt(100*x.dr,2):"—"}</td>
        <td style="color:${col}">${x?fmtH(x.U):"—"}</td>
        <td><button class="mini mSel" data-i="${i}">sel.</button>
            ${S.marks.puntos.length>1?`<button class="mini mDel" data-i="${i}">×</button>`:""}</td>
      </tr>`;
    }).join("")}
  </table>
  <div class="btns">
    <button class="${S.sel===-1?"o":"p"}" id="bFix">Fijar ${S.sel===-1?"origen":"punto "+(S.sel+1)}</button>
    <button id="bAdd">+ punto</button>
  </div>
  ${(des||S.tecnico)?`<div class="btns"><button class="${des?"p":""}" id="bCalibAqui">Calibrar con este fotograma</button></div>`:""}
  ${!dentro()?'<div class="err">La cruz está fuera de la imagen.</div>':""}
  ${S.src?`<div class="btns"><button id="bFS">Pantalla completa</button></div>
  <div class="note">La vista ocupa toda la pantalla y quedan a mano solo elegir marca, fijarla y salir.
  El nivel sigue visible: es lo que hay que vigilar antes de disparar.</div>`:""}`;

  /* --- veredicto global --- */
  if (R){
    const hechos = R.filter(x=>x.y!==null);
    if (hechos.length){
      /* El criterio del 4 % se refiere a la ALTURA QUE SE VERIFICA, no a la más
         pequeña que se haya marcado de paso. La incertidumbre absoluta está
         dominada por el error de marcado, que es fijo, así que en alturas
         pequeñas la relativa se dispara sin que nada vaya mal: 1,4 cm sobre
         19 cm son el 7 %, y sobre 2,4 m son el 0,6 %. Juzgar por la peor
         convertía una medida sana en un suspenso. */
      const may = hechos.reduce((a,b)=>Math.abs(b.dH)>Math.abs(a.dH)?b:a);
      const sel = (S.sel>=0 && R[S.sel] && R[S.sel].y!==null) ? R[S.sel] : may;
      const peor = Math.max(...hechos.map(x=>x.relU));
      const cls = sel.relU<=4?"v-ok":(sel.relU<=8?"v-na":"v-no");
      h += `<div class="verdict ${cls}">${sel===may?"Altura mayor":"Marca "+(S.sel+1)}
        ${fmtH(sel.dH)} m · incertidumbre ${fmt(sel.relU,2)} % · ${sel.relU<=4
        ?"cumple el criterio interno de 4 %":"por encima del objetivo interno de 4 %"}</div>`;
      if (peor>sel.relU*1.5)
        h += `<div class="note">La peor de todas las marcas es ${fmt(peor,2)} %, y corresponde a la altura más
        pequeña. Es normal y no indica ningún fallo: la incertidumbre absoluta la domina el error de marcado en
        píxeles, que no depende de la altura, así que al dividir por una altura pequeña el porcentaje se dispara.
        El criterio del 4 % se refiere a la altura que se está verificando.</div>`;
      /* COMPROBACIÓN CONTRA ALTURAS CONOCIDAS.

         Con varias marcas de altura conocida se ajusta medida = a·real + b.
         Los dos coeficientes separan los dos fallos que de otro modo se
         confunden: la PENDIENTE a es un error de escala, y solo puede venir
         de la distancia de observación o de la focal del perfil; el DESFASE b
         es un error de origen, que no escala con la altura. Un residuo grande
         alrededor de esa recta ya no es ninguna de las dos cosas: es marcado
         o es que los puntos no están todos a la misma distancia.          */
      const cmp = hechos.filter(x=>x.hReal!==null&&x.hReal!==undefined&&isFinite(+x.hReal));
      if (cmp.length>=2){
        const nn=cmp.length;
        const sx=cmp.reduce((t,x)=>t+(+x.hReal),0), sy=cmp.reduce((t,x)=>t+x.dH,0);
        const sxx=cmp.reduce((t,x)=>t+(+x.hReal)*(+x.hReal),0);
        const sxy=cmp.reduce((t,x)=>t+(+x.hReal)*x.dH,0);
        const det=nn*sxx-sx*sx;
        const aE=det?(nn*sxy-sx*sy)/det:1, bE=det?(sy-aE*sx)/nn:0;
        const rr=Math.sqrt(cmp.reduce((t,x)=>t+Math.pow(x.dH-(aE*(+x.hReal)+bE),2),0)/nn);
        const escala=Math.abs(aE-1)>0.02, desfase=Math.abs(bE)>0.02*Math.abs(sy/nn)&&Math.abs(bE)>0.01;
        h += `<h3>Comprobación con alturas conocidas</h3><div class="res">
          <div class="kv"><span>marcas comparadas</span><b>${nn}</b></div>
          <div class="big"><s>Escala medida / real</s><b${escala?' style="color:var(--bad)"':''}>${fmt(aE,4)}</b></div>
          <div class="kv"><span>desfase de origen</span><b>${fmt(bE*100,1)} cm</b></div>
          <div class="kv"><span>dispersión alrededor de la recta</span><b>${fmt(rr*100,1)} cm</b></div>
        </div>
        <table><tr><th>Marca</th><th>Medida</th><th>Real</th><th>Error</th><th>%</th></tr>
        ${cmp.map(x=>`<tr><td>${x.lab||"—"}</td><td>${fmtH(x.dH)}</td><td>${fmtH(+x.hReal)}</td>
          <td>${fmtH(x.dH-(+x.hReal))}</td>
          <td style="color:${Math.abs(x.dH/(+x.hReal)-1)>0.04?"var(--bad)":"var(--ok)"}">${
            fmt(100*(x.dH/(+x.hReal)-1),1)}</td></tr>`).join("")}
        </table>`;
        if (escala) h += `<div class="verdict v-no" style="text-align:left;font-weight:500">
          <b>Error de escala de ${fmt(100*(aE-1),1)} %.</b> Todas las alturas salen multiplicadas por el mismo
          factor, y eso solo puede venir de dos sitios: la <b>distancia de observación</b> o la <b>focal del
          perfil</b>. No es marcado, no es inclinación y no es el origen, porque ninguno de esos produce un
          factor constante.<br>
          · Si la distancia fuera la causa, la real sería <b>${fmt((+S.med.d)/aE,2)} m</b> en vez de los
          ${fmt(+S.med.d,2)} m escritos. Compruébala primero, que es lo más fácil de equivocar.<br>
          · Si la distancia es correcta, entonces el perfil no corresponde a este fotograma: la focal tendría que
          ser <b>${fmt(perfil().fRel*aE,5)}</b> y no ${fmt(perfil().fRel,5)}. Eso pasa cuando la cámara se abre con
          otro recorte o con otro objetivo que cuando se calibró${zoomDe(perfil())!==null?", o con otro zoom ("
            +"el perfil es ×"+fmt(zoomDe(perfil()),2)+")":""}.</div>`;
        if (desfase) h += `<div class="verdict v-na" style="text-align:left;font-weight:500">
          <b>Desfase de origen de ${fmt(bE*100,1)} cm.</b> Un error que no escala con la altura es el origen mal
          puesto, o que el origen no está a la misma distancia de la cámara que los puntos.</div>`;
        if (!escala && !desfase) h += `<div class="verdict v-ok">Escala y origen correctos dentro del 2 %</div>`;
      }
      if (hechos.length>1)
        h += `<div class="note">Entre marcas: ` +
          hechos.slice(1).map((x,k)=>`${k+1}→${k+2} <b>${fmtH(x.dH-hechos[k].dH)} m</b>`).join(" · ") + `</div>`;
    }
  }

  h += navHTML();

  /* --- configuración de ensayo --- */
  const ENS=ensayosLee(), eAct=S.med.ensayoId?ensayoPorId(S.med.ensayoId):null;
  const sug=distanciaSugerida(eAct);
  const fR=perfil()?perfil().fRel:null;
  const Hn=+S.med.hNom, dAct=+S.med.d;
  const angV=anguloVertical(Hn,dAct), dEnc=distanciaEncuadre(Hn,fR);
  h += `<h3>Configuración de ensayo</h3>
  <div class="row"><label>Ensayo</label><select id="enSel">
    <option value="">— ninguna —</option>
    ${ENS.map(e=>`<option value="${e.id}"${e.id===S.med.ensayoId?" selected":""}>${
      e.nombre}${e.hNom?" · "+fmtEtiq(+e.hNom)+" m ±"+fmt(+e.tol,0)+" %":""}</option>`).join("")}
  </select></div>
  <div class="btns">
    <button id="enNueva">Guardar la actual como…</button>
    ${eAct?'<button id="enBorra">Borrar la seleccionada</button>':""}
  </div>
  ${sug?`<div class="res">
    <div class="kv"><span>distancia ${sug.origen==="escrita"?"del ensayo":"sugerida"}</span><b>${fmtEtiq(sug.d)} m</b></div>
    ${sug.origen==="calculada"?`<div class="kv"><span>criterio</span><b>ángulo vertical de ${ANG_OPT}°</b></div>`:""}
    <div class="btns"><button class="p" id="enUsaD">Usar ${fmtEtiq(sug.d)} m como distancia</button></div>
  </div>
  <div class="note">La distancia no se cambia sola: la que vale es la que midas en campo. Esto solo propone un
  encuadre.${sug.origen==="calculada"?" Sale de un ángulo vertical de "+ANG_OPT+"°, dentro del intervalo de 30° a 50° que la EN 16261-3, 6.10.3, señala como óptimo, con el límite en 60°.":""}</div>`:""}
  ${(Hn&&dAct)?`<div class="res">
    <div class="kv"><span>ángulo vertical a ${fmtEtiq(dAct)} m</span><b style="color:${
      angV>ANG_MAX?"var(--bad)":(angV<25||angV>55?"var(--warn)":"var(--ok)")}">${fmt(angV,0)}°</b></div>
    ${dEnc?`<div class="kv"><span>distancia mínima para que quepa</span><b style="color:${
      dAct<dEnc?"var(--bad)":"var(--ok)"}">${fmtEtiq(dEnc)} m</b></div>`:""}
  </div>
  ${angV>ANG_MAX?`<div class="verdict v-no">Ángulo vertical de ${fmt(angV,0)}°: por encima de los 60° que admite la EN 16261-3, 6.10.3. Aléjate.</div>`:""}
  ${(dEnc&&dAct<dEnc)?`<div class="verdict v-no">A esta distancia el punto de disparo y la altura declarada no caben en el mismo fotograma.</div>`:""}`:""}`;

  /* --- retícula --- */
  h += `<h3>Referencias sobre la imagen</h3>
  <div class="row"><label>Altura declarada</label><input type="number" step="0.1" id="iHnom" value="${S.med.hNom??""}"><span class="u">m</span></div>
  <div class="row"><label>Tolerancia admitida</label><input type="number" step="1" id="iTol" value="${S.med.tol}"><span class="u">%</span></div>
  <div class="btns"><button class="${S.reticula?"g":""}" id="bRet">${S.reticula?"Tolerancia ✓":"Tolerancia"}</button></div>

  <div class="row"><label>Alturas de referencia</label><input type="text" id="iAlt" value="${S.med.alturas}"><span class="u">m</span></div>
  <div class="btns"><button class="${S.med.horiz?"g":""}" id="bHor">${S.med.horiz?"Alturas ✓":"Alturas"}</button></div>

  <div class="row"><label>Desviación vertical</label><input type="text" id="iAng" value="${S.med.angulos}"><span class="u">°</span></div>
  <div class="btns"><button class="${S.med.obliq?"g":""}" id="bObl">${S.med.obliq?"Oblicuas ✓":"Oblicuas"}</button></div>
  <div class="note">Las oblicuas salen del punto de disparo y acotan la desviación respecto a la vertical, pensadas
  para voladores. Son rectas, como corresponde a la proyección de una recta del espacio, pero su separación lateral
  depende de la inclinación frontal: un punto alto queda a distinta distancia del plano imagen que el punto de disparo, y eso
  reescala la separación. Por eso <b>se recalculan al cambiar la inclinación frontal</b> en vez de trazarse con una pendiente fija.
  <br><br><b>La vertical de referencia casi nunca es una columna de la foto.</b> Una vertical del mundo solo cae sobre
  una columna si pasa por el centro óptico; fuera de él se proyecta inclinada y convergiendo hacia el horizonte, igual
  que las fachadas fotografiadas desde abajo. Se dibuja ya con esa inclinación, junto con el giro de la imagen, así que
  debe cruzar una vertical real de principio a fin. Si no la cruza, hay tres causas y se distinguen por su forma:
  desviación recta uniforme es inclinación lateral mal puesta a cero, hay que medir δρ en Calibración; desviación que se curva
  hacia los bordes es distorsión del objetivo, y conviene medir hacia el centro del fotograma; y un solo punto fuera de
  la recta es la cruz mal colocada. <b>Ninguna de las tres altera la altura medida</b> mientras origen y punto estén
  poco separados en horizontal: con inclinación frontal pura la fila de un punto depende solo de su altura y su distancia.
  <br><br><b>Limitación que conviene tener presente.</b> La imagen solo da la <b>proyección</b> del ángulo: si el
  volador se desvía hacia la cámara o alejándose de ella, el ángulo aparente es menor que el real. Un artículo que
  salga fuera de las líneas incumple con seguridad; uno que quede dentro no queda acreditado como conforme. Para
  afirmar lo segundo hacen falta dos estaciones a 90°, como pide la EN 16261-3, 6.10.3.
  <br><br>Los valores por defecto, 15° y 20/30 m, corresponden a los límites que manejamos para voladores de F2 y
  F3. <b>Confírmalos contra la edición aplicable</b> antes de usarlos en un informe: son preajustes, no una cita.</div>`;

  /* --- identificación e informe del ensayo --- */
  h += `<h3>Identificación del ensayo</h3>
  <div class="row"><label>Nº de ensayo</label><input type="text" id="eNum" value="${(S.med.nEns||"").replace(/"/g,"&quot;")}" placeholder="opcional"></div>
  <div class="row"><label>Artículo o referencia</label><input type="text" id="eRef" value="${(S.med.ref||"").replace(/"/g,"&quot;")}" placeholder="opcional"></div>
  <div class="row"><label>Lote</label><input type="text" id="eLote" value="${(S.med.lote||"").replace(/"/g,"&quot;")}" placeholder="opcional"></div>
  <div class="row"><label>Categoría</label><input type="text" id="eCat" value="${(S.med.cat||"").replace(/"/g,"&quot;")}" placeholder="F1, F2, F3, F4, T, P"></div>
  <div class="row"><label>Lugar</label><input type="text" id="eLug" value="${(S.med.lugar||"").replace(/"/g,"&quot;")}" placeholder="opcional"></div>
  <div class="row"><label>Operador</label><input type="text" id="eOp" value="${(S.med.operador||"").replace(/"/g,"&quot;")}" placeholder="opcional"></div>
  <textarea id="eObs" placeholder="Observaciones del ensayo (opcional)"
    style="width:100%;min-height:54px;background:#0d1117;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:8px;font:12.5px inherit">${(S.med.obs||"")}</textarea>
  <div class="btns">
    <button class="p" id="eInf">Informe del ensayo</button>
    <button id="eDesc">Descargar</button>
  </div>
  <div class="note">El informe recoge la identificación, la trazabilidad hasta la calibración del objetivo, las
  alturas con su incertidumbre, el presupuesto completo y, si has declarado altura nominal, el resultado frente al
  intervalo admisible indicando con qué regla de decisión. Se copia al portapapeles al generarlo.</div>
  <textarea id="eInfTxt" readonly placeholder="El informe aparece aquí"
    style="width:100%;min-height:110px;background:#0d1117;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:8px;font:11.5px ui-monospace,monospace"></textarea>`;

  /* --- bloque técnico --- */
  if (T && R){
    const hechos = R.filter(x=>x.y!==null);
    if (hechos.length){
      const sx = (S.sel>=0 && R[S.sel] && R[S.sel].y!==null) ? R[S.sel] : hechos[0];
      h += `<h3>Presupuesto de incertidumbre · ${sx.lab||"punto"}</h3>
      <table>
        <tr><th>Contribución</th><th>u (m)</th><th>%&nbsp;de&nbsp;u<sub>c</sub></th></tr>
        ${[["Distancia de observación",sx.comp.cDist],["Focal (calibración)",sx.comp.cF],
           ["Inclinación frontal φ",sx.comp.cPhi],["Inclinación lateral ρ",sx.comp.cRoll],
           ["Marcado del origen",sx.comp.cPo],["Marcado del punto",sx.comp.cPt]]
          .map(([k,v])=>`<tr><td>${k}</td><td>${fmt(v,3)}</td><td>${fmt(100*v*v/(sx.uc*sx.uc),0)}</td></tr>`).join("")}
        <tr><td><b>u<sub>c</sub></b></td><td><b>${fmt(sx.uc,3)}</b></td><td>100</td></tr>
        <tr><td><b>U (k=2)</b></td><td><b>${fmt(sx.U,3)}</b></td><td>${fmt(sx.relU,2)} %</td></tr>
      </table>
      <div class="note">r<sub>origen</sub> = ${fmt(100*sx.ro,2)} % · r<sub>punto</sub> = ${fmt(100*sx.rt,2)} % ·
      suma ${fmt(100*(sx.ro+sx.rt),2)} %, que es el factor del error de inclinación frontal y de focal.
      Separación horizontal origen-punto ${sx.dx===null?"no registrada":fmt(sx.dx,0)+" px"}${rollUsado()===null?"":", con ρ = "+fmt(rollUsado(),2)+"° ya corregida"}.
      El giro de la imagen se descuenta antes de leer la fila, así que lo que queda en el presupuesto no es la inclinación lateral sino su incertidumbre:
      (Δx/f)·sen(u<sub>ρ</sub>), con u<sub>ρ</sub> = ${fmt(rl===null?U_ROLL_DESC:U_ROLL,1)}°${rl===null?" por no haber lectura de inclinación lateral":" por el redondeo del acelerómetro"}.
      Sigue siendo preferible dejar origen y punto en la misma vertical: entonces el término se anula sin depender de nada.</div>`;
    }
  }
  if (T){
    h += `<h3>Trazabilidad</h3>
    <div class="res">
      <div class="kv"><span>perfil</span><b>${perfil().name}</b></div>
      <div class="kv"><span>fotograma</span><b>${S.src.w}×${S.src.h} px</b></div>
      <div class="kv"><span>distancia focal (f)</span><b>${fmt(g.f,1)} px (${fmt(perfil().fRel,5)})</b></div>
      <div class="kv"><span>centro óptico (y₀)</span><b>${fmt(g.y0,1)} px (${fmt(perfil().y0Rel,5)})</b></div>
      <div class="kv"><span>desalineación del sensor δ</span><b>${(perfil().delta>=0?"+":"")+fmt(perfil().delta,3)}°</b></div>
      <div class="kv"><span>desalineación lateral δρ</span><b>${((+perfil().deltaRoll||0)>=0?"+":"")+fmt(+perfil().deltaRoll||0,3)}°</b></div>
      <div class="kv"><span>lectura del inclinómetro · frontal</span><b>${tl===null?"—":(tl>=0?"+":"")+fmt(tl,3)+"°"}</b></div>
      <div class="kv"><span>ángulo del eje óptico · frontal</span><b>${tt===null?"—":(tt>=0?"+":"")+fmt(tt,3)+"°"}</b></div>
      <div class="kv"><span>lectura del inclinómetro · lateral</span><b>${rl===null?"—":(rl>=0?"+":"")+fmt(rl,3)+"°"}</b></div>
      <div class="kv"><span>giro aplicado a la imagen · lateral</span><b>${rollUsado()===null?"—":(rollUsado()>=0?"+":"")+fmt(rollUsado(),3)+"°"}</b></div>
      <div class="kv"><span>error de marcado · de inclinación frontal</span><b>${fmt(S.med.upx,1)} px · ${fmt(S.med.uphi,2)}°</b></div>
      <div class="kv"><span>factor de cobertura k</span><b>k = 2</b></div>
    </div>
    <div class="note">Modelo: r = tan(arctan((y₀−y)/f) + φ); altura = (r<sub>punto</sub> − r<sub>origen</sub>)·d.
    ${S.src.w>S.src.h?'<span style="color:var(--warn)">Fotograma en horizontal: el perfil se calibró en vertical.</span>':""}</div>`;
    if (esVivo()) h += diagHTML();
    h += glosario();
  }
  return h + tecBoton();
}

function glosario(){
  const t=[
   ["Distancia de observación, d","Del trípode al plano vertical que pasa por el punto de disparo. Todo se mide en proporción a ella."],
   ["Altura en % de la distancia, r","La altura dividida por la distancia. A 100 m de distancia, el 60 % son 60 m. Es el número que no depende de haber medido bien la distancia."],
   ["Fila en la imagen, y","En qué fila de píxeles cae la marca, contando desde el borde superior de la foto. Es la coordenada que lee el modelo."],
   ["Separación lateral, Δx","Cuántos píxeles separan el punto del origen en horizontal. Si vale cero, la inclinación lateral no introduce ningún error."],
   ["Inclinación frontal, φ","Cuánto apunta la cámara hacia arriba o hacia abajo. El modelo la usa como dato, no como error."],
   ["Inclinación lateral, ρ","Cuánto está girada la cámara sobre su propio eje, el giro que tuerce el horizonte en la foto."],
   ["Desalineación del sensor, δ","Diferencia fija entre lo que marca el sensor del móvil y hacia dónde mira realmente la lente. Es una constante de cada aparato."],
   ["Desalineación lateral, δρ","Lo mismo que δ pero en el giro: el cero de inclinación lateral del inclinómetro no coincide con las filas del sensor de imagen. También es una constante del aparato, y se mide sobre marcas puestas en una misma vertical."],
   ["Convergencia de verticales","Una vertical del mundo solo cae sobre una columna de la foto si pasa por el centro óptico. Fuera de él sale inclinada, igual que las fachadas fotografiadas desde abajo. No es un defecto del equipo y no altera las alturas medidas."],
   ["Focal, f","La distancia focal del objetivo expresada en píxeles de la imagen. Fija la escala angular de la foto."],
   ["Centro óptico, y₀","La fila de la imagen que atraviesa el eje de la lente. Casi, pero no exactamente, el centro del fotograma."],
   ["Columna del centro óptico, x₀","La columna equivalente a y₀. La calibración no la determina, porque las marcas están todas en una vertical, así que se supone el centro del fotograma: de ahí sale el ±0,09° de la medida de inclinación lateral."],
   ["Incertidumbre típica, u","El margen de error que aporta una causa concreta, expresado a una desviación típica."],
   ["Incertidumbre combinada, u_c","Todas las contribuciones sumadas en cuadratura, es decir por la raíz de la suma de cuadrados."],
   ["Incertidumbre ampliada, U","El margen final que se declara. Con k = 2 abarca en torno al 95 % de los casos."],
   ["Factor de cobertura, k","El multiplicador que convierte u_c en U. Aquí siempre 2."],
   ["Altura del disparo","A qué altura está la boca del mortero sobre el plano al que se refieren los resultados. En cero, las alturas se dan desde el propio punto de disparo, que es como las define la norma."]
  ];
  return `<h3>Qué significa cada término</h3><table>
    ${t.map(([k,v])=>`<tr><td style="width:38%"><b>${k}</b></td><td style="text-align:left;color:var(--dim)">${v}</td></tr>`).join("")}
  </table>`;
}

function tecBoton(){
  return `<div class="btns" style="margin-top:16px">
    <button class="${S.tecnico?"g":""}" id="bTec">${S.tecnico
      ?"Ocultar detalle técnico":"Mostrar detalle técnico"}</button></div>
  <div class="note">El detalle técnico despliega el presupuesto de incertidumbre, las coordenadas en píxeles
  y los parámetros del modelo: es lo que justifica la medida ante un organismo notificado. Para medir en campo no hace falta.</div>`;
}

/* Una sola decisión por contexto. Si la imagen viene de una captura, el
   objetivo es un HECHO y se afirma; solo cuando viene de un archivo, y la
   página no puede saberlo, se ofrece como elección. */
function bloqueObjetivo(){
  if (S.calib.uso!=="vivo"){
    const u=S.calib.uso||"foto";
    return `<h3>¿De qué cámara es ${u==="video"?"este vídeo":"esta foto"}?</h3>
    <div class="row"><label>Cámara</label><select id="cCam">
      <option value=""${S.calib.camaraId?"":" selected"}>— elige o crea una —</option>
      ${S.camaras.map(c=>`<option value="${c.id}"${c.id===S.calib.camaraId?" selected":""}>${c.nombre}${
        perfilDe(c.id,u)?"  ·  ya calibrada para "+USOS[u]:""}</option>`).join("")}
    </select></div>
    <div class="btns"><button id="cNuevaCam">Crear una cámara para esta ${u==="video"?"grabación":"foto"}</button></div>
    <div class="note">El perfil quedará asociado a esa cámara y a este uso, de modo que cuando te manden otra
    ${u==="video"?"grabación":"foto"} del mismo origen lo encuentres por su nombre.
    ${S.exif&&(S.exif.marca||S.exif.modelo)?`El archivo dice que se tomó con <b>${[S.exif.marca,S.exif.modelo].filter(Boolean).join(" ")}</b>${S.exif.f35?`, equivalente ${fmt(S.exif.f35,0)} mm`:""}.`:""}</div>`;
  }
  if (S.calib.origen==="captura" && S.calib.camaraId)
    return `<div class="card" style="padding:10px;border-color:var(--acc)">
      <div class="big"><s>Calibrando la cámara</s><b style="font-size:17px">${nombreCamara(S.calib.camaraId)}</b></div>
      <div class="kv"><span>fotograma</span><b>${S.src.w}×${S.src.h} px</b></div></div>`;
  return `<h3>¿A qué cámara corresponde?</h3>
    <div class="row"><label>Cámara</label><select id="cCam">
      <option value=""${S.calib.camaraId?"":" selected"}>— ninguna —</option>
